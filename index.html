const BALANCE = {
  burnDamage: 14,
  freezeDuration: 1,
  chainZapDamage: 12,
  starMultiplierBonus: 1.35,
  guardMultiplier: 0.60,
  campfireHealPercent: 0.40,
  enemyBaseDamage: 12,
  enemyWaveDamage: 3.5,
  turnMpRegen: 7,
  grailBonusMp: 4,
  skipMp: 9,
  manaTileMp: 15,
  poisonTileDamage: 6,
  doomDamage: 26,
  quillHeal: 14,

  magmaFireBonus: 14,
  crisisThreshold: 0.35,
  crisisMultiplier: 1.4,
  maxParticles: 450
};

function getEnemyAttackPower(wave, isCaster = false) {
  if (isCaster) return 12 + wave * 4;
  return Math.round(BALANCE.enemyBaseDamage + wave * BALANCE.enemyWaveDamage);
}

const AudioSys = {
  ctx: null,
  bgmInterval: null,
  bgmPlaying: false,
  step: 0,

  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },

  toggleBgm() {
    this.init();
    if (this.bgmPlaying) this.stopBgm();
    else this.startBgm();
  },

  startBgm() {
    if (this.bgmPlaying) return;
    this.bgmPlaying = true;
    const bass = [110, 110, 130.81, 146.83, 110, 164.81, 146.83, 123.47];
    const leads = [220, 0, 261.63, 293.66, 329.63, 392.00, 293.66, 246.94];

    this.bgmInterval = setInterval(() => {
      if (!this.ctx || !this.bgmPlaying) return;
      const t = this.ctx.currentTime;

      const bassFreq = bass[this.step % bass.length];
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(bassFreq, t);
      gain.gain.setValueAtTime(0.07, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.17);

      const leadFreq = leads[this.step % leads.length];
      if (leadFreq > 0 && Math.random() < 0.88) {
        const losc = this.ctx.createOscillator();
        const lgain = this.ctx.createGain();
        losc.type = 'square';
        losc.frequency.setValueAtTime(leadFreq, t);
        lgain.gain.setValueAtTime(0.025, t);
        lgain.gain.exponentialRampToValueAtTime(0.001, t + 0.20);
        losc.connect(lgain);
        lgain.connect(this.ctx.destination);
        losc.start(t);
        losc.stop(t + 0.20);
      }
      this.step++;
    }, 175);
  },

  stopBgm() {
    this.bgmPlaying = false;
    if (this.bgmInterval) {
      clearInterval(this.bgmInterval);
      this.bgmInterval = null;
    }
  },

  playSelect(pitch = 440) {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(pitch, this.ctx.currentTime);
    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.08);
  },

  playSlash() {
    if (!this.ctx) return;
    const node = this.ctx.createBufferSource();
    const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.15, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;
    node.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(1400, this.ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.15);
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
    node.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    node.start();
  },

  playBow() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(240, this.ctx.currentTime + 0.18);
    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.18);
  },

  playMagic() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(320, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(960, this.ctx.currentTime + 0.28);
    gain.gain.setValueAtTime(0.22, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.3);
  },

  playFreeze() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1100, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1600, this.ctx.currentTime + 0.22);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.25);
  },

  playZap() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(700, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(180, this.ctx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.26, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.15);
  },

  playHeal() {
    if (!this.ctx) return;
    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.05);
      gain.gain.setValueAtTime(0.12, this.ctx.currentTime + i * 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.05 + 0.2);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + i * 0.05);
      osc.stop(this.ctx.currentTime + i * 0.05 + 0.2);
    });
  },

  playSubmitSuccess(len) {
    if (!this.ctx) return;
    const base = 480;
    const notes = [base, base * 1.25, base * 1.5, base * (1 + len * 0.15)];
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.05);
      gain.gain.setValueAtTime(0.14, this.ctx.currentTime + idx * 0.05);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.05 + 0.16);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + idx * 0.05);
      osc.stop(this.ctx.currentTime + idx * 0.05 + 0.16);
    });
  },

  playSpecial() {
    if (!this.ctx) return;
    [580, 780, 1050, 1400].forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.04);
      gain.gain.setValueAtTime(0.14, this.ctx.currentTime + idx * 0.04);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.04 + 0.14);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + idx * 0.04);
      osc.stop(this.ctx.currentTime + idx * 0.04 + 0.14);
    });
  },

  playCampfire() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(330, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(660, this.ctx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.14, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.45);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.45);
  },

  playExplode() {
    if (!this.ctx) return;
    const node = this.ctx.createBufferSource();
    const buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.35, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;
    node.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(450, this.ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.35);
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
    node.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    node.start();
  }
};

const SPRITE_SIZE = 24;
const SPRITE_SCALE = 3;

class PixelCanvas {
  constructor(w = SPRITE_SIZE, h = SPRITE_SIZE) {
    this.canvas = document.createElement("canvas");
    this.canvas.width = w;
    this.canvas.height = h;
    this.ctx = this.canvas.getContext("2d");
    this.ctx.imageSmoothingEnabled = false;
  }
  px(x, y, color) {
    if (x < 0 || x >= SPRITE_SIZE || y < 0 || y >= SPRITE_SIZE) return;
    this.ctx.fillStyle = color;
    this.ctx.fillRect(Math.floor(x), Math.floor(y), 1, 1);
  }
  rect(x, y, w, h, color) {
    this.ctx.fillStyle = color;
    this.ctx.fillRect(Math.floor(x), Math.floor(y), Math.floor(w), Math.floor(h));
  }
}

const SpriteLibrary = {
  sprites: {},
  init() {
    this.sprites["warrior_idle_0"] = this.buildWarrior(0, "idle");
    this.sprites["warrior_idle_1"] = this.buildWarrior(1, "idle");
    this.sprites["warrior_walk_0"] = this.buildWarrior(0, "walk");
    this.sprites["warrior_walk_1"] = this.buildWarrior(1, "walk");
    this.sprites["warrior_act"]    = this.buildWarrior(0, "act");

    this.sprites["ranger_idle_0"] = this.buildRanger(0, "idle");
    this.sprites["ranger_idle_1"] = this.buildRanger(1, "idle");
    this.sprites["ranger_walk_0"] = this.buildRanger(0, "walk");
    this.sprites["ranger_walk_1"] = this.buildRanger(1, "walk");
    this.sprites["ranger_act"]    = this.buildRanger(0, "act");

    this.sprites["mage_idle_0"] = this.buildMage(0, "idle");
    this.sprites["mage_idle_1"] = this.buildMage(1, "idle");
    this.sprites["mage_walk_0"] = this.buildMage(0, "walk");
    this.sprites["mage_walk_1"] = this.buildMage(1, "walk");
    this.sprites["mage_act"]    = this.buildMage(0, "act");

    this.sprites["cleric_idle_0"] = this.buildCleric(0, "idle");
    this.sprites["cleric_idle_1"] = this.buildCleric(1, "idle");
    this.sprites["cleric_walk_0"] = this.buildCleric(0, "walk");
    this.sprites["cleric_walk_1"] = this.buildCleric(1, "walk");
    this.sprites["cleric_act"]    = this.buildCleric(0, "act");

    this.sprites["orc_idle_0"] = this.buildOrc(0, "idle");

    this.sprites["orc_act"]    = this.buildOrc(0, "act");

    this.sprites["drakonit_idle_0"] = this.buildDrakonit(0, "idle");
    this.sprites["drakonit_idle_1"] = this.buildDrakonit(1, "idle");
    this.sprites["drakonit_act"]    = this.buildDrakonit(0, "act");

    this.sprites["slime_idle_0"] = this.buildSlime(0, "idle");
    this.sprites["slime_idle_1"] = this.buildSlime(1, "idle");
    this.sprites["slime_act"]    = this.buildSlime(0, "act");

    this.sprites["golem_idle_0"] = this.buildGolem(0, "idle");
    this.sprites["golem_idle_1"] = this.buildGolem(1, "idle");
    this.sprites["golem_act"]    = this.buildGolem(0, "act");

    this.sprites["wyrm_idle_0"] = this.buildWyrm(0, "idle");
    this.sprites["wyrm_idle_1"] = this.buildWyrm(1, "idle");
    this.sprites["wyrm_act"]    = this.buildWyrm(0, "act");
  },

  buildWarrior(frame, state) {
    const pc = new PixelCanvas();
    const isWalk = state === "walk";
    const bob = (isWalk || frame === 1) ? 1 : 0;
    const isAct = state === "act";
    pc.rect(6, 21, 12, 2, "rgba(0,0,0,0.45)");
    pc.rect(7, 9 + bob, 10, 10, "#991b1b");
    pc.rect(6, 12 + bob, 2, 7, "#7f1d1d");

    if (isWalk) {
      if (frame === 0) {
        pc.rect(6, 19, 4, 3, "#334155");
        pc.rect(14, 18, 4, 3, "#1e293b");
      } else {
        pc.rect(8, 18, 4, 3, "#334155");
        pc.rect(12, 19, 4, 3, "#1e293b");
      }
    } else {
      pc.rect(7, 19, 4, 3, "#334155");
      pc.rect(13, 19, 4, 3, "#1e293b");
    }

    pc.rect(8, 15 + bob, 3, 4, "#475569");
    pc.rect(13, 15 + bob, 3, 4, "#334155");
    pc.rect(8, 8 + bob, 8, 7, "#64748b");
    pc.rect(9, 9 + bob, 6, 5, "#94a3b8");
    pc.rect(11, 10 + bob, 2, 4, "#cbd5e1");
    pc.rect(8, 3 + bob, 8, 6, "#64748b");
    pc.rect(9, 4 + bob, 6, 4, "#94a3b8");
    pc.rect(9, 6 + bob, 6, 2, "#0f172a");
    pc.px(10, 6 + bob, "#38bdf8");
    pc.px(13, 6 + bob, "#38bdf8");
    pc.rect(10, 0 + bob, 4, 3, "#ef4444");
    pc.rect(15, 8 + bob, 6, 9, "#1e293b");
    pc.rect(16, 9 + bob, 4, 7, "#3b82f6");
    if (isAct) {
      pc.rect(3, 7 + bob, 2, 7, "#eab308");
      pc.rect(0, 9 + bob, 3, 3, "#e2e8f0");
    } else {
      pc.rect(2, 6 + bob, 3, 2, "#eab308");
      pc.rect(2, 2 + bob, 3, 6, "#f1f5f9");
    }
    return pc.canvas;
  },

  buildRanger(frame, state) {

    const isAct = state === "act";
    pc.rect(6, 21, 12, 2, "rgba(0,0,0,0.45)");

    if (isWalk) {

      pc.rect(8, 19, 4, 3, "#78350f");
      pc.rect(12, 19, 4, 3, "#451a03");

    pc.rect(8, 3 + bob, 8, 6, "#166534");

    const isWalk = state === "walk";
    const bob = (isWalk || frame === 1) ? 1 : 0;
    const isAct = state === "act";

    pc.rect(7, 10 + bob, 10, 10, "#312e81");
    pc.rect(6, 14 + bob, 12, 6, "#1e1b4b");
    if (isWalk) {
      if (frame === 0) {
        pc.rect(7, 20, 4, 2, "#0f172a");
        pc.rect(13, 19, 4, 2, "#0f172a");

        pc.rect(11, 20, 4, 2, "#0f172a");

  buildCleric(frame, state) {

    const bob = (isWalk || frame === 1) ? 1 : 0;
    const isAct = state === "act";
    pc.rect(6, 21, 12, 2, "rgba(0,0,0,0.45)");
    pc.rect(7, 9 + bob, 10, 11, "#f1f5f9");
    pc.rect(9, 9 + bob, 6, 11, "#cbd5e1");
    if (isWalk) {
      if (frame === 0) {
        pc.rect(7, 20, 3, 2, "#64748b");
        pc.rect(14, 19, 3, 2, "#64748b");
      } else {
        pc.rect(8, 19, 3, 2, "#64748b");
        pc.rect(13, 20, 3, 2, "#64748b");

    pc.rect(6, 7 + bob, 12, 11, "#15803d");

function startWalkInTransition() {
  STATE.turnPhase = "HERO_WALK_IN";
  STATE.walkDirection = "IN";
  STATE.transitionTimer = performance.now();
  heroes.forEach((h, idx) => {
    h.x = canvas.width + 60 + idx * 85;
    h.y = h.baseY;
    h.isActing = false;
    h.animOffset = 0;
  });
}

function startWalkOutTransition() {
  STATE.turnPhase = "HERO_WALK_OUT";
  STATE.walkDirection = "OUT";
  STATE.transitionTimer = performance.now();
}

function updateHeroWalking(dt) {
  const timeScale = Math.min(2.5, dt / 16.66);
  const walkSpeed = 3.6 * timeScale;

  if (STATE.turnPhase === "HERO_WALK_IN") {
    let allInPosition = true;
    heroes.forEach((h) => {
      if (h.hp > 0 || STATE.wave === 1) {
        if (h.x > h.baseX) {
          h.x = Math.max(h.baseX, h.x - walkSpeed);
          allInPosition = false;
        }
      }
    });

    if (allInPosition) {
      STATE.turnPhase = "HERO_INPUT";
      STATE.activeHeroIndex = Math.max(0, heroes.findIndex(h => h.hp > 0));
      STATE.selectedSkillIndex = 0;
      normalizeSelectedTarget();
      refreshEnemyIntents();
      spawnDamageNumber(canvas.width / 2, 190, `⚔️ RUANG ${STATE.wave}: BERSIAP BERTARUNG! ⚔`, "#facc15", true);
    }
  } else if (STATE.turnPhase === "HERO_WALK_OUT") {
    let allExited = true;
    heroes.forEach((h) => {
      if (h.hp > 0) {
        h.x -= walkSpeed * 1.25;
        if (h.x > -80) {
          allExited = false;
        }
      }
    });

    if (allExited) {
      if (STATE.wave >= WAVES.length) {
        STATE.turnPhase = "VICTORY";
        STATE.overSince = performance.now();
      } else {
        triggerCampfireIntermission();
      }
    }
  }
}

function changeMp(entity, delta) {
  if (!entity) return 0;
  const before = entity.mp;
  entity.mp = Math.max(0, Math.min(entity.maxMp, entity.mp + Math.round(delta)));
  return entity.mp - before;
}

function beginAction() {
  STATE.turnId++;
  STATE.projectileLedger = { actionId: STATE.turnId, pending: 0 };
  return STATE.turnId;
}

function isActionValid(id) {
  return id === STATE.turnId && !isCombatFinished();
}

function isCombatFinished() {
  return STATE.turnPhase === "GAME_OVER" || STATE.turnPhase === "VICTORY";
}

function canPlayerAct() {
  return STATE.turnPhase === "HERO_INPUT" && !STATE.boardLocked && !isCombatFinished();
}

function normalizeSelectedTarget() {
  if (enemies[STATE.selectedEnemyIndex] && enemies[STATE.selectedEnemyIndex].hp > 0) return;
  const firstAlive = enemies.findIndex(e => e.hp > 0);
  STATE.selectedEnemyIndex = firstAlive >= 0 ? firstAlive : 0;
}

function getSelectedTarget() {
  normalizeSelectedTarget();
  return enemies[STATE.selectedEnemyIndex] && enemies[STATE.selectedEnemyIndex].hp > 0
    ? enemies[STATE.selectedEnemyIndex]
    : null;
}

function refreshEnemyIntents() {
  rollEnemyIntents(enemies, STATE.wave);
}

function rollEnemyIntents(enemyList, wave) {
  const currentWave = wave !== undefined ? wave : STATE.wave;
  enemyList.forEach(en => {
    if (en.hp <= 0) return;
    if (en.frozen) {
      en.intent = { type: "FROZEN", desc: "❄️ Membeku" };
      return;
    }
    if (en.stunned) {
      en.intent = { type: "STUN", desc: "💫 Pusing" };
      return;
    }

    const catalog = ENEMY_CATALOG[en.catalogKey] || {};
    const actions = catalog.actions || [
      { type: "ATTACK", weight: 100, powerMod: 0, desc: (v) => `⚔️ ${v}` }
    ];

    const totalWeight = actions.reduce((sum, act) => sum + (act.weight || 1), 0);
    let roll = Math.random() * totalWeight;
    let chosen = actions[0];
    for (const act of actions) {
      roll -= (act.weight || 1);
      if (roll <= 0) {
        chosen = act;
        break;
      }
    }

    const isCaster = en.role === "Caster" || chosen.type === "MAGIC_AOE";
    const basePwr = getEnemyAttackPower(currentWave, isCaster);
    const pwr = Math.max(1, basePwr + (chosen.powerMod || 0));

    en.intent = {
      type: chosen.type,
      val: pwr,
      desc: chosen.desc ? chosen.desc(pwr) : `⚔ ${pwr}`
    };
  });
}

function makeWave(n) {
  const xs = [320, 180];
  const waveKeys = WAVES[n - 1] || WAVES[WAVES.length - 1];
  const list = waveKeys.map((key, i) => {
    const data = ENEMY_CATALOG[key] || { name: "Monster", spriteKey: "orc", role: "Brute", maxHp: 150 };
    return new Entity(data.name, data.spriteKey, data.role, data.maxHp, 0, xs[i] || (320 - i * 140), 160, false, key);
  });
  rollEnemyIntents(list, n);
  return list;
}

let enemies = makeWave(1);

function applyDamage(source, target, amount, options = {}) {
  if (!target || target.hp <= 0) return 0;

  const before = target.hp;
  let finalDamage = Math.max(0, Math.round(amount));

  if (options.damageMultiplier) {
    finalDamage = Math.round(finalDamage * options.damageMultiplier);
  }

  if (target.isHero && STATE.partyGuardTurns > 0) {
    finalDamage = Math.round(finalDamage * BALANCE.guardMultiplier);
  }

  target.hp = Math.max(0, target.hp - finalDamage);
  const actualDamage = before - target.hp;

  if (source && source.isHero) {
    STATE.stats.totalDamageDealt += actualDamage;

    if (STATE.relics.some(r => r.id === "vampire") && actualDamage > 0) {
      const healAmt = Math.round(actualDamage * BALANCE.vampireLeechPercent);
      if (healAmt > 0) {
        applyHealing(source, source, healAmt, { yOffset: 65 });
      }
    }
  }

  const label = options.label || (actualDamage > 0 ? `-${actualDamage}` : "MISS");
  const color = options.color || (options.isCrit ? "#fbbf24" : target.isHero ? "#ef4444" : "#ffffff");
  spawnDamageNumber(target.x, target.y - (options.yOffset || 30), label, color);
  spawnParticles(target.x, target.y, options.particleColor || (target.isHero ? "#ef4444" : "#f97316"), options.particleCount || 20);

  if (options.isCrit) {
    STATE.hitFreezeTimer = 65;
    STATE.screenShake = 12;
  } else if (finalDamage > 16) {
    STATE.screenShake = Math.max(STATE.screenShake, 6);
  }

  if (target.hp <= 0) {
    target.isActing = false;
    target.animOffset = 0;
    if (!target.isHero) {
      target.stunned = false;
      target.frozen = false;
      target.burnTurns = 0;
      target.poisonTurns = 0;
      target.intent = null;
      normalizeSelectedTarget();
    } else {
      if (heroes.every(h => h.hp <= 0)) {
        STATE.turnPhase = "GAME_OVER";
        STATE.overSince = performance.now();
        beginAction();
      }
    }
  }

  return actualDamage;
}

function applyHealing(source, target, amount, options = {}) {
  if (!target || target.hp <= 0) return 0;
  const before = target.hp;
  target.hp = Math.min(target.maxHp, target.hp + Math.max(0, Math.round(amount)));
  const actualHealed = target.hp - before;

  if (actualHealed > 0) {
    spawnDamageNumber(target.x, target.y - (options.yOffset || 30), `+${actualHealed}`, "#4ade80");
    spawnParticles(target.x, target.y, "#4ade80", 18);
  }
  return actualHealed;
}

function clearDoomTile(tile) {
  tile.special = "NORMAL";
  tile.doomCount = 0;
}

function tickDoomTiles() {
  for (let r = 0; r < GRID.rows; r++) {
    for (let c = 0; c < GRID.cols; c++) {
      const tile = GRID.board[r][c];
      if (tile.special === "DOOM" && tile.doomCount > 0) {
        tile.doomCount--;
        if (tile.doomCount <= 0) {
          explodeDoomTile(tile);
        }
      }
    }
  }
}

function explodeDoomTile(tile) {
  clearDoomTile(tile);
  AudioSys.playExplode();
  STATE.screenShake = 16;
  const aliveHeroes = heroes.filter(h => h.hp > 0);
  if (aliveHeroes.length > 0) {
    const randomHero = aliveHeroes[Math.floor(Math.random() * aliveHeroes.length)];
    applyDamage(null, randomHero, BALANCE.doomDamage, {
      color: "#ef4444",
      particleColor: "#f97316",
      particleCount: 28,
      yOffset: 60
    });
  }
}

function finishHeroAction(actionId) {
  if (!isActionValid(actionId) || isCombatFinished()) return;
  const hero = heroes[STATE.activeHeroIndex];
  if (hero) {
    hero.animOffset = 0;
    hero.isActing = false;
  }
  setTimeout(() => {
    if (!isActionValid(actionId) || isCombatFinished()) return;
    advanceTurn();
  }, 280);
}

function createProjectile(config) {
  if (config.countPending !== false) {
    if (STATE.projectileLedger.actionId === config.actionId) {
      STATE.projectileLedger.pending++;
    } else {
      STATE.projectileLedger = { actionId: config.actionId, pending: 1 };
    }
  }
  STATE.projectiles.push({
    x: config.x,
    y: config.y,
    targetX: config.targetX,
    targetY: config.targetY,
    color: config.color,
    trailColor: config.trailColor,
    size: config.size || 14,
    type: config.type || "slash",
    actionId: config.actionId,
    onHit: config.onHit
  });
}

function resolveProjectile(p) {
  if (isActionValid(p.actionId) && typeof p.onHit === "function") {
    p.onHit();
  }
  if (STATE.projectileLedger.actionId === p.actionId) {
    STATE.projectileLedger.pending = Math.max(0, STATE.projectileLedger.pending - 1);
    if (STATE.projectileLedger.pending === 0 && isActionValid(p.actionId) && STATE.turnPhase === "HERO_ACTION") {
      finishHeroAction(p.actionId);
    }
  }
}

const VOWELS = "AAAAAEEEEIIIIOOOOUUU";
const CONSONANTS = "BBCCDDDFFGGHHHJKKLLLMMMNNNNNPPQRRRRSSSSTTTTTWWYVZZX";

function getRandomTileSpecial() {
  const roll = Math.random();
  if (roll < 0.06) return "FIRE";
  if (roll < 0.11) return "FROST";
  if (roll < 0.16) return "LIGHTNING";
  if (roll < 0.20) return "STAR";
  if (roll < 0.26) return "MANA";
  if (roll < 0.31) return "SHIELD";
  if (roll < 0.35) return "POISON";
  return "NORMAL";
}

function getRandomLetter(forceVowel = false) {
  if (forceVowel) return VOWELS[Math.floor(Math.random() * VOWELS.length)];
  const pool = Math.random() < 0.28 ? VOWELS : CONSONANTS;
  return pool[Math.floor(Math.random() * pool.length)];
}

const GRID = {
  rows: 4,
  cols: 4,
  tileSize: 56,
  gap: 8,
  startX: 35,
  startY: 375,
  board: []
};

function enforceVowelCompass() {
  if (!STATE || !STATE.relics.some(r => r.id === "compass")) return;
  let vowelPositions = [];
  let consonantPositions = [];
  for (let r = 0; r < GRID.rows; r++) {
    for (let c = 0; c < GRID.cols; c++) {
      if (VOWELS.includes(GRID.board[r][c].char)) vowelPositions.push({ r, c });
      else consonantPositions.push({ r, c });
    }
  }
  const needed = 6 - vowelPositions.length;
  if (needed > 0 && consonantPositions.length > 0) {
    const shuffled = consonantPositions.sort(() => Math.random() - 0.5);
    for (let i = 0; i < Math.min(needed, shuffled.length); i++) {
      const pos = shuffled[i];
      GRID.board[pos.r][pos.c].char = getRandomLetter(true);
    }
  }
}

function initGrid() {
  GRID.board = [];
  for (let r = 0; r < GRID.rows; r++) {
    GRID.board[r] = [];
    for (let c = 0; c < GRID.cols; c++) {
      GRID.board[r][c] = {
        char: getRandomLetter((r + c) % 4 === 0),
        special: getRandomTileSpecial(),
        doomCount: 0,
        animOffsetY: - (GRID.rows - r) * 70,
        vy: 0
      };
    }
  }
  enforceVowelCompass();
}

function replenishGridCascading(usedCoords) {
  STATE.boardLocked = true;
  const lockId = ++STATE.boardLockId;
  const toRemove = Array.from({ length: GRID.rows }, () => Array(GRID.cols).fill(false));
  usedCoords.forEach(p => { toRemove[p.r][p.c] = true; });

  for (let c = 0; c < GRID.cols; c++) {
    const surviving = [];
    for (let r = 0; r < GRID.rows; r++) {
      if (!toRemove[r][c]) {
        surviving.push(GRID.board[r][c]);
      }
    }

    const emptyCount = GRID.rows - surviving.length;
    const newTiles = [];
    for (let i = 0; i < emptyCount; i++) {
      newTiles.push({
        char: getRandomLetter(i === 0),
        special: getRandomTileSpecial(),
        doomCount: 0,
        animOffsetY: - (emptyCount - i) * 65 - 30,
        vy: 0
      });
    }

    const finalCol = newTiles.concat(surviving);
    for (let r = 0; r < GRID.rows; r++) {
      const tile = finalCol[r];
      const originalRow = surviving.indexOf(tile);
      if (originalRow !== -1 && originalRow + emptyCount === r) {
        tile.animOffsetY = - emptyCount * (GRID.tileSize + GRID.gap);
      } else if (originalRow !== -1 && originalRow === r) {
        tile.animOffsetY = 0;
      }
      GRID.board[r][c] = tile;
    }
  }

  enforceVowelCompass();

  setTimeout(() => {
    if (STATE.boardLockId === lockId && STATE.boardLocked) {
      STATE.boardLocked = false;
    }
  }, 500);
}

function updateGridPhysics() {
  let allSettled = true;
  for (let r = 0; r < GRID.rows; r++) {
    for (let c = 0; c < GRID.cols; c++) {
      const tile = GRID.board[r][c];
      if (tile && tile.animOffsetY < 0) {
        allSettled = false;
        tile.vy = (tile.vy || 0) + 1.8;
        tile.animOffsetY += tile.vy;
        if (tile.animOffsetY >= 0) {
          tile.animOffsetY = 0;
          tile.vy = - tile.vy * 0.28;
          if (Math.abs(tile.vy) < 0.6) tile.vy = 0;
        }
      }
    }
  }
  if (allSettled && STATE.boardLocked && STATE.turnPhase === "HERO_INPUT") {
    STATE.boardLocked = false;
  }
}

function plantDoomTile() {
  const candidates = [];
  for (let r = 0; r < GRID.rows; r++) {
    for (let c = 0; c < GRID.cols; c++) {
      if (GRID.board[r][c].special !== "DOOM") candidates.push({ r, c });
    }
  }
  if (candidates.length > 0) {
    const choice = candidates[Math.floor(Math.random() * candidates.length)];
    const tile = GRID.board[choice.r][choice.c];
    tile.special = "DOOM";
    tile.doomCount = 3;
    spawnDamageNumber(
      GRID.startX + choice.c * (GRID.tileSize + GRID.gap) + 28,
      GRID.startY + choice.r * (GRID.tileSize + GRID.gap),
      "💣 KUTUK BOM!",
      "#f97316"
    );
  }
}

function normalizeWord(word) {
  return String(word).trim().toUpperCase();
}

function getWordMultiplier(len, isRecognized) {
  if (len < 3) return 0;
  if (!isRecognized) return 0.6;
  if (len === 3) return 1.3;
  if (len === 4) return 1.8;
  if (len === 5) return 2.4;
  if (len === 6) return 3.1;
  return 4.2;
}

function analyzeWord(rawWord, hero) {
  const word = normalizeWord(rawWord);
  const valid = DICTIONARY.has(word);
  const syn = valid && THEMES[hero.spriteKey] && THEMES[hero.spriteKey].has(word);
  let mult = getWordMultiplier(word.length, valid);
  if (syn) mult = Math.round(mult * 1.5 * 10) / 10;

  const hasStarTile = STATE.selectedChain.some(p => GRID.board[p.r] && GRID.board[p.r][p.c].special === "STAR");
  if (hasStarTile) {
    mult = Math.round(mult * BALANCE.starMultiplierBonus * 10) / 10;
  }

  if (STATE.relics.some(r => r.id === "martyr")) {
    const isCrisis = heroes.some(h => h.hp > 0 && (h.hp / h.maxHp) < BALANCE.crisisThreshold);
    if (isCrisis) mult = Math.round(mult * BALANCE.crisisMultiplier * 10) / 10;
  }
  return { valid, syn: !!syn, mult };
}

function updateWordSelection(newWord) {
  STATE.currentWord = newWord;
  const hero = heroes[STATE.activeHeroIndex];
  if (STATE.currentWord.length >= 3 && hero) {
    STATE.wordAnalysis = analyzeWord(STATE.currentWord, hero);
  } else {
    STATE.wordAnalysis = null;
  }
}

function typeLetterOnBoard(char) {
  if (!canPlayerAct()) return;
  const targetChar = char.toUpperCase();
  const chain = STATE.selectedChain;

  if (chain.length === 0) {
    for (let r = 0; r < GRID.rows; r++) {
      for (let c = 0; c < GRID.cols; c++) {
        if (GRID.board[r][c].char === targetChar) {
          tryAddTile({ r, c });
          return;
        }
      }
    }
    return;
  }

  const last = chain[chain.length - 1];
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = last.r + dr;
      const nc = last.c + dc;
      if (nr >= 0 && nr < GRID.rows && nc >= 0 && nc < GRID.cols) {
        if (GRID.board[nr][nc].char === targetChar && !chain.some(p => p.r === nr && p.c === nc)) {
          tryAddTile({ r: nr, c: nc });
          return;
        }
      }
    }
  }
}

const BTN_SUBMIT  = { x: 295, y: 415, w: 155, h: 48 };
const BTN_RUSH    = { x: 295, y: 470, w: 155, h: 44 };
const BTN_CLEAR   = { x: 295, y: 520, w: 155, h: 36 };
const BTN_SHUFFLE = { x: 295, y: 562, w: 155, h: 34 };
const BTN_SKIP    = { x: 295, y: 602, w: 155, h: 32 };

const SKILL_BTNS = [
  { x: 475, y: 460, w: 235, h: 64 },
  { x: 725, y: 460, w: 235, h: 64 }
];

const BTN_BGM = { x: 865, y: 12, w: 98, h: 26 };
const BTN_CRT = { x: 760, y: 12, w: 98, h: 26 };

const BTN_TITLE_START = { x: 340, y: 440, w: 300, h: 56 };
const BTN_TITLE_GUIDE = { x: 380, y: 515, w: 220, h: 40 };

function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

function getTileAt(x, y) {
  for (let r = 0; r < GRID.rows; r++) {
    for (let c = 0; c < GRID.cols; c++) {
      const tx = GRID.startX + c * (GRID.tileSize + GRID.gap);
      const ty = GRID.startY + r * (GRID.tileSize + GRID.gap);
      if (x >= tx && x <= tx + GRID.tileSize && y >= ty && y <= ty + GRID.tileSize) {
        return { r, c };
      }
    }
  }
  return null;
}

function isAdjacent(p1, p2) {
  return Math.abs(p1.r - p2.r) <= 1 && Math.abs(p1.c - p2.c) <= 1;
}

function tryAddTile(tile) {
  if (!tile || !canPlayerAct()) return;
  const chain = STATE.selectedChain;

  if (chain.length === 0) {
    chain.push(tile);
    updateWordSelection(GRID.board[tile.r][tile.c].char);
    AudioSys.playSelect(400);
    return;
  }

  const last = chain[chain.length - 1];
  const alreadyIndex = chain.findIndex(p => p.r === tile.r && p.c === tile.c);

  if (alreadyIndex === -1 && isAdjacent(last, tile)) {
    chain.push(tile);
    updateWordSelection(STATE.currentWord + GRID.board[tile.r][tile.c].char);
    AudioSys.playSelect(420 + chain.length * 35);
  } else if (alreadyIndex === chain.length - 2) {
    chain.pop();
    updateWordSelection(STATE.currentWord.slice(0, -1));
    AudioSys.playSelect(360);
  } else if (chain.length === 1 && alreadyIndex === -1 && !isAdjacent(last, tile)) {
    chain[0] = tile;
    updateWordSelection(GRID.board[tile.r][tile.c].char);
    AudioSys.playSelect(400);
  }
}

function shuffleGrid() {
  if (!canPlayerAct()) return;
  if (STATE.shuffles <= 0) {
    spawnDamageNumber(canvas.width / 2, 330, "ACAK HABIS!", "#f87171");
    AudioSys.playSelect(220);
    return;
  }
  STATE.shuffles--;
  for (let r = 0; r < GRID.rows; r++) {
    for (let c = 0; c < GRID.cols; c++) {
      const tile = GRID.board[r][c];
      tile.char = getRandomLetter((r + c) % 4 === 0);
      tile.animOffsetY = -40;
      tile.vy = 0;
    }
  }
  enforceVowelCompass();
  STATE.selectedChain = [];
  updateWordSelection("");
  AudioSys.playSelect(340);
}

function skipTurn() {
  if (!canPlayerAct()) return;
  const actionId = beginAction();
  const hero = heroes[STATE.activeHeroIndex];
  changeMp(hero, BALANCE.skipMp);
  STATE.rushGauge = Math.min(100, STATE.rushGauge + 8);
  spawnDamageNumber(hero.x, hero.y - 40, "BERTAHAN +9 MP", "#38bdf8");

  for (let c = 0; c < GRID.cols; c++) {
    const tile = GRID.board[GRID.rows - 1][c];
    if (tile.special !== "DOOM") {
      tile.char = getRandomLetter(c === 0);
      tile.animOffsetY = -30;
      tile.vy = 0;
    }
  }
  enforceVowelCompass();

  STATE.selectedChain = [];
  updateWordSelection("");
  STATE.turnPhase = "HERO_ACTION";
  AudioSys.playSelect(300);

  setTimeout(() => {
    if (!isActionValid(actionId)) return;
    advanceTurn();
  }, 500);
}

function triggerPartyRush() {
  if (!canPlayerAct()) return;
  if (STATE.rushGauge < 100) {
    spawnDamageNumber(canvas.width / 2, 330, "METERAN BELUM PENUH!", "#f87171");
    AudioSys.playSelect(220);
    return;
  }

  const actionId = beginAction();
  STATE.rushGauge = 0;
  STATE.turnPhase = "HERO_ACTION";
  AudioSys.playSpecial();
  STATE.screenShake = 18;
  STATE.hitFreezeTimer = 70;
  spawnDamageNumber(canvas.width / 2, 210, "⚡ ALL-OUT PARTY RUSH! ⚡", "#facc15", true);

  const aliveHeroes = heroes.filter(h => h.hp > 0);
  const initialTarget = getSelectedTarget();

  if (!initialTarget || aliveHeroes.length === 0) {
    STATE.projectileLedger = { actionId: null, pending: 0 };
    finishHeroAction(actionId);
    return;
  }

  STATE.projectileLedger = { actionId, pending: aliveHeroes.length };

  aliveHeroes.forEach((h, idx) => {
    h.isActing = true;
    h.animOffset = -40;
    setTimeout(() => {
      if (!isActionValid(actionId) || isCombatFinished()) {
        if (STATE.projectileLedger.actionId === actionId) {
          STATE.projectileLedger.pending = Math.max(0, STATE.projectileLedger.pending - 1);
          if (STATE.projectileLedger.pending === 0) finishHeroAction(actionId);
        }
        return;
      }
      const target = getSelectedTarget();
      if (!target) {
        if (STATE.projectileLedger.actionId === actionId) {
          STATE.projectileLedger.pending = Math.max(0, STATE.projectileLedger.pending - 1);
          if (STATE.projectileLedger.pending === 0) finishHeroAction(actionId);
        }
        return;
      }
      createProjectile({
        actionId,
        countPending: false,
        x: h.x - 20, y: h.y - 10,
        targetX: target.x, targetY: target.y,
        color: idx === 0 ? "#f8fafc" : idx === 1 ? "#4ade80" : idx === 2 ? "#38bdf8" : "#facc15",
        trailColor: "#fbbf24", size: 18, type: "rush",
        onHit: () => {
          const freshTarget = (target && target.hp > 0) ? target : getSelectedTarget();
          if (freshTarget) {
            applyDamage(h, freshTarget, 25 + Math.floor(Math.random() * 10), {
              color: "#facc15",
              particleColor: "#fbbf24",
              particleCount: 16
            });
          }
        }
      });
    }, idx * 160);
  });
}

function handlePointerDown(e) {
  AudioSys.init();
  const pos = getCanvasCoords(e);

  if (pos.x >= BTN_BGM.x && pos.x <= BTN_BGM.x + BTN_BGM.w &&
      pos.y >= BTN_BGM.y && pos.y <= BTN_BGM.y + BTN_BGM.h) {
    AudioSys.toggleBgm();
    return;
  }

  if (pos.x >= BTN_CRT.x && pos.x <= BTN_CRT.x + BTN_CRT.w &&
      pos.y >= BTN_CRT.y && pos.y <= BTN_CRT.y + BTN_CRT.h) {
    STATE.crtEnabled = !STATE.crtEnabled;
    AudioSys.playSelect(540);
    return;
  }

  if (STATE.turnPhase === "TITLE") {
    if (pos.x >= BTN_TITLE_START.x && pos.x <= BTN_TITLE_START.x + BTN_TITLE_START.w &&
        pos.y >= BTN_TITLE_START.y && pos.y <= BTN_TITLE_START.y + BTN_TITLE_START.h) {
      AudioSys.init();
      AudioSys.playSpecial();
      AudioSys.startBgm();
      startWalkInTransition();
      return;
    }
    if (pos.x >= BTN_TITLE_GUIDE.x && pos.x <= BTN_TITLE_GUIDE.x + BTN_TITLE_GUIDE.w &&
        pos.y >= BTN_TITLE_GUIDE.y && pos.y <= BTN_TITLE_GUIDE.y + BTN_TITLE_GUIDE.h) {
      AudioSys.init();
      AudioSys.playSelect(480);
      spawnDamageNumber(canvas.width / 2, 400, "Ketik/sambungkan kata untuk menyerang!", "#38bdf8", true);
      return;
    }
    return;
  }

  if (STATE.turnPhase === "CAMPFIRE") {
    handleCampfireClick(pos.x, pos.y);
    return;
  }

  if (isCombatFinished()) {
    if (performance.now() - STATE.overSince < 900) return;
    window.location.reload();
    return;
  }

  if (!canPlayerAct()) return;

  enemies.forEach((en, idx) => {
    if (en.hp > 0) {
      const ex = en.x - 36;
      const ey = en.y - 45;
      if (pos.x >= ex && pos.x <= ex + 72 && pos.y >= ey && pos.y <= ey + 90) {
        STATE.selectedEnemyIndex = idx;
        AudioSys.playSelect(650);
        spawnDamageNumber(en.x, en.y - 75, "🎯 TARGET!", "#38bdf8");
      }
    }
  });

  for (let i = 0; i < SKILL_BTNS.length; i++) {
    const b = SKILL_BTNS[i];
    if (pos.x >= b.x && pos.x <= b.x + b.w && pos.y >= b.y && pos.y <= b.y + b.h) {
      STATE.selectedSkillIndex = i;
      AudioSys.playSelect(520);
      return;
    }
  }

  if (pos.x >= BTN_SUBMIT.x && pos.x <= BTN_SUBMIT.x + BTN_SUBMIT.w &&
      pos.y >= BTN_SUBMIT.y && pos.y <= BTN_SUBMIT.y + BTN_SUBMIT.h) {
    submitWordAction();
    return;
  }

  if (pos.x >= BTN_RUSH.x && pos.x <= BTN_RUSH.x + BTN_RUSH.w &&
      pos.y >= BTN_RUSH.y && pos.y <= BTN_RUSH.y + BTN_RUSH.h) {
    triggerPartyRush();
    return;
  }

  if (pos.x >= BTN_CLEAR.x && pos.x <= BTN_CLEAR.x + BTN_CLEAR.w &&
      pos.y >= BTN_CLEAR.y && pos.y <= BTN_CLEAR.y + BTN_CLEAR.h) {
    STATE.selectedChain = [];
    updateWordSelection("");
    AudioSys.playSelect(280);
    return;
  }

  if (pos.x >= BTN_SHUFFLE.x && pos.x <= BTN_SHUFFLE.x + BTN_SHUFFLE.w &&
      pos.y >= BTN_SHUFFLE.y && pos.y <= BTN_SHUFFLE.y + BTN_SHUFFLE.h) {
    shuffleGrid();
    return;
  }

  if (pos.x >= BTN_SKIP.x && pos.x <= BTN_SKIP.x + BTN_SKIP.w &&
      pos.y >= BTN_SKIP.y && pos.y <= BTN_SKIP.y + BTN_SKIP.h) {
    skipTurn();
    return;
  }

  const tile = getTileAt(pos.x, pos.y);
  if (tile) {
    STATE.isDragging = true;
    tryAddTile(tile);
  }
}

function handlePointerMove(e) {
  if (!STATE.isDragging || !canPlayerAct()) return;
  const pos = getCanvasCoords(e);
  const tile = getTileAt(pos.x, pos.y);
  if (tile) {
    tryAddTile(tile);
  }
}

function handlePointerUp() {
  STATE.isDragging = false;
}

canvas.addEventListener("pointerdown", handlePointerDown);
canvas.addEventListener("pointermove", handlePointerMove);
window.addEventListener("pointerup", handlePointerUp);
window.addEventListener("pointercancel", handlePointerUp);

window.addEventListener("keydown", (e) => {
  AudioSys.init();
  if (e.code === "KeyM") {
    AudioSys.toggleBgm();
    return;
  }
  if (e.code === "KeyC") {
    STATE.crtEnabled = !STATE.crtEnabled;
    AudioSys.playSelect(540);
    return;
  }

  if (!canPlayerAct()) return;

  if (e.code === "Enter" || e.code === "Space") {
    e.preventDefault();
    submitWordAction();
  } else if (e.code === "Backspace" || e.code === "Escape") {
    e.preventDefault();
    STATE.selectedChain = [];
    updateWordSelection("");
    AudioSys.playSelect(280);
  } else if (e.code === "Digit1" || e.code === "Numpad1") {
    STATE.selectedSkillIndex = 0;
    AudioSys.playSelect(500);
  } else if (e.code === "Digit2" || e.code === "Numpad2") {
    STATE.selectedSkillIndex = 1;
    AudioSys.playSelect(500);
  } else if (e.code === "KeyR") {
    shuffleGrid();
  } else if (e.code === "KeyU") {
    triggerPartyRush();
  } else if (e.code === "Tab") {
    e.preventDefault();
    skipTurn();
  } else if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) {
    typeLetterOnBoard(e.key);
  }
});

function submitWordAction() {
  if (!canPlayerAct()) return;
  const word = normalizeWord(STATE.currentWord);
  const hero = heroes[STATE.activeHeroIndex];
  const skill = HERO_SKILLS[STATE.activeHeroIndex][STATE.selectedSkillIndex];

  if (word.length < 3) {
    spawnDamageNumber(canvas.width / 2, 330, "MINIMAL 3 HURUF!", "#f87171");
    AudioSys.playSelect(220);
    return;
  }

  const analysis = STATE.wordAnalysis || analyzeWord(word, hero);
  const { valid: isRecognized, syn, mult } = analysis;

  if (hero.mp < skill.mpCost) {
    spawnDamageNumber(hero.x, hero.y - 45, "MP TIDAK CUKUP!", "#38bdf8");
    AudioSys.playSelect(220);
    return;
  }

  const actionId = beginAction();
  changeMp(hero, -skill.mpCost);
  let totalPower = Math.round(skill.basePower * mult);

  const startsWithVowel = "AIUEO".includes(word[0]);
  if (startsWithVowel && STATE.relics.some(r => r.id === "magma")) {
    totalPower += BALANCE.magmaFireBonus;
    spawnDamageNumber(hero.x, hero.y - 95, "+14 FIRE (INTI MAGMA)", "#f97316");
  }

  let hasFireTile = false;
  let hasFrostTile = false;
  let hasLightningTile = false;
  let hasStarTile = false;
  let hasManaTile = false;
  let hasShieldTile = false;
  let hasPoisonTile = false;
  let clearedDoom = false;

  STATE.selectedChain.forEach(p => {
    const tile = GRID.board[p.r][p.c];
    if (tile.special === "FIRE") hasFireTile = true;
    if (tile.special === "FROST") hasFrostTile = true;
    if (tile.special === "LIGHTNING") hasLightningTile = true;
    if (tile.special === "STAR") hasStarTile = true;
    if (tile.special === "MANA") hasManaTile = true;
    if (tile.special === "SHIELD") hasShieldTile = true;
    if (tile.special === "POISON") hasPoisonTile = true;
    if (tile.special === "DOOM") {
      clearedDoom = true;
      clearDoomTile(tile);
    }
  });

  if (clearedDoom) {
    spawnDamageNumber(hero.x, hero.y - 110, "✨ BOM DINETRALISIR!", "#4ade80");
    AudioSys.playSpecial();
  }

  if (hasStarTile) {
    spawnDamageNumber(hero.x, hero.y - 95, "⭐ BONUS BINTANG (+35%)", "#facc15");
  }

  if (hasManaTile) {
    changeMp(hero, BALANCE.manaTileMp);
    spawnDamageNumber(hero.x, hero.y - 65, `+${BALANCE.manaTileMp} MP (KRISTAL)`, "#38bdf8");
    AudioSys.playSpecial();
  }

  if (hasShieldTile) {
    STATE.partyGuardTurns = 1;
    spawnDamageNumber(hero.x, hero.y - 80, "🛡️ GUARD AKTIF!", "#facc15");
  }

  if (hasPoisonTile) {
    applyDamage(null, hero, BALANCE.poisonTileDamage, {
      label: "-6 HP (RACUN UBIN)",
      color: "#c084fc",
      particleColor: "#a855f7",
      yOffset: 50
    });
    if (!isActionValid(actionId) || isCombatFinished()) return;
    if (hero.hp <= 0) {
      finishHeroAction(actionId);
      return;
    }
  }

  if (word.length >= 5 && STATE.relics.some(r => r.id === "quill")) {
    heroes.forEach(h => {
      if (h.hp > 0) applyHealing(hero, h, BALANCE.quillHeal, { yOffset: 120 });
    });
    AudioSys.playHeal();
  }

  STATE.stats.wordsCount++;
  STATE.rushGauge = Math.min(100, STATE.rushGauge + word.length * 5 + (isRecognized ? 10 : 0));

  if (syn) spawnDamageNumber(hero.x, hero.y - 50, "★ SINERGI HERO!", "#facc15");
  else if (!isRecognized) spawnDamageNumber(hero.x, hero.y - 50, "BUKAN KATA", "#94a3b8");

  AudioSys.playSubmitSuccess(word.length);
  STATE.turnPhase = "HERO_ACTION";
  hero.isActing = true;
  hero.animOffset = -45;

  const targetEnemy = getSelectedTarget();
  const isCrit = mult >= 1.8;

  replenishGridCascading(STATE.selectedChain);
  STATE.selectedChain = [];
  updateWordSelection("");

  const skillContext = {
    hero,
    skill,
    targetEnemy,
    totalPower,
    mult,
    isCrit,
    isRecognized,
    hasFireTile,
    hasFrostTile,
    hasLightningTile,
    word,
    actionId
  };

  const handler = SKILL_HANDLERS[skill.handler];
  if (handler) {
    handler(skillContext);
  } else {
    finishHeroAction(actionId);
  }
}

const SKILL_HANDLERS = {
  SINGLE_ATTACK: (ctx) => {
    const { hero, skill, targetEnemy, totalPower, mult, isCrit, isRecognized, hasFireTile, hasFrostTile, hasLightningTile, word, actionId } = ctx;
    if (!targetEnemy) {
      finishHeroAction(actionId);
      return;
    }
    const proj = skill.projectile || { type: "slash", color: "#f8fafc", trailColor: "#38bdf8", size: 14 };
    createProjectile({
      actionId,
      x: proj.fromTop ? targetEnemy.x : hero.x - 20,
      y: proj.fromTop ? 0 : hero.y - 5,
      targetX: targetEnemy.x,
      targetY: targetEnemy.y,
      color: proj.color,
      trailColor: proj.trailColor,
      size: proj.size || 14,
      type: proj.type || "slash",
      onHit: () => {
        if (!isActionValid(actionId)) return;
        if (proj.type === "lightning") AudioSys.playMagic();
        else if (proj.type === "arrow") AudioSys.playBow();
        else AudioSys.playSlash();

        const opts = skill.options || {};
        const label = opts.labelSuffix
          ? `-${totalPower} ${opts.labelSuffix}`
          : (isRecognized ? `-${totalPower} (x${mult.toFixed(1)})` : `-${totalPower}`);

        const actualDmg = applyDamage(hero, targetEnemy, totalPower, {
          isCrit,
          label,
          particleColor: opts.particleColor || "#ef4444",
          particleCount: opts.particleCount || 20
        });

        if (actualDmg > STATE.stats.bestWordDmg) {
          STATE.stats.bestWord = word;
          STATE.stats.bestWordDmg = actualDmg;
        }

        if (hasFireTile && targetEnemy.hp > 0) {
          targetEnemy.burnTurns = 2;
          spawnDamageNumber(targetEnemy.x, targetEnemy.y - 75, "🔥 TERBAKAR!", "#f97316");
        }

        if (hasFrostTile && targetEnemy.hp > 0) {
          targetEnemy.frozen = true;
          targetEnemy.intent = { type: "FROZEN", desc: "❄️ Membeku" };
          AudioSys.playFreeze();
          spawnDamageNumber(targetEnemy.x, targetEnemy.y - 75, "❄️ BEKU (1 TURN)!", "#93c5fd");
        }

        if (hasLightningTile) {
          AudioSys.playZap();
          enemies.forEach(en => {
            if (en !== targetEnemy && en.hp > 0) {
              applyDamage(hero, en, BALANCE.chainZapDamage, {
                label: `-${BALANCE.chainZapDamage} ⚡`,
                color: "#67e8f9",
                particleColor: "#38bdf8"
              });
            }
          });
        }

        if (opts.poisonTurns && targetEnemy.hp > 0) {
          targetEnemy.poisonTurns = opts.poisonTurns;
          spawnDamageNumber(targetEnemy.x, targetEnemy.y - 55, "☠️ TERACUNI!", "#4ade80");
        }

        if (opts.stun && actualDmg > 0 && targetEnemy.hp > 0) {
          targetEnemy.stunned = true;
          targetEnemy.intent = { type: "STUN", desc: "💫 Pusing" };
          spawnDamageNumber(targetEnemy.x, targetEnemy.y - 55, "STUNNED!", "#38bdf8");
        }
      }
    });
  },

  AOE_ATTACK: (ctx) => {
    const { hero, skill, totalPower, isCrit, hasFireTile, hasFrostTile, hasLightningTile, word, actionId } = ctx;
    const proj = skill.projectile || { type: "fireball", color: "#f97316", trailColor: "#ef4444", size: 20 };
    createProjectile({
      actionId,
      x: hero.x - 20,
      y: hero.y - 15,
      targetX: 250,
      targetY: 160,
      color: proj.color,
      trailColor: proj.trailColor,
      size: proj.size || 20,
      type: proj.type || "fireball",
      onHit: () => {
        if (!isActionValid(actionId)) return;
        if (proj.type === "arrow") AudioSys.playBow();
        else AudioSys.playMagic();

        let totalAoE = 0;
        for (const en of enemies) {
          if (isCombatFinished() || !isActionValid(actionId)) break;
          if (en.hp <= 0) continue;
          const actualDmg = applyDamage(hero, en, totalPower, {
            isCrit,
            label: `-${totalPower}`,
            particleColor: (skill.options && skill.options.particleColor) || "#f97316"
          });
          totalAoE += actualDmg;
          if (hasFireTile && en.hp > 0) en.burnTurns = 2;
          if (hasFrostTile && en.hp > 0) {
            en.frozen = true;
            en.intent = { type: "FROZEN", desc: "❄️ Membeku" };
          }
          if (isCombatFinished() || !isActionValid(actionId)) break;
        }

        if (hasFrostTile) AudioSys.playFreeze();

        if (hasLightningTile) {
          AudioSys.playZap();
          enemies.forEach(en => {
            if (en.hp > 0) {
              applyDamage(hero, en, BALANCE.chainZapDamage, {
                label: `-${BALANCE.chainZapDamage} ⚡`,
                color: "#67e8f9",
                particleColor: "#38bdf8"
              });
            }
          });
        }

        if (totalAoE > STATE.stats.bestWordDmg) {
          STATE.stats.bestWord = word;
          STATE.stats.bestWordDmg = totalAoE;
        }
      }
    });
  },

  SMITE_HEAL: (ctx) => {
    const { hero, skill, targetEnemy, totalPower, mult, isCrit, word, actionId } = ctx;
    if (!targetEnemy) {
      finishHeroAction(actionId);
      return;
    }
    const proj = skill.projectile || { type: "slash", color: "#facc15", trailColor: "#f59e0b", size: 14 };
    createProjectile({
      actionId,
      x: hero.x - 20,
      y: hero.y - 5,
      targetX: targetEnemy.x,
      targetY: targetEnemy.y,
      color: proj.color,
      trailColor: proj.trailColor,
      size: proj.size || 14,
      type: proj.type || "slash",
      onHit: () => {
        if (!isActionValid(actionId)) return;
        AudioSys.playSlash();
        const actualDmg = applyDamage(hero, targetEnemy, totalPower, {
          isCrit,
          label: `-${totalPower}`,
          particleColor: "#facc15"
        });
        if (actualDmg > STATE.stats.bestWordDmg) {
          STATE.stats.bestWord = word;
          STATE.stats.bestWordDmg = actualDmg;
        }
        const aliveHeroes = heroes.filter(h => h.hp > 0);
        aliveHeroes.sort((a, b) => (a.hp / a.maxHp) - (b.hp / b.maxHp));
        if (aliveHeroes.length > 0) {
          const healBase = (skill.options && skill.options.healBase) || 20;
          const healVal = Math.round(healBase * mult);
          applyHealing(hero, aliveHeroes[0], healVal);
          AudioSys.playHeal();
        }
      }
    });
  },

  AOE_HEAL: (ctx) => {
    const { hero, totalPower, actionId } = ctx;
    AudioSys.playHeal();
    heroes.forEach(h => {
      if (h.hp > 0) applyHealing(hero, h, totalPower);
    });
    finishHeroAction(actionId);
  }
};

    AudioSys.playSlash();
    applyDamage(enemy, targetHero, damageVal, {
      label: STATE.partyGuardTurns > 0 ? `-${Math.round(damageVal * BALANCE.guardMultiplier)} (GUARD)` : `-${damageVal}`,
      color: STATE.partyGuardTurns > 0 ? "#facc15" : "#ef4444",
      particleColor: "#ef4444"
    });
  },

  STUN_ATTACK: ({ enemy, damageVal, targetsAtHit }) => {
    const targetHero = targetsAtHit[Math.floor(Math.random() * targetsAtHit.length)];
    AudioSys.playSlash();
    const actual = applyDamage(enemy, targetHero, damageVal, {
      label: STATE.partyGuardTurns > 0 ? `-${Math.round(damageVal * BALANCE.guardMultiplier)} (GUARD)` : `-${damageVal}`,
      color: STATE.partyGuardTurns > 0 ? "#facc15" : "#ef4444",
      particleColor: "#ef4444"
    });
    if (actual > 0 && targetHero.hp > 0) {

    }
  },

  MAGIC_AOE: ({ enemy, damageVal, targetsAtHit, actionId }) => {
    AudioSys.playMagic();
    for (const h of targetsAtHit) {
      if (!isActionValid(actionId) || isCombatFinished() || h.hp <= 0) break;
      applyDamage(enemy, h, damageVal, {
        label: STATE.partyGuardTurns > 0 ? `-${Math.round(damageVal * BALANCE.guardMultiplier)} (GUARD)` : `-${damageVal} (MAGIC)`,
        color: STATE.partyGuardTurns > 0 ? "#facc15" : "#c084fc",
        particleColor: "#a855f7"
      });

  },

  POISON_SPIT: ({ enemy }) => {
    AudioSys.playMagic();
    const r = Math.floor(Math.random() * GRID.rows);
    const c = Math.floor(Math.random() * GRID.cols);
    GRID.board[r][c].special = "POISON";
    spawnDamageNumber(enemy.x, enemy.y - 30, "SEMBURAN RACUN!", "#a855f7");
  },

  DOOM: () => {
    plantDoomTile();
    AudioSys.playMagic();
  }
};

function advanceTurn() {
  const actionId = beginAction();

  if (enemies.every(e => e.hp <= 0)) {
    startWalkOutTransition();
    return;
  }

  let nextIdx = STATE.activeHeroIndex + 1;
  while (nextIdx < heroes.length && heroes[nextIdx].hp <= 0) {
    nextIdx++;
  }

  if (nextIdx < heroes.length) {
    STATE.activeHeroIndex = nextIdx;
    STATE.selectedSkillIndex = 0;
    const activeHero = heroes[nextIdx];
    if (activeHero.stunned) {
      activeHero.stunned = false;
      spawnDamageNumber(activeHero.x, activeHero.y - 45, "TERSTUN! GILIRAN LEWAT", "#38bdf8");
      setTimeout(() => {
        if (!isActionValid(actionId)) return;
        advanceTurn();
      }, 500);
      return;
    }
    STATE.turnPhase = "HERO_INPUT";
  } else {
    STATE.turnPhase = "ENEMY_ACTION";
    setTimeout(() => {
      if (!isActionValid(actionId)) return;
      executeEnemyTurns();
    }, 450);
  }
}

function triggerCampfireIntermission() {
  beginAction();
  STATE.turnPhase = "CAMPFIRE";
  AudioSys.playCampfire();

  const unowned = ALL_RELICS.filter(r => !STATE.relics.some(ur => ur.id === r.id));
  const shuffled = unowned.sort(() => Math.random() - 0.5);
  STATE.offeredRelics = shuffled.slice(0, 3);
}

function handleCampfireClick(x, y) {
  if (STATE.turnPhase !== "CAMPFIRE") return;
  if (!STATE.offeredRelics || STATE.offeredRelics.length === 0) return;
  const cardW = 240;
  const cardH = 140;
  const startX = (canvas.width - (STATE.offeredRelics.length * cardW + (STATE.offeredRelics.length - 1) * 20)) / 2;
  const cardY = 320;

  for (let idx = 0; idx < STATE.offeredRelics.length; idx++) {
    const relic = STATE.offeredRelics[idx];
    const rx = startX + idx * (cardW + 20);
    if (x >= rx && x <= rx + cardW && y >= cardY && y <= cardY + cardH) {
      STATE.relics.push(relic);
      STATE.offeredRelics = [];
      STATE.partyGuardTurns = 0;
      AudioSys.playSpecial();

      heroes.forEach(h => {
        if (h.hp > 0) {
          applyHealing(null, h, Math.round(h.maxHp * BALANCE.campfireHealPercent));
          changeMp(h, Math.round(h.maxMp * BALANCE.campfireHealPercent));
        }
      });

      STATE.wave++;
      enemies = makeWave(STATE.wave);
      STATE.shuffles = 3;
      STATE.selectedEnemyIndex = 0;

      startWalkInTransition();
      break;
    }
  }
}

function executeEnemyTurns() {
  const actionId = beginAction();
  const aliveEnemies = enemies.filter(e => e.hp > 0);

  aliveEnemies.forEach(en => {
    if (en.burnTurns > 0 && en.hp > 0) {
      applyDamage(null, en, BALANCE.burnDamage, {
        label: `-${BALANCE.burnDamage} (BURN)`,
        color: "#f97316",
        particleColor: "#f97316",
        particleCount: 12,
        yOffset: 45
      });
      en.burnTurns--;
    }
    if (en.poisonTurns > 0 && en.hp > 0) {
      applyDamage(null, en, 10, {
        label: `-10 (RACUN)`,
        color: "#4ade80",
        particleColor: "#22c55e",
        particleCount: 12,
        yOffset: 55
      });
      en.poisonTurns--;
    }
  });

  if (enemies.every(e => e.hp <= 0)) {
    advanceTurn();
    return;
  }

  tickDoomTiles();
  if (!isActionValid(actionId) || isCombatFinished()) return;

  const attackers = enemies.filter(e => e.hp > 0);
  if (attackers.length === 0) {
    finishEnemyPhase(actionId);
    return;
  }

  let currentAttackerIndex = 0;

  function stepEnemy() {
    if (!isActionValid(actionId) || isCombatFinished()) return;

    if (currentAttackerIndex >= attackers.length) {
      finishEnemyPhase(actionId);
      return;
    }

    const enemy = attackers[currentAttackerIndex];
    currentAttackerIndex++;

    if (enemy.hp <= 0) {
      stepEnemy();
      return;
    }

    if (enemy.frozen) {
      enemy.frozen = false;
      spawnDamageNumber(enemy.x, enemy.y - 35, "ES MENCAIR", "#93c5fd");
      setTimeout(stepEnemy, 400);
      return;
    }

    if (enemy.stunned) {
      enemy.stunned = false;
      spawnDamageNumber(enemy.x, enemy.y - 35, "STUN HILANG", "#94a3b8");
      setTimeout(stepEnemy, 400);
      return;
    }

    if (enemy.intent && enemy.intent.type === "DOOM") {
      const doomHandler = ENEMY_ACTION_HANDLERS.DOOM;
      if (doomHandler) doomHandler();
      setTimeout(stepEnemy, 500);
      return;
    }

    const currentAlive = heroes.filter(h => h.hp > 0);
    if (currentAlive.length === 0) {
      STATE.turnPhase = "GAME_OVER";
      STATE.overSince = performance.now();
      beginAction();
      return;
    }

    enemy.isActing = true;
    enemy.animOffset = 35;

    setTimeout(() => {
      if (!isActionValid(actionId) || enemy.hp <= 0 || isCombatFinished()) {
        enemy.animOffset = 0;
        enemy.isActing = false;
        stepEnemy();
        return;
      }
      enemy.animOffset = 0;
      enemy.isActing = false;

      const damageVal = (enemy.intent && enemy.intent.val) ? enemy.intent.val : getEnemyAttackPower(STATE.wave, enemy.role === "Caster");
      const targetsAtHit = heroes.filter(h => h.hp > 0);

      if (targetsAtHit.length === 0) {
        STATE.turnPhase = "GAME_OVER";
        STATE.overSince = performance.now();
        beginAction();
        return;
      }

      const actionType = enemy.intent ? enemy.intent.type : "ATTACK";
      const actionHandler = ENEMY_ACTION_HANDLERS[actionType] || ENEMY_ACTION_HANDLERS.ATTACK;
      actionHandler({ enemy, damageVal, targetsAtHit, actionId });

      if (heroes.every(h => h.hp <= 0)) {
        STATE.turnPhase = "GAME_OVER";
        STATE.overSince = performance.now();
        beginAction();
        return;
      }

      setTimeout(stepEnemy, 450);
    }, 250);
  }

  stepEnemy();
}

function finishEnemyPhase(actionId) {
  if (!isActionValid(actionId) || isCombatFinished()) return;
  STATE.partyGuardTurns = 0;
  STATE.shuffles = Math.min(3, STATE.shuffles + 1);

  const extraMp = STATE.relics.some(r => r.id === "grail") ? BALANCE.grailBonusMp : 0;
  heroes.forEach(h => {
    if (h.hp > 0) changeMp(h, BALANCE.turnMpRegen + extraMp);
  });

  let firstAlive = heroes.findIndex(h => h.hp > 0);
  if (firstAlive !== -1) {
    STATE.activeHeroIndex = firstAlive;
    STATE.selectedSkillIndex = 0;
    refreshEnemyIntents();
    const activeHero = heroes[firstAlive];
    if (activeHero.stunned) {
      activeHero.stunned = false;
      spawnDamageNumber(activeHero.x, activeHero.y - 45, "TERSTUN! GILIRAN LEWAT", "#38bdf8");
      setTimeout(() => {
        if (!isActionValid(actionId)) return;
        advanceTurn();
      }, 500);
      return;
    }
    STATE.turnPhase = "HERO_INPUT";
  } else {
    STATE.turnPhase = "GAME_OVER";
    STATE.overSince = performance.now();
    beginAction();
  }
}

function drawCharacterSprite(entity, isCurrentTurn, isTargeted, isWalking = false) {
  const isDead = entity.hp <= 0;
  const drawX = entity.x + (entity.animOffset || 0);
  const drawY = entity.y;

  ctx.save();
  if (isDead) {
    ctx.globalAlpha = 0.22;
  }

  if (isCurrentTurn && !isDead && !isWalking) {
    ctx.strokeStyle = "#f59e0b";
    ctx.lineWidth = 3;
    ctx.fillStyle = "rgba(245, 158, 11, 0.2)";
    ctx.beginPath();
    ctx.ellipse(drawX, drawY + 40, 32, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#f59e0b";
    ctx.beginPath();
    ctx.moveTo(drawX, drawY - 54);
    ctx.lineTo(drawX - 7, drawY - 66);
    ctx.lineTo(drawX + 7, drawY - 66);
    ctx.closePath();
    ctx.fill();
  }

  if (isTargeted && !entity.isHero && !isDead) {
    const pulse = Math.sin(Date.now() * 0.007) * 2.5;

    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 2.5;
    ctx.fillStyle = "rgba(239, 68, 68, 0.22)";
    ctx.beginPath();
    ctx.ellipse(drawX, drawY + 40, 32, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    const bDist = 26 + pulse;
    const bLen = 8;
    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(drawX - bDist, drawY - bDist + bLen);
    ctx.lineTo(drawX - bDist, drawY - bDist);
    ctx.lineTo(drawX - bDist + bLen, drawY - bDist);
    ctx.moveTo(drawX + bDist - bLen, drawY - bDist);
    ctx.lineTo(drawX + bDist, drawY - bDist);
    ctx.lineTo(drawX + bDist, drawY - bDist + bLen);
    ctx.moveTo(drawX - bDist, drawY + bDist - bLen);
    ctx.lineTo(drawX - bDist, drawY + bDist);
    ctx.lineTo(drawX - bDist + bLen, drawY + bDist);
    ctx.moveTo(drawX + bDist - bLen, drawY + bDist);
    ctx.lineTo(drawX + bDist, drawY + bDist);
    ctx.lineTo(drawX + bDist, drawY + bDist - bLen);

    ctx.moveTo(drawX - bDist - 4, drawY);
    ctx.lineTo(drawX - bDist + 3, drawY);
    ctx.moveTo(drawX + bDist + 4, drawY);
    ctx.lineTo(drawX + bDist - 3, drawY);
    ctx.moveTo(drawX, drawY - bDist - 4);
    ctx.lineTo(drawX, drawY - bDist + 3);
    ctx.moveTo(drawX, drawY + bDist + 4);
    ctx.lineTo(drawX, drawY + bDist - 3);
    ctx.stroke();

    const hasIntent = entity.intent && STATE.turnPhase === "HERO_INPUT";
    const badgeY = drawY - (hasIntent ? 72 : 52) + pulse;

    ctx.fillStyle = "rgba(153, 27, 27, 0.95)";
    ctx.strokeStyle = "#f87171";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(drawX - 32, badgeY - 14, 64, 16, 4);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#ef4444";
    ctx.beginPath();
    ctx.moveTo(drawX - 5, badgeY + 2);
    ctx.lineTo(drawX + 5, badgeY + 2);
    ctx.lineTo(drawX, badgeY + 6);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 9px monospace";
    ctx.textAlign = "center";
    ctx.fillText("🎯 TARGET", drawX, badgeY - 3);
  }

  if (STATE.partyGuardTurns > 0 && entity.isHero && !isDead) {
    ctx.strokeStyle = "rgba(250, 204, 21, 0.75)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(drawX, drawY + 4, 38, 0, Math.PI * 2);
    ctx.stroke();
  }

  const stepRate = isWalking ? 160 : 450;
  const walkFrame = Math.floor(STATE.animTimer / stepRate) % 2;
  const stateKey = entity.isActing ? "act" : isWalking ? `walk_${walkFrame}` : `idle_${walkFrame}`;
  const spriteKey = `${entity.spriteKey}_${stateKey}`;
  const spriteCanvas = SpriteLibrary.sprites[spriteKey] || SpriteLibrary.sprites[`${entity.spriteKey}_idle_0`];

  if (spriteCanvas) {
    const sw = SPRITE_SIZE * SPRITE_SCALE;
    const sh = SPRITE_SIZE * SPRITE_SCALE;
    ctx.drawImage(
      spriteCanvas,
      0, 0, SPRITE_SIZE, SPRITE_SIZE,
      Math.floor(drawX - sw / 2),
      Math.floor(drawY - sh / 2),
      sw, sh
    );
  }

  if (!isWalking) {
    const barW = 54;
    const barH = 6;
    const barX = drawX - barW / 2;
    const barY = drawY + 44;

    ctx.fillStyle = "rgba(0,0,0,0.8)";
    ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
    const hpPct = Math.max(0, entity.hp / entity.maxHp);
    ctx.fillStyle = entity.isHero ? "#22c55e" : "#ef4444";
    ctx.fillRect(barX, barY, barW * hpPct, barH);

    if (entity.isHero) {
      const mpPct = Math.max(0, entity.mp / entity.maxMp);
      ctx.fillStyle = "rgba(0,0,0,0.8)";
      ctx.fillRect(barX - 1, barY + 7, barW + 2, 4);
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(barX, barY + 8, barW * mpPct, 3);
    }

    ctx.fillStyle = "#f8fafc";
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    ctx.fillText(entity.name, drawX, barY - 4);
    ctx.font = "bold 9px monospace";
    ctx.fillText(`${entity.hp}/${entity.maxHp}`, drawX, barY + 18);

    if (!entity.isHero && !isDead && entity.intent && STATE.turnPhase === "HERO_INPUT") {
      ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
      ctx.strokeStyle = "#f59e0b";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(drawX - 42, drawY - 60, 84, 20, 4);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = entity.intent.type === "MAGIC_AOE"
        ? "#c084fc"
        : entity.intent.type === "DOOM"
          ? "#f97316"
          : entity.intent.type === "STUN_ATTACK"
            ? "#38bdf8"
            : entity.intent.type === "FROZEN"
              ? "#93c5fd"
              : "#f87171";
      ctx.font = "bold 10px monospace";
      ctx.fillText(entity.intent.desc, drawX, drawY - 46);
    }
  }

  if (entity.frozen && !isDead) {
    ctx.fillStyle = "#93c5fd";
    ctx.font = "bold 12px monospace";
    ctx.textAlign = "center";
    ctx.fillText("❄️ BEKU", drawX, drawY - 25);
  } else if (entity.stunned && !isDead) {
    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 12px monospace";
    ctx.textAlign = "center";
    ctx.fillText("💫 STUN", drawX, drawY - 25);
  }

  if (entity.burnTurns > 0 && !isDead) {
    ctx.fillStyle = "#f97316";
    ctx.font = "bold 12px monospace";
    ctx.fillText(`🔥${entity.burnTurns}`, drawX + 30, drawY - 20);
  }

  if (entity.poisonTurns > 0 && !isDead) {
    ctx.fillStyle = "#4ade80";
    ctx.font = "bold 12px monospace";
    ctx.fillText(`☠️${entity.poisonTurns}`, drawX - 30, drawY - 20);
  }

  ctx.restore();
}

function spawnDamageNumber(x, y, text, color, slow) {
  STATE.damageNumbers.push({ x, y, text, color, life: 1.0, vy: slow ? -0.25 : -1.8, decay: slow ? 0.007 : 0.02 });
}

function spawnParticles(x, y, color, count = 15) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.2 + Math.random() * 4.5;
    STATE.particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      color,
      life: 1.0,
      size: 3 + Math.random() * 3
    });
  }
  while (STATE.particles.length > BALANCE.maxParticles) {
    STATE.particles.shift();
  }
}

function updateAndDrawProjectiles() {
  for (let i = STATE.projectiles.length - 1; i >= 0; i--) {
    const p = STATE.projectiles[i];
    const dx = p.targetX - p.x;
    const dy = p.targetY - p.y;
    const dist = Math.hypot(dx, dy);

    if (dist < 18) {
      STATE.projectiles.splice(i, 1);
      resolveProjectile(p);
    } else {
      p.x += (dx / dist) * 24;
      p.y += (dy / dist) * 24;

      ctx.save();
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.trailColor;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawWordGrid() {
  for (let r = 0; r < GRID.rows; r++) {
    for (let c = 0; c < GRID.cols; c++) {
      const tile = GRID.board[r][c];
      const tx = GRID.startX + c * (GRID.tileSize + GRID.gap);
      const ty = GRID.startY + r * (GRID.tileSize + GRID.gap) + (tile.animOffsetY || 0);

      const isSelected = STATE.selectedChain.some(p => p.r === r && p.c === c);

      if (isSelected) {
        ctx.fillStyle = "#2563eb";
        ctx.strokeStyle = "#93c5fd";
      } else {
        if (tile.special === "FIRE") {
          ctx.fillStyle = "#431407";
          ctx.strokeStyle = "#f97316";
        } else if (tile.special === "FROST") {
          ctx.fillStyle = "#0c2b4e";
          ctx.strokeStyle = "#93c5fd";
        } else if (tile.special === "LIGHTNING") {
          ctx.fillStyle = "#1e1b4b";
          ctx.strokeStyle = "#67e8f9";
        } else if (tile.special === "STAR") {
          ctx.fillStyle = "#422006";
          ctx.strokeStyle = "#facc15";
        } else if (tile.special === "MANA") {
          ctx.fillStyle = "#083344";
          ctx.strokeStyle = "#06b6d4";
        } else if (tile.special === "SHIELD") {
          ctx.fillStyle = "#3f2c06";
          ctx.strokeStyle = "#eab308";
        } else if (tile.special === "DOOM") {
          ctx.fillStyle = "#450a0a";
          ctx.strokeStyle = "#ef4444";
        } else if (tile.special === "POISON") {
          ctx.fillStyle = "#2e1065";
          ctx.strokeStyle = "#a855f7";
        } else {
          ctx.fillStyle = "#1e293b";
          ctx.strokeStyle = "#334155";
        }
      }
      ctx.lineWidth = isSelected ? 3 : 1.8;

      ctx.beginPath();
      ctx.roundRect(tx, ty, GRID.tileSize, GRID.tileSize, 8);
      ctx.fill();
      ctx.stroke();

      if (!isSelected && tile.special !== "NORMAL") {
        ctx.font = "10px monospace";
        ctx.textAlign = "right";
        ctx.textBaseline = "top";
        let icon = "🔥";
        if (tile.special === "FROST") icon = "❄️";
        else if (tile.special === "LIGHTNING") icon = "⚡";
        else if (tile.special === "STAR") icon = "⭐";
        else if (tile.special === "MANA") icon = "💎";
        else if (tile.special === "SHIELD") icon = "🛡️";
        else if (tile.special === "DOOM") icon = `💣${tile.doomCount}`;
        else if (tile.special === "POISON") icon = "☠️";
        ctx.fillText(icon, tx + GRID.tileSize - 4, ty + 3);
      }

      ctx.fillStyle = isSelected ? "#ffffff" : "#f1f5f9";
      ctx.font = "bold 24px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(tile.char, tx + GRID.tileSize / 2, ty + GRID.tileSize / 2);
    }
  }

  if (STATE.selectedChain.length > 1) {
    ctx.strokeStyle = "#60a5fa";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    STATE.selectedChain.forEach((pos, idx) => {
      const tile = GRID.board[pos.r][pos.c];
      const cx = GRID.startX + pos.c * (GRID.tileSize + GRID.gap) + GRID.tileSize / 2;
      const cy = GRID.startY + pos.r * (GRID.tileSize + GRID.gap) + GRID.tileSize / 2 + (tile.animOffsetY || 0);
      if (idx === 0) ctx.moveTo(cx, cy);
      else ctx.lineTo(cx, cy);
    });
    ctx.stroke();
  }
}
