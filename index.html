  ctx.stroke();
  ctx.fillStyle = rushReady ? "rgba(250, 204, 21, 0.3)" : "rgba(56, 189, 248, 0.15)";
  ctx.fillRect(BTN_RUSH.x + 2, BTN_RUSH.y + 2, (BTN_RUSH.w - 4) * (STATE.rushGauge / 100), BTN_RUSH.h - 4);
  ctx.fillStyle = rushReady ? "#ffffff" : "#cbd5e1";
  ctx.font = "bold 12px monospace";
  ctx.fillText(rushReady ? "⚡ RUSH SIAP! [U]" : `RUSH: ${Math.round(STATE.rushGauge)}%`, BTN_RUSH.x + BTN_RUSH.w / 2, BTN_RUSH.y + 26);

  ctx.fillStyle = "#334155";
  ctx.strokeStyle = "#475569";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(BTN_CLEAR.x, BTN_CLEAR.y, BTN_CLEAR.w, BTN_CLEAR.h, 6);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = "#e2e8f0";
  ctx.font = "bold 11px monospace";
  ctx.fillText("BATAL KATA [⌫]", BTN_CLEAR.x + BTN_CLEAR.w / 2, BTN_CLEAR.y + 22);

  ctx.fillStyle = "#1e293b";
  ctx.beginPath();
  ctx.roundRect(BTN_SHUFFLE.x, BTN_SHUFFLE.y, BTN_SHUFFLE.w, BTN_SHUFFLE.h, 6);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = "#94a3b8";
  ctx.font = "bold 10px monospace";
  ctx.fillText(`ACAK [R] x${STATE.shuffles}`, BTN_SHUFFLE.x + BTN_SHUFFLE.w / 2, BTN_SHUFFLE.y + 21);

  ctx.fillStyle = "#1e293b";
  ctx.strokeStyle = "#475569";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.roundRect(BTN_SKIP.x, BTN_SKIP.y, BTN_SKIP.w, BTN_SKIP.h, 6);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = "#cbd5e1";
  ctx.font = "bold 10px monospace";
  ctx.fillText("BERTAHAN [Tab] +9 MP", BTN_SKIP.x + BTN_SKIP.w / 2, BTN_SKIP.y + 20);

  ctx.fillStyle = "#0c101d";
  ctx.strokeStyle = "#1e293b";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(465, 360, 500, 275, 8);
  ctx.fill();
  ctx.stroke();

  ctx.textAlign = "left";
  ctx.fillStyle = "#f59e0b";
  ctx.font = "bold 15px monospace";
  ctx.fillText(`GILIRAN: ${hero.name.toUpperCase()} (${hero.role})`, 480, 385);

  ctx.fillStyle = "#94a3b8";
  ctx.font = "12px monospace";
  ctx.fillText(`HP: ${hero.hp}/${hero.maxHp}  |  MP: ${hero.mp}/${hero.maxMp}`, 480, 405);
  ctx.fillText("Pilih salah satu skill aktif:", 480, 430);

  skills.forEach((sk, idx) => {
    const btn = SKILL_BTNS[idx];
    const isSelected = STATE.selectedSkillIndex === idx;

    ctx.fillStyle = isSelected ? "#1e3a8a" : "#1e293b";
    ctx.strokeStyle = isSelected ? "#60a5fa" : "#334155";
    ctx.lineWidth = isSelected ? 2.5 : 1.5;

    ctx.beginPath();
    ctx.roundRect(btn.x, btn.y, btn.w, btn.h, 6);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = isSelected ? "#ffffff" : "#e2e8f0";
    ctx.font = "bold 13px monospace";
    ctx.fillText(`[${idx+1}] ${sk.name}`, btn.x + 12, btn.y + 24);

    ctx.fillStyle = hero.mp >= sk.mpCost ? "#38bdf8" : "#ef4444";
    ctx.font = "11px monospace";
    ctx.fillText(`Biaya: ${sk.mpCost} MP`, btn.x + 12, btn.y + 46);

    ctx.fillStyle = "#facc15";
    ctx.textAlign = "right";
    ctx.fillText(`Pwr: ${sk.basePower}`, btn.x + btn.w - 12, btn.y + 24);
    ctx.textAlign = "left";
  });

  const curSkill = skills[STATE.selectedSkillIndex];
  ctx.fillStyle = "#38bdf8";
  ctx.font = "italic 12px monospace";
  ctx.fillText(`* ${curSkill.desc}`, 480, 550);

  const previewMult = len >= 3 ? mult : 1.0;
  const estimated = Math.round(curSkill.basePower * previewMult);
  ctx.fillStyle = "#cbd5e1";
  ctx.font = "12px monospace";
  ctx.fillText(`Estimasi Efek: ${curSkill.basePower} x ${previewMult.toFixed(1)} = `, 480, 585);
  ctx.fillStyle = "#4ade80";
  ctx.font = "bold 14px monospace";
  ctx.fillText(`${estimated} POIN`, 715, 585);

  ctx.fillStyle = "#94a3b8";
  ctx.font = "11px monospace";
  ctx.textAlign = "right";
  ctx.fillText(`RUANG DUNGEON: ${STATE.wave}/${WAVES.length}`, 950, 385);
}

function drawCampfireScene() {
  ctx.fillStyle = "#05070d";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const fireTime = Date.now() * 0.008;
  const rad = 70 + Math.sin(fireTime) * 10;
  const grad = ctx.createRadialGradient(canvas.width / 2, 200, 10, canvas.width / 2, 200, rad * 3);
  grad.addColorStop(0, "rgba(251, 191, 36, 0.85)");
  grad.addColorStop(0.3, "rgba(249, 115, 22, 0.45)");
  grad.addColorStop(0.7, "rgba(180, 83, 9, 0.15)");
  grad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(canvas.width / 2, 200, rad * 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#451a03";
  ctx.fillRect(canvas.width / 2 - 25, 205, 50, 10);
  ctx.fillStyle = "#78350f";
  ctx.fillRect(canvas.width / 2 - 18, 200, 36, 8);

  if (Math.random() < 0.4) {
    STATE.campfireSparks.push({
      x: canvas.width / 2 + (Math.random() - 0.5) * 24,
      y: 195,
      vx: (Math.random() - 0.5) * 1.5,
      vy: -1.5 - Math.random() * 2,
      life: 1.0
    });
  }

  for (let i = STATE.campfireSparks.length - 1; i >= 0; i--) {
    const sp = STATE.campfireSparks[i];
    sp.x += sp.vx;
    sp.y += sp.vy;
    sp.life -= 0.03;
    if (sp.life <= 0) {
      STATE.campfireSparks.splice(i, 1);
    } else {
      ctx.fillStyle = `rgba(253, 224, 71, ${sp.life})`;
      ctx.fillRect(sp.x, sp.y, 3, 3);
    }
  }

  heroes.forEach((h, idx) => {
    const cx = canvas.width / 2 - 165 + idx * 110;
    const cy = 210;
    const spriteCanvas = SpriteLibrary.sprites[`${h.spriteKey}_idle_0`];
    if (spriteCanvas) {
      ctx.drawImage(spriteCanvas, 0, 0, 24, 24, cx - 36, cy - 36, 72, 72);
    }
  });

  ctx.fillStyle = "#facc15";
  ctx.font = "bold 26px monospace";
  ctx.textAlign = "center";
  ctx.fillText("PERISTIRAHATAN API UNGGUN", canvas.width / 2, 75);

  ctx.fillStyle = "#94a3b8";
  ctx.font = "14px monospace";
  ctx.fillText("Party pulih +40% HP & MP. Pilih 1 Relik Kuno untuk memperkuat perjalanan:", canvas.width / 2, 105);

  const cardW = 240;
  const cardH = 140;
  const startX = (canvas.width - (STATE.offeredRelics.length * cardW + (STATE.offeredRelics.length - 1) * 20)) / 2;
  const cardY = 320;

  STATE.offeredRelics.forEach((relic, idx) => {
    const rx = startX + idx * (cardW + 20);
    ctx.fillStyle = "#0f172a";
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(rx, cardY, cardW, cardH, 8);
    ctx.fill();
    ctx.stroke();

    ctx.font = "32px monospace";
    ctx.fillText(relic.icon, rx + cardW / 2, cardY + 45);

    ctx.fillStyle = "#f8fafc";
    ctx.font = "bold 15px monospace";
    ctx.fillText(relic.name, rx + cardW / 2, cardY + 75);

    ctx.fillStyle = "#94a3b8";
    ctx.font = "11px monospace";
    ctx.fillText(relic.desc, rx + cardW / 2, cardY + 105);

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 11px monospace";
    ctx.fillText("[KLIK UNTUK MEMILIH]", rx + cardW / 2, cardY + 128);
  });
}

function drawGameOverlay() {
  if (isCombatFinished() && !STATE.overSince) {
    STATE.overSince = performance.now();
  }

  if (isCombatFinished()) {
    ctx.fillStyle = "rgba(7, 8, 13, 0.92)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const isWin = STATE.turnPhase === "VICTORY";
    ctx.fillStyle = isWin ? "#facc15" : "#ef4444";
    ctx.font = "bold 38px monospace";
    ctx.textAlign = "center";
    ctx.fillText(isWin ? "DUNGEON DITAKLUKKAN!" : "SELURUH PARTY GUGUR!", canvas.width / 2, 200);

    ctx.fillStyle = "#0f172a";
    ctx.strokeStyle = isWin ? "#eab308" : "#64748b";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(canvas.width / 2 - 220, 240, 440, 210, 8);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 16px monospace";
    ctx.fillText("📜 CATATAN EKSPEDISI DUNGEON", canvas.width / 2, 275);

    ctx.fillStyle = "#e2e8f0";
    ctx.font = "13px monospace";
    ctx.textAlign = "left";
    const lx = canvas.width / 2 - 180;
    ctx.fillText(`• Total Kata Dirangkai: ${STATE.stats.wordsCount} Kata`, lx, 315);
    ctx.fillText(`• Kata Terkuat: ${STATE.stats.bestWord} (${STATE.stats.bestWordDmg} DMG)`, lx, 345);
    ctx.fillText(`• Total Kerusakan: ${STATE.stats.totalDamageDealt} Poin`, lx, 375);
    ctx.fillText(`• Relik Didapatkan: ${STATE.relics.length} Artefak`, lx, 405);

    ctx.textAlign = "center";
    ctx.fillStyle = "#94a3b8";
    ctx.font = "bold 13px monospace";
    ctx.fillText("Klik di mana saja untuk memulai ekspedisi baru", canvas.width / 2, 490);
  }
}

let crtCanvas = null;
function initCrtOverlay() {
  crtCanvas = document.createElement("canvas");
  crtCanvas.width = canvas.width;
  crtCanvas.height = canvas.height;
  const cctx = crtCanvas.getContext("2d");

  cctx.fillStyle = "rgba(0, 0, 0, 0.22)";
  for (let y = 0; y < canvas.height; y += 3) {
    cctx.fillRect(0, y, canvas.width, 1.2);
  }

  const vig = cctx.createRadialGradient(
    canvas.width / 2, canvas.height / 2, canvas.height * 0.45,
    canvas.width / 2, canvas.height / 2, canvas.height * 0.85
  );
  vig.addColorStop(0, "rgba(0,0,0,0)");
  vig.addColorStop(1, "rgba(0,0,0,0.5)");
  cctx.fillStyle = vig;
  cctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawCrtEffect() {
  if (!STATE.crtEnabled || !crtCanvas) return;
  ctx.drawImage(crtCanvas, 0, 0);
}

let lastFrameTime = 0;
function gameLoop(timestamp) {
  STATE.animTimer = timestamp;

  const dt = lastFrameTime ? Math.min(100, timestamp - lastFrameTime) : 16.6;
  lastFrameTime = timestamp;

  if (STATE.hitFreezeTimer > 0) {
    STATE.hitFreezeTimer -= dt;
    if (STATE.hitFreezeTimer > 0) {
      requestAnimationFrame(gameLoop);
      return;
    }
    STATE.hitFreezeTimer = 0;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();

  if (STATE.screenShake > 0) {
    const rx = (Math.random() - 0.5) * STATE.screenShake;
    const ry = (Math.random() - 0.5) * STATE.screenShake;
    ctx.translate(rx, ry);
    STATE.screenShake = Math.max(0, STATE.screenShake - 0.6);
  }

  if (STATE.turnPhase === "TITLE") {
    drawTitleScreen();
  } else if (STATE.turnPhase === "CAMPFIRE") {
    drawCampfireScene();
  } else {
    updateGridPhysics();
    updateHeroWalking(dt);
    drawDungeonBackground();

    const isWalkingPhase = STATE.turnPhase === "HERO_WALK_IN" || STATE.turnPhase === "HERO_WALK_OUT";

    if (!isWalkingPhase || STATE.turnPhase === "HERO_WALK_IN") {
      normalizeSelectedTarget();
      enemies.forEach((enemy, idx) => {
        const isTargeted = STATE.selectedEnemyIndex === idx && !isWalkingPhase;
        drawCharacterSprite(enemy, false, isTargeted, false);
      });
    }

    heroes.forEach((hero, idx) => {
      const isCurrent = STATE.turnPhase === "HERO_INPUT" && STATE.activeHeroIndex === idx;
      drawCharacterSprite(hero, isCurrent, false, isWalkingPhase);
    });

    updateAndDrawProjectiles();
    ctx.restore();
    ctx.save();

    if (!isWalkingPhase) {
      drawWordGrid();
      drawTacticalUI();
    } else {
      ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
      ctx.fillRect(0, 480, canvas.width, 100);
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2;
      ctx.strokeRect(0, 480, canvas.width, 100);

      ctx.fillStyle = "#facc15";
      ctx.font = "bold 20px monospace";
      ctx.textAlign = "center";
      if (STATE.turnPhase === "HERO_WALK_IN") {
        ctx.fillText(`MEMASUKI RUANG DUNGEON ${STATE.wave}...`, canvas.width / 2, 520);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "13px monospace";
        ctx.fillText("Party bergerak menuju posisi pertempuran!", canvas.width / 2, 548);
      } else {
        ctx.fillText("RUANG DUNGEON DIBERSIHKAN! BERGERAK MAJU...", canvas.width / 2, 520);
        ctx.fillStyle = "#94a3b8";
        ctx.font = "13px monospace";
        ctx.fillText("Party melangkah keluar menuju perkemahan api unggun.", canvas.width / 2, 548);
      }
    }
  }

  for (let i = STATE.particles.length - 1; i >= 0; i--) {
    const p = STATE.particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.035;
    if (p.life <= 0) {
      STATE.particles.splice(i, 1);
    } else {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.fillRect(p.x, p.y, p.size, p.size);
      ctx.globalAlpha = 1.0;
    }
  }

  for (let i = STATE.damageNumbers.length - 1; i >= 0; i--) {
    const d = STATE.damageNumbers[i];
    d.y += d.vy;
    d.life -= d.decay || 0.02;
    if (d.life <= 0) {
      STATE.damageNumbers.splice(i, 1);
    } else {
      ctx.fillStyle = d.color;
      ctx.globalAlpha = d.life;
      ctx.font = "bold 18px monospace";
      ctx.textAlign = "center";
      ctx.fillText(d.text, d.x, d.y);
      ctx.globalAlpha = 1.0;
    }
  }

  drawGameOverlay();
  drawCrtEffect();
  ctx.restore();

  requestAnimationFrame(gameLoop);
}

SpriteLibrary.init();
initGrid();
initCrtOverlay();
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
