<style>

<body>

<div class="instructions">

<script>
/* =========================================================
   MOBILE DETECTION
   ========================================================= */
const IS_TOUCH  = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const IS_MOBILE = IS_TOUCH && Math.min(window.innerWidth, window.innerHeight) < 900;

/* =========================================================
   BALANCE & AUDIO
   ========================================================= */
const BALANCE={burnDamage:14,chainZapDamage:12,starMultiplierBonus:1.5,guardMultiplier:0.60,campfireHealPercent:0.40,enemyBaseDamage:12,enemyWaveDamage:3.5,turnMpRegen:7,grailBonusMp:4,skipMp:9,manaTileMp:15,poisonTileDamage:6,doomDamage:26,quillHeal:14,vampireLeechPercent:0.25,magmaFireBonus:14,crisisThreshold:0.35,crisisMultiplier:1.4,maxParticles:450,wrongKeyStunMs:250,skipDamageFactor:0.8,themeBonusMultiplier:1.25};
function getEnemyAttackPower(wave,isCaster=false){if(isCaster) return 12+wave*4;return Math.round(BALANCE.enemyBaseDamage+wave*BALANCE.enemyWaveDamage);}

const AudioSys={ctx:null,bgmInterval:null,bgmPlaying:false,step:0,lastBeatTime:0,
init(){
  if(!this.ctx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC){console.warn('Web Audio API tidak tersedia; audio dinonaktifkan.');return false;}
    try{this.ctx=new AC();}catch(err){console.warn('Gagal membuat AudioContext:',err);return false;}
  }
  if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume().catch(()=>{});
  return !!this.ctx;
},
toggleBgm(){if(!this.init())return;this.bgmPlaying?this.stopBgm():this.startBgm();},
startBgm(){if(this.bgmPlaying) return;if(!this.init()) return;this.bgmPlaying=true;this.lastBeatTime=performance.now();const bass=[110,110,130.81,146.83,110,164.81,146.83,123.47];const leads=[220,0,261.63,293.66,329.63,392.00,293.66,246.94];this.bgmInterval=setInterval(()=>{if(!this.ctx||!this.bgmPlaying) return;const t=this.ctx.currentTime;this.lastBeatTime=performance.now();const bf=bass[this.step%bass.length];const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(bf,t);g.gain.setValueAtTime(0.07,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.17);o.connect(g);g.connect(this.ctx.destination);o.start(t);o.stop(t+0.17);const lf=leads[this.step%leads.length];if(lf>0&&Math.random()<0.88){const lo=this.ctx.createOscillator(),lg=this.ctx.createGain();lo.type='square';lo.frequency.setValueAtTime(lf,t);lg.gain.setValueAtTime(0.025,t);lg.gain.exponentialRampToValueAtTime(0.001,t+0.20);lo.connect(lg);lg.connect(this.ctx.destination);lo.start(t);lo.stop(t+0.20);}this.step++;},175);},
stopBgm(){this.bgmPlaying=false;if(this.bgmInterval){clearInterval(this.bgmInterval);this.bgmInterval=null;}},
playSelect(p=440){if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(p,this.ctx.currentTime);g.gain.setValueAtTime(.12,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,this.ctx.currentTime+.08);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+.08);},
playKeyOk(p){if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.setValueAtTime(p,this.ctx.currentTime);o.frequency.exponentialRampToValueAtTime(p*1.15,this.ctx.currentTime+.05);g.gain.setValueAtTime(.08,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.005,this.ctx.currentTime+.07);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+.07);},
playKeyBad(){if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='square';o.frequency.setValueAtTime(180,this.ctx.currentTime);o.frequency.exponentialRampToValueAtTime(80,this.ctx.currentTime+.12);g.gain.setValueAtTime(.12,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.005,this.ctx.currentTime+.14);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+.14);},
playSlash(){if(!this.ctx)return;const n=this.ctx.createBufferSource(),b=this.ctx.createBuffer(1,this.ctx.sampleRate*.15,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<b.length;i++)d[i]=Math.random()*2-1;n.buffer=b;const f=this.ctx.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(1400,this.ctx.currentTime);f.frequency.exponentialRampToValueAtTime(120,this.ctx.currentTime+.15);const g=this.ctx.createGain();g.gain.setValueAtTime(.35,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,this.ctx.currentTime+.15);n.connect(f);f.connect(g);g.connect(this.ctx.destination);n.start();},
playBow(){if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.setValueAtTime(800,this.ctx.currentTime);o.frequency.exponentialRampToValueAtTime(240,this.ctx.currentTime+.18);g.gain.setValueAtTime(.25,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.18);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+.18);},
playMagic(){if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(320,this.ctx.currentTime);o.frequency.exponentialRampToValueAtTime(960,this.ctx.currentTime+.28);g.gain.setValueAtTime(.22,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,this.ctx.currentTime+.3);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+.3);},
playFreeze(){if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.setValueAtTime(1100,this.ctx.currentTime);o.frequency.exponentialRampToValueAtTime(1600,this.ctx.currentTime+.22);g.gain.setValueAtTime(.2,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.25);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+.25);},
playZap(){if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(700,this.ctx.currentTime);o.frequency.linearRampToValueAtTime(180,this.ctx.currentTime+.12);g.gain.setValueAtTime(.26,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,this.ctx.currentTime+.15);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+.15);},
playHeal(){if(!this.ctx)return;[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.setValueAtTime(f,this.ctx.currentTime+i*.05);g.gain.setValueAtTime(.12,this.ctx.currentTime+i*.05);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+i*.05+.2);o.connect(g);g.connect(this.ctx.destination);o.start(this.ctx.currentTime+i*.05);o.stop(this.ctx.currentTime+i*.05+.2);});},
playSubmitSuccess(speedMult){if(!this.ctx)return;const base=480*(0.9+speedMult*0.1),notes=[base,base*1.25,base*1.5,base*2];notes.forEach((f,i)=>{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='square';o.frequency.setValueAtTime(f,this.ctx.currentTime+i*.05);g.gain.setValueAtTime(.14,this.ctx.currentTime+i*.05);g.gain.exponentialRampToValueAtTime(.01,this.ctx.currentTime+i*.05+.16);o.connect(g);g.connect(this.ctx.destination);o.start(this.ctx.currentTime+i*.05);o.stop(this.ctx.currentTime+i*.05+.16);});},
playSpecial(){if(!this.ctx)return;[580,780,1050,1400].forEach((f,i)=>{const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.setValueAtTime(f,this.ctx.currentTime+i*.04);g.gain.setValueAtTime(.14,this.ctx.currentTime+i*.04);g.gain.exponentialRampToValueAtTime(.01,this.ctx.currentTime+i*.04+.14);o.connect(g);g.connect(this.ctx.destination);o.start(this.ctx.currentTime+i*.04);o.stop(this.ctx.currentTime+i*.04+.14);});},
playCampfire(){if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.setValueAtTime(330,this.ctx.currentTime);o.frequency.exponentialRampToValueAtTime(660,this.ctx.currentTime+.4);g.gain.setValueAtTime(.14,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+.45);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+.45);},
playExplode(){if(!this.ctx)return;const n=this.ctx.createBufferSource(),b=this.ctx.createBuffer(1,this.ctx.sampleRate*.35,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<b.length;i++)d[i]=Math.random()*2-1;n.buffer=b;const f=this.ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(450,this.ctx.currentTime);f.frequency.exponentialRampToValueAtTime(40,this.ctx.currentTime+.35);const g=this.ctx.createGain();g.gain.setValueAtTime(.5,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.01,this.ctx.currentTime+.35);n.connect(f);f.connect(g);g.connect(this.ctx.destination);n.start();}};

/* =========================================================
   PIXEL SYSTEM
   ========================================================= */
const SPRITE_SIZE = 48;
const SPRITE_SCALE = 1.85;

class PixelCanvas {
  constructor(w=SPRITE_SIZE, h=SPRITE_SIZE){
    this.canvas=document.createElement("canvas");
    this.canvas.width=w; this.canvas.height=h;
    this.ctx=this.canvas.getContext("2d");
    this.ctx.imageSmoothingEnabled=false;
    this.w=w; this.h=h;
  }
  px(x,y,c){x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=this.w||y>=this.h)return;this.ctx.fillStyle=c;this.ctx.fillRect(x,y,1,1);}
  rect(x,y,w,h,c){x=Math.floor(x);y=Math.floor(y);w=Math.floor(w);h=Math.floor(h);if(w<=0||h<=0)return;this.ctx.fillStyle=c;this.ctx.fillRect(x,y,w,h);}
  plate(x,y,w,h,hi,mid,sh){this.rect(x,y,w,h,mid);this.rect(x,y,w,1,hi);this.rect(x,y+h-1,w,1,sh);this.rect(x,y,1,h,hi);this.rect(x+w-1,y,1,h,sh);}
  ellipse(cx,cy,rx,ry,color){for(let y=-ry;y<=ry;y++){const w=Math.floor(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry))));this.rect(cx-w,cy+y,w*2+1,1,color);}}
  line(x0,y0,x1,y1,color){x0|=0;y0|=0;x1|=0;y1|=0;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0);const sx=x0<x1?1:-1,sy=y0<y1?1:-1;let err=dx+dy;while(true){this.px(x0,y0,color);if(x0===x1&&y0===y1)break;const e2=2*err;if(e2>=dy){err+=dy;x0+=sx;}if(e2<=dx){err+=dx;y0+=sy;}}}
  outline(color="#0a0712",threshold=40){const w=this.w,h=this.h;const d=this.ctx.getImageData(0,0,w,h).data;const A=(x,y)=>(x<0||y<0||x>=w||y>=h)?0:d[(y*w+x)*4+3];const pts=[];for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(A(x,y)>threshold)continue;if(A(x-1,y)>threshold||A(x+1,y)>threshold||A(x,y-1)>threshold||A(x,y+1)>threshold)pts.push(x,y);}this.ctx.fillStyle=color;for(let i=0;i<pts.length;i+=2)this.ctx.fillRect(pts[i],pts[i+1],1,1);}
  speckle(x,y,w,h,color,density=0.06){for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++){if(Math.random()<density)this.px(xx,yy,color);}}
}
function makeSilhouette(src, color){const c=document.createElement("canvas");c.width=src.width;c.height=src.height;const x=c.getContext("2d");x.imageSmoothingEnabled=false;x.drawImage(src,0,0);x.globalCompositeOperation="source-in";x.fillStyle=color;x.fillRect(0,0,c.width,c.height);return c;}

/* ═══════════════════════════════════════════════════════════
   ╔═══════════════════════════════════════════════════════╗
   ║   PASTE SPRITE LIBRARY DI SINI                          ║
   ║   Copy dari: const SpriteLibrary = { ... };             ║
   ║   Sampai sebelum: const RAW_WORDS=[...]                 ║
   ╚═══════════════════════════════════════════════════════╝
   ═══════════════════════════════════════════════════════════ */
const SpriteLibrary = {
  sprites:{}, flashes:{},
  init(){
    const HERO_BUILDERS={warrior:(f,s,v)=>this.buildWarrior(f,s,v),ranger:(f,s,v)=>this.buildRanger(f,s,v),mage:(f,s,v)=>this.buildMage(f,s,v),cleric:(f,s,v)=>this.buildCleric(f,s,v)};
    const ENEMY_BUILDERS={slime:(f,s,v)=>this.buildSlime(f,s,v),orc:(f,s,v)=>this.buildOrc(f,s,v),drakonit:(f,s,v)=>this.buildDrakonit(f,s,v),golem:(f,s,v)=>this.buildGolem(f,s,v),wyrm:(f,s,v)=>this.buildWyrm(f,s,v)};
    const heroStates={idle:4,walk:6,act1:5,act2:5,hurt:2};
    const enemyStates={idle:4,act1:5,act2:5,hurt:2};
    const register=(key,fn,states)=>{
      for(const st in states)for(let f=0;f<states[st];f++){
        if(st==="act1"||st==="act2")for(let v=0;v<2;v++){const cs=fn(f,st,v);const id=`${key}_${st}_${v}_${f}`;this.sprites[id]=cs;this.flashes[id]=makeSilhouette(cs,"#ffffff");}
        else{const cs=fn(f,st,0);const id=`${key}_${st}_${f}`;this.sprites[id]=cs;this.flashes[id]=makeSilhouette(cs,"#ffffff");}
      }
    };
    for(const k in HERO_BUILDERS)register(k,HERO_BUILDERS[k],heroStates);
    for(const k in ENEMY_BUILDERS)register(k,ENEMY_BUILDERS[k],enemyStates);
  },
/* ⬇⬇⬇ SALIN SEMUA buildWarrior/buildRanger/buildMage/buildCleric ⬇⬇⬇ */
  /* ⬇⬇⬇ buildSlime/buildOrc/buildDrakonit/buildGolem/buildWyrm ⬇⬇⬇ */
  /* dari file lamamu di sini */
  /* =========================================================
     KSATRIA — armor baja merah, pedang besar, perisai
     act1 = tebasan diagonal | act2 = hantaman perisai + stun
     ========================================================= */
  buildWarrior(frame, state, variant){
    const pc = new PixelCanvas();
    const isWalk = state==="walk";
    const isAct1 = state==="act1";
    const isAct2 = state==="act2";
    const isHurt = state==="hurt";

    const C = {
      pl:"#fca5a5", pr:"#ef4444", pd:"#991b1b", ps:"#7f1d1d",
      bd:"#1e293b", bs:"#475569", bm:"#94a3b8", bh:"#cbd5e1", bb:"#e2e8f0",
      sk:"#fde68a", skS:"#d97706",
      gd:"#eab308", gdL:"#fde047",
      eye:"#38bdf8"
    };

    let bob=0;
    if(state==="idle") bob=[0,1,2,1][frame]||0;
    else if(isWalk) bob=[0,1,2,1,2,1][frame]||0;
    else if(isAct1||isAct2) bob=[0,-1,-2,-1,0][frame]||0;
    else if(isHurt) bob=2;

    // Lunge per frame (5 frame: windup, peak, strike, hold, recover)
    let lunge=0, armAngle=0;
    if(isAct1){
      // Tebasan: mundur lalu maju tajam
      lunge=[3,4,-10,-8,-2][frame];
      armAngle=[0,0.3,-1.1,-0.9,-0.3][frame];
    } else if(isAct2){
      // Perisai: maju dengan lunge kuat
      lunge=[2,3,-14,-10,-3][frame];
    } else if(isHurt){
      lunge=(frame===0?5:3);
    }

    const ox = 24 + lunge;      // origin X (tengah)
    const oy = 24 + bob;

    // ====== Kaki (belakang & depan) ======
    let bLx=0,bLy=0,fLx=0,fLy=0;
    if(isWalk){
      const t=[[-4,0,3,0],[-2,-1,1,0],[0,0,-1,0],[2,0,-3,0],[1,-1,-2,0],[-1,0,2,0]][frame];
      fLx=t[0];fLy=t[1];bLx=t[2];bLy=t[3];
    } else if(isHurt) fLx=2;

    // Kaki belakang (kiri)
    pc.rect(ox-8+bLx, oy+5+bLy, 6, 12, C.bs);
    pc.rect(ox-8+bLx, oy+5+bLy, 6, 2, C.bm);
    pc.rect(ox-9+bLx, oy+16+bLy, 8, 4, "#111827");
    pc.rect(ox-9+bLx, oy+16+bLy, 8, 1, "#374151");

    // Kaki depan (kanan)
    pc.rect(ox+2+fLx, oy+5+fLy, 6, 12, C.bm);
    pc.rect(ox+2+fLx, oy+5+fLy, 6, 2, C.bh);
    pc.rect(ox+1+fLx, oy+16+fLy, 8, 4, "#1f2937");
    pc.rect(ox+1+fLx, oy+16+fLy, 8, 1, "#4b5563");

    // ====== Jubah belakang ======
    pc.rect(ox-11, oy-9, 8, 22, C.ps);
    pc.rect(ox-10, oy-8, 6, 20, C.pd);
    pc.rect(ox-10, oy-8, 6, 2, C.pr);
    for(let i=0;i<6;i++) pc.px(ox-8 + (i%3===0?1:0), oy+8+i*2, C.ps);

    // ====== Torso armor ======
    pc.plate(ox-9, oy-8, 20, 16, C.pl, C.pr, C.pd);
    pc.rect(ox-7, oy-6, 6, 8, C.pl);   // dada highlight
    pc.rect(ox+2, oy-6, 4, 8, C.pd);   // perut shadow

    // Sabuk
    pc.rect(ox-9, oy+6, 20, 4, C.bd);
    pc.rect(ox-9, oy+6, 20, 1, C.bm);
    pc.rect(ox-3, oy+6, 4, 4, C.gd);
    pc.rect(ox-2, oy+7, 2, 2, C.gdL);

    // Pauldron
    pc.plate(ox-13, oy-9, 6, 8, C.bh, C.bm, C.bs);
    pc.plate(ox+7, oy-9, 6, 8, C.bh, C.bm, C.bs);
    pc.px(ox-11, oy-6, C.gd); pc.px(ox+9, oy-6, C.gd);

    // ====== Kepala & helm ======
    pc.rect(ox-7, oy-20, 14, 10, C.bm);
    pc.rect(ox-6, oy-19, 12, 8, C.bh);
    // Visor gelap
    pc.rect(ox-6, oy-15, 12, 5, "#0b1220");
    pc.px(ox-3, oy-13, C.eye); pc.px(ox+2, oy-13, C.eye);
    pc.px(ox-3, oy-14, "#a5f3fc"); pc.px(ox+2, oy-14, "#a5f3fc");
    // Crest helm
    pc.rect(ox-7, oy-23, 14, 3, C.bm);
    pc.rect(ox-6, oy-23, 12, 1, C.bh);
    // Plume
    pc.rect(ox-3, oy-28, 6, 5, C.pr);
    pc.rect(ox-2, oy-28, 4, 3, C.pl);

    // ====== Tangan & senjata ======
    if(isAct1){
      // Tebasan diagonal: pedang berputar dari atas
      const sw = Math.round(Math.sin(armAngle)*2);
      const sh = Math.round(Math.cos(armAngle)*2);
      // Tangan kanan naik
      pc.rect(ox+8, oy-14, 5, 8, C.bs);
      pc.rect(ox+8, oy-14, 5, 2, C.bm);
      // Pedang panjang
      const sx = ox + 10 + sw*2;
      const sy = oy - 22 + sh*3;
      const bladeLen = 26;
      // Blade
      for(let i=0;i<bladeLen;i++){
        const bx = sx - i*Math.sin(armAngle) - 1;
        const by = sy + i*Math.cos(armAngle);
        pc.px(bx, by, C.bb);
        pc.px(bx+1, by, C.bh);
        pc.px(bx-1, by, C.bm);
      }
      // Guard
      pc.rect(sx-3, sy+1, 7, 2, C.gd);
      // Grip
      pc.rect(sx-2, sy+3, 3, 6, "#1f2937");
      pc.px(sx-1, sy+8, C.gdL);
      // Motion streak
      if(frame===2||frame===3){
        for(let i=0;i<7;i++){
          pc.px(sx-2-i*2, sy+i, "rgba(248,250,252,0.75)");
          pc.px(sx-1-i*2, sy+i+2, "rgba(248,250,252,0.45)");
        }
      }
    } else if(isAct2){
      // Hantaman perisai
      pc.rect(ox+7, oy-10, 6, 10, C.bs);
      pc.rect(ox+7, oy-10, 6, 2, C.bm);
      // Perisai besar maju
      const shX = ox + 13;
      const shY = oy - 8;
      pc.plate(shX, shY, 10, 16, C.bh, C.bm, C.bs);
      pc.rect(shX+2, shY+2, 6, 6, C.pd);
      pc.rect(shX+3, shY+3, 4, 4, C.gd);
      pc.px(shX+4, shY+4, C.gdL);
      // Pedang di belakang
      pc.rect(ox-9, oy-12, 3, 12, C.bh);
      pc.rect(ox-10, oy-13, 5, 2, C.gd);
      // Impact lines
      if(frame===2||frame===3){
        for(let i=0;i<5;i++){
          pc.px(shX+11+i*2, shY+7-i*2, "rgba(255,255,255,0.7)");
          pc.px(shX+11+i*2, shY+9+i*2, "rgba(255,255,255,0.7)");
        }
      }
    } else {
      // Idle/walk/hurt — pedang di sisi, perisai di depan
      // Lengan kanan
      pc.rect(ox+7, oy-11, 6, 10, C.bs);
      pc.rect(ox+7, oy-11, 6, 2, C.bm);
      // Pedang vertikal
      pc.rect(ox+9, oy-25, 3, 14, C.bb);
      pc.rect(ox+9, oy-25, 1, 14, C.bh);
      pc.rect(ox+9, oy-25, 3, 1, "#ffffff");
      pc.rect(ox+6, oy-11, 9, 2, C.gd);
      pc.rect(ox+9, oy-9, 3, 6, "#1f2937");
      // Perisai
      pc.plate(ox-16, oy-8, 8, 14, C.bh, C.bm, C.bs);
      pc.rect(ox-14, oy-6, 4, 6, C.pd);
      pc.rect(ox-13, oy-5, 2, 4, C.gd);
      // Lengan kiri
      pc.rect(ox-10, oy-10, 5, 8, C.bs);
      pc.rect(ox-10, oy-10, 5, 2, C.bm);
    }

    // Texture metal
    pc.speckle(ox-8, oy-7, 18, 14, "#7f1d1d", 0.05);
    pc.outline("#160808");
    pc.ellipse(ox, oy+21, 13, 2, "rgba(0,0,0,0.42)");
    return pc.canvas;
  },

  /* =========================================================
     PEMANAH — tudung hijau, busur besar, quiver
     act1 = panah beracun | act2 = hujan panah (arrow dari atas)
     ========================================================= */
  buildRanger(frame, state, variant){
    const pc = new PixelCanvas();
    const isWalk = state==="walk";
    const isAct1 = state==="act1";
    const isAct2 = state==="act2";
    const isHurt = state==="hurt";

    const C = {
      lk:"#bbf7d0", lm:"#4ade80", ls:"#22c55e", lL:"#15803d", lD:"#14532d", lX:"#052e16",
      bd:"#292524", bs:"#78350f", bh:"#a16207",
      sk:"#fed7aa", skS:"#c98a54", skD:"#78350f",
      bs2:"#a16207", bowL:"#d97706",
      eye:"#0f172a"
    };

    let bob=0;
    if(state==="idle") bob=[0,1,2,1][frame]||0;
    else if(isWalk) bob=[0,1,2,1,2,1][frame]||0;
    else if(isAct1||isAct2) bob=[0,-1,-2,-1,0][frame]||0;
    else if(isHurt) bob=2;

    let lunge=0;
    if(isAct1) lunge=[4,6,-6,-4,-1][frame];
    else if(isAct2) lunge=[3,5,-8,-6,-2][frame];
    else if(isHurt) lunge=(frame===0?5:3);

    const ox = 24 + lunge;
    const oy = 24 + bob;

    // Kaki
    let bLx=0,fLx=0;
    if(isWalk){
      const t=[[-4,0,3,0],[-2,0,1,0],[0,0,-1,0],[2,0,-3,0],[1,0,-2,0],[-1,0,2,0]][frame];
      fLx=t[0];bLx=t[2];
    } else if(isHurt) fLx=2;

    pc.rect(ox-7+bLx, oy+5, 5, 12, C.bd);
    pc.rect(ox-7+bLx, oy+5, 5, 2, "#3f2d16");
    pc.rect(ox-8+bLx, oy+16, 7, 4, "#292524");
    pc.rect(ox+2+fLx, oy+5, 5, 12, C.bs);
    pc.rect(ox+2+fLx, oy+5, 5, 2, C.bh);
    pc.rect(ox+1+fLx, oy+16, 7, 4, "#3f2d16");

    // Quiver
    pc.rect(ox-13, oy-9, 5, 12, C.bs);
    pc.rect(ox-13, oy-9, 5, 2, C.bh);
    pc.rect(ox-12, oy-13, 2, 4, "#e2e8f0");
    pc.rect(ox-9, oy-13, 2, 4, "#f1f5f9");
    pc.rect(ox-13, oy-3, 5, 1, C.bh);

    // Jubah
    pc.rect(ox-10, oy-4, 20, 12, C.lD);
    pc.rect(ox-9, oy-3, 18, 10, C.lL);
    pc.rect(ox-9, oy-3, 18, 1, C.ls);
    // Sabuk
    pc.rect(ox-10, oy+6, 20, 2, C.bd);
    pc.rect(ox-4, oy+6, 3, 2, C.bh);

    // Bahu
    pc.plate(ox-13, oy-9, 6, 6, C.ls, C.lm, C.lD);
    pc.plate(ox+7, oy-9, 6, 6, C.ls, C.lm, C.lD);

    // Kepala & tudung
    pc.rect(ox-7, oy-21, 14, 11, C.lD);
    pc.rect(ox-6, oy-20, 12, 9, C.lL);
    // Wajah
    pc.rect(ox-5, oy-18, 10, 7, C.sk);
    pc.rect(ox-5, oy-18, 10, 2, C.skS);
    pc.px(ox-3, oy-15, C.eye); pc.px(ox+3, oy-15, C.eye);
    // Tudung menutupi kening
    pc.rect(ox-7, oy-21, 14, 4, C.lD);
    pc.rect(ox-7, oy-21, 14, 1, C.ls);
    pc.rect(ox-6, oy-24, 12, 4, C.lm);
    pc.rect(ox-5, oy-24, 10, 1, C.ls);
    // Ekor tudung
    pc.rect(ox+6, oy-20, 6, 3, C.lD);
    pc.rect(ox+9, oy-18, 4, 3, C.lD);
    pc.px(ox+13, oy-17, C.ls);

    // ====== Senjata ======
    if(isAct1){
      // Panah beracun: busur ditarik penuh
      // Tangan depan menahan busur
      pc.rect(ox-16, oy-12, 5, 8, C.lm);
      pc.rect(ox-16, oy-12, 5, 2, C.ls);
      // Tangan belakang menarik
      pc.rect(ox+6, oy-10, 5, 8, C.lm);
      // Busur besar
      const bx = ox-18, by = oy-16;
      // Arc busur
      for(let i=0;i<22;i++){
        const t = i/21;
        const ang = -1.1 + t*2.2;
        pc.px(bx + 4 + Math.cos(ang)*2, by + t*22, C.bs);
        pc.px(bx + 3 + Math.cos(ang)*2, by + t*22, C.bh);
      }
      // String
      pc.line(bx+6, by, ox+4, oy-5, "#e2e8f0");
      pc.line(bx+6, by+21, ox+4, oy-5, "#e2e8f0");
      // Anak panah siap
      pc.line(ox+5, oy-5, bx+3, oy-5, C.bs);
      pc.rect(bx+2, oy-6, 3, 3, "#4ade80");
      // Racun menetes
      if(frame>=2){
        pc.px(bx+2, oy-2, "#4ade80");
        pc.px(bx+1, oy+1, "#22c55e");
      }
    } else if(isAct2){
      // Hujan panah — busur ke atas
      pc.rect(ox-14, oy-14, 5, 8, C.lm);
      pc.rect(ox+4, oy-12, 5, 8, C.lm);
      // Busur menghadap ke atas
      const bx = ox-16, by = oy-26;
      for(let i=0;i<18;i++){
        const t = i/17;
        const ang = -1.0 + t*2.0;
        pc.px(bx + 6 + Math.cos(ang)*2, by + t*22, C.bs);
        pc.px(bx + 5 + Math.cos(ang)*2, by + t*22, C.bh);
      }
      pc.line(bx+8, by, ox-4, oy-12, "#e2e8f0");
      pc.line(bx+8, by+22, ox-4, oy-12, "#e2e8f0");
      // Beberapa panah siap di tas
      if(frame>=2){
        pc.px(ox-2, oy-32, "#facc15");
        pc.px(ox+3, oy-32, "#facc15");
        pc.px(ox-2, oy-33, "#fde047");
        pc.px(ox+3, oy-33, "#fde047");
      }
    } else {
      // Idle: busur di punggung
      pc.rect(ox+6, oy-11, 5, 8, C.lm);
      pc.rect(ox+6, oy-11, 5, 2, C.ls);
      pc.rect(ox-8, oy-11, 5, 8, C.lm);
      // Busur
      const bx = ox-14, by = oy-12;
      for(let i=0;i<18;i++){
        const t = i/17;
        const ang = -1.0 + t*2.0;
        pc.px(bx + Math.cos(ang)*2, by + t*20, C.bs);
        pc.px(bx + 1 + Math.cos(ang)*2, by + t*20, C.bh);
      }
      pc.line(bx+2, by, ox-6, oy-2, "#cbd5e1");
      pc.line(bx+2, by+20, ox-6, oy-2, "#cbd5e1");
    }

    pc.outline("#08130b");
    pc.ellipse(ox, oy+21, 12, 2, "rgba(0,0,0,0.42)");
    return pc.canvas;
  },

  /* =========================================================
     PENYIHIR — jubah ungu, topi lebar, tongkat ber-orb
     act1 = bola api (AoE) | act2 = petir terarah
     ========================================================= */
  buildMage(frame, state, variant){
    const pc = new PixelCanvas();
    const isWalk = state==="walk";
    const isAct1 = state==="act1";
    const isAct2 = state==="act2";
    const isHurt = state==="hurt";

    const C = {
      rl:"#a78bfa", rm:"#7c3aed", rs:"#5b21b6", rD:"#4c1d95", rX:"#2e1065",
      hat:"#3b0764", hatL:"#6d28d9", hatB:"#a78bfa",
      beard:"#f8fafc", beardS:"#cbd5e1",
      sk:"#fde68a", skS:"#d97706",
      wood:"#78350f", woodL:"#a16207", woodD:"#451a03",
      orb:"#22d3ee", orbL:"#a5f3fc", orbD:"#0891b2",
      star:"#fde047", starL:"#fef9c3",
      eye:"#0f172a"
    };

    let bob=0;
    if(state==="idle") bob=[0,1,2,3,2,1][frame%6];
    else if(isWalk) bob=[0,1,2,1,2,1][frame];
    else if(isAct1||isAct2) bob=[0,-2,-3,-1,0][frame];
    else if(isHurt) bob=2;

    let lunge=0;
    if(isAct1) lunge=[2,4,-8,-6,-2][frame];
    else if(isAct2) lunge=[3,5,-12,-8,-3][frame];
    else if(isHurt) lunge=(frame===0?6:3);

    const ox = 24 + lunge;
    const oy = 24 + bob;

    // ====== Jubah ======
    pc.rect(ox-14, oy-6, 28, 24, C.rX);
    pc.rect(ox-13, oy-5, 26, 22, C.rD);
    pc.rect(ox-12, oy-4, 24, 20, C.rs);
    pc.rect(ox-11, oy-3, 10, 18, C.rm);
    // Highlight sisi
    pc.rect(ox-11, oy-3, 3, 18, C.rl);
    // Bintang pattern
    pc.px(ox-4, oy+2, C.star);
    pc.px(ox+6, oy+6, C.star);
    pc.px(ox-8, oy+10, C.starL);
    pc.px(ox+2, oy+14, C.star);
    pc.px(ox+10, oy+3, C.starL);
    // Ujung jubah
    pc.rect(ox-14, oy+16, 28, 3, C.hat);
    pc.rect(ox-14, oy+16, 28, 1, C.rm);

    // Bahu
    pc.plate(ox-15, oy-8, 7, 7, C.rl, C.rm, C.rs);
    pc.plate(ox+8, oy-8, 7, 7, C.rl, C.rm, C.rs);

    // Kepala
    pc.rect(ox-7, oy-20, 14, 8, C.sk);
    pc.rect(ox-7, oy-20, 14, 2, C.skS);
    pc.px(ox-3, oy-16, C.eye); pc.px(ox+3, oy-16, C.eye);
    pc.px(ox-3, oy-17, "#7dd3fc"); pc.px(ox+3, oy-17, "#7dd3fc");

    // Jenggot panjang
    pc.rect(ox-7, oy-13, 14, 12, C.beard);
    pc.rect(ox-6, oy-12, 12, 10, "#ffffff");
    pc.rect(ox-5, oy-10, 10, 8, C.beard);
    pc.rect(ox-4, oy-8, 8, 5, C.beardS);
    for(let i=0;i<6;i++) pc.px(ox-3+i, oy-3, C.beardS);

    // ====== Topi lebar ======
    pc.rect(ox-18, oy-21, 36, 4, C.hat);
    pc.rect(ox-18, oy-21, 36, 1, C.hatL);
    pc.rect(ox-18, oy-18, 36, 1, C.rX);
    // Kerucut
    pc.rect(ox-9, oy-25, 18, 4, C.hat);
    pc.rect(ox-7, oy-28, 14, 3, C.hat);
    pc.rect(ox-4, oy-30, 8, 2, C.hatL);
    // Buckle
    pc.rect(ox-3, oy-21, 6, 3, C.wood);
    pc.rect(ox-2, oy-21, 4, 1, C.star);
    pc.px(ox, oy-20, C.starL);

    // ====== Tongkat ======
    const stX = isAct1 ? ox-20 : isAct2 ? ox-19 : ox-19;
    const stY = isAct1 ? oy-20 : isAct2 ? oy-30 : oy-14;
    // Batang
    pc.rect(stX+2, stY+7, 3, 28, C.wood);
    pc.rect(stX+2, stY+7, 1, 28, C.woodL);
    pc.rect(stX+4, stY+7, 1, 28, C.woodD);
    // Orb
    pc.ellipse(stX+3, stY+3, 4, 4, C.orbD);
    pc.ellipse(stX+3, stY+3, 3, 3, C.orb);
    pc.rect(stX+2, stY+1, 3, 3, C.orbL);
    pc.px(stX+2, stY+1, "#ffffff");
    // Orb glow
    if(isAct1||isAct2){
      for(let i=0;i<8;i++){
        const ang=(i/8)*Math.PI*2 + frame*0.5;
        pc.px(stX+3+Math.cos(ang)*7, stY+3+Math.sin(ang)*7, "rgba(165,243,252,0.85)");
      }
    }

    // Efek saat menyerang
    if(isAct2 && frame>=2){
      // Petir kecil di atas orb
      pc.line(stX+3, stY-3, stX+2, stY-6, "#67e8f9");
      pc.line(stX+2, stY-6, stX+4, stY-9, "#a5f3fc");
    }

    // Tangan (tersembunyi di balik jubah tapi terlihat ujung)
    pc.rect(ox+8, oy-10, 4, 6, C.sk);
    pc.rect(ox+8, oy-10, 4, 1, C.skS);

    pc.outline("#0a0a1e");
    pc.ellipse(ox, oy+21, 15, 2, "rgba(0,0,0,0.42)");
    return pc.canvas;
  },

  /* =========================================================
     TABIB — jubah putih-emas, halo, gada suci
     act1 = gada + heal rekan | act2 = doa AoE heal
     ========================================================= */
  buildCleric(frame, state, variant){
    const pc = new PixelCanvas();
    const isWalk = state==="walk";
    const isAct1 = state==="act1";
    const isAct2 = state==="act2";
    const isHurt = state==="hurt";

    const C = {
      wl:"#ffffff", wm:"#f1f5f9", ws:"#cbd5e1", wd:"#94a3b8",
      gd:"#eab308", gdL:"#fde047", gdS:"#a16207",
      bd:"#1e40af", bm:"#3b82f6", bl:"#60a5fa", bh:"#93c5fd",
      sk:"#fde68a", skS:"#d97706",
      mk:"#334155", mm:"#64748b", ml:"#94a3b8", mh:"#cbd5e1",
      eye:"#0f172a",
      halo:"#fef08a", haloL:"#fef9c3"
    };

    let bob=0;
    if(state==="idle") bob=[0,1,2,1][frame];
    else if(isWalk) bob=[0,1,2,1,2,1][frame];
    else if(isAct1||isAct2) bob=[0,-2,-2,-1,0][frame];
    else if(isHurt) bob=2;

    let lunge=0;
    if(isAct1) lunge=[3,5,-10,-6,-2][frame];
    else if(isAct2) lunge=[2,2,0,-1,-1][frame];
    else if(isHurt) lunge=(frame===0?5:3);

    const ox = 24 + lunge;
    const oy = 24 + bob;

    // Kaki (di bawah jubah)
    let fLx=0,bLx=0;
    if(isWalk){
      const t=[[-3,0,2,0],[0,0,0,0],[2,0,-3,0],[0,0,0,0],[-2,0,1,0],[1,0,-2,0]][frame];
      fLx=t[0];bLx=t[2];
    }
    pc.rect(ox-6+bLx, oy+18, 6, 3, C.wd);
    pc.rect(ox+2+fLx, oy+18, 6, 3, C.ws);

    // Jubah bawah lebar
    pc.rect(ox-15, oy-6, 30, 26, C.wd);
    pc.rect(ox-14, oy-5, 28, 24, C.ws);
    pc.rect(ox-13, oy-4, 26, 22, C.wm);
    pc.rect(ox-12, oy-3, 24, 20, C.wl);
    // Panel samping
    pc.rect(ox-12, oy-3, 4, 20, C.ws);
    pc.rect(ox+8, oy-3, 4, 20, C.ws);
    // Trim emas vertikal
    pc.rect(ox-2, oy-4, 3, 22, C.gd);
    pc.rect(ox-2, oy-4, 1, 22, C.gdL);
    // Trim horizontal bawah
    pc.rect(ox-14, oy+14, 28, 3, C.gd);
    pc.rect(ox-14, oy+14, 28, 1, C.gdL);
    // Detail salib
    pc.px(ox, oy+2, C.gdS);
    pc.rect(ox-1, oy+2, 3, 1, C.gdS);

    // Bahu biru
    pc.plate(ox-16, oy-9, 7, 8, C.bh, C.bm, C.bd);
    pc.plate(ox+9, oy-9, 7, 8, C.bh, C.bm, C.bd);
    pc.rect(ox-14, oy-6, 2, 3, C.gd);

    // Kepala
    pc.rect(ox-7, oy-20, 14, 8, C.sk);
    pc.rect(ox-7, oy-20, 14, 2, C.skS);
    pc.px(ox-3, oy-17, C.eye); pc.px(ox+3, oy-17, C.eye);
    pc.px(ox-3, oy-18, "#93c5fd"); pc.px(ox+3, oy-18, "#93c5fd");

    // Tudung biru
    pc.rect(ox-9, oy-24, 18, 8, C.bd);
    pc.rect(ox-8, oy-23, 16, 6, C.bm);
    pc.rect(ox-8, oy-23, 16, 1, C.bh);
    // Sisi tudung turun
    pc.rect(ox-9, oy-18, 3, 8, C.bd);
    pc.rect(ox+6, oy-18, 3, 8, C.bd);

    // HALO bercahaya
    const haloPulse = Math.sin(frame*1.5)*1;
    pc.ellipse(ox, oy-28+haloPulse, 10, 2, C.halo);
    pc.ellipse(ox, oy-28+haloPulse, 8, 1, C.haloL);
    // Sinar
    for(let i=0;i<8;i++){
      const ang = i*Math.PI/4;
      pc.px(ox+Math.cos(ang)*12, oy-28+haloPulse+Math.sin(ang)*3, C.haloL);
    }

    // ====== Gada ======
    if(isAct1){
      // Gada menghantam ke bawah
      pc.rect(ox+6, oy-14, 5, 10, C.mm);
      // Batang gada
      pc.rect(ox+13, oy-14, 2, 26, C.mk);
      pc.rect(ox+13, oy-14, 1, 26, C.mm);
      // Kepala gada
      pc.rect(ox+9, oy-24, 10, 10, C.mm);
      pc.rect(ox+10, oy-23, 8, 8, C.ml);
      pc.rect(ox+11, oy-22, 6, 6, C.mh);
      pc.rect(ox+12, oy-20, 4, 2, C.gd);
      pc.px(ox+13, oy-20, C.gdL);
      // Impact
      if(frame>=2){
        pc.px(ox+9, oy-26, "rgba(253,224,71,0.9)");
        pc.px(ox+20, oy-26, "rgba(253,224,71,0.9)");
        pc.px(ox+14, oy-28, "rgba(253,224,71,0.9)");
      }
    } else if(isAct2){
      // Doa: gada terangkat tinggi + cahaya
      pc.rect(ox+6, oy-16, 5, 10, C.mm);
      pc.rect(ox+12, oy-26, 2, 28, C.mk);
      pc.rect(ox+12, oy-26, 1, 28, C.mm);
      pc.rect(ox+8, oy-36, 10, 10, C.mm);
      pc.rect(ox+9, oy-35, 8, 8, C.ml);
      pc.rect(ox+10, oy-34, 6, 6, C.mh);
      pc.rect(ox+11, oy-32, 4, 2, C.gd);
      // Sinar doa
      for(let i=0;i<6;i++){
        const ang = i*Math.PI/3 + frame*0.3;
        pc.px(ox+13+Math.cos(ang)*8, oy-31+Math.sin(ang)*8, "rgba(253,224,71,0.75)");
      }
    } else {
      pc.rect(ox+6, oy-11, 5, 8, C.mm);
      pc.rect(ox+6, oy-11, 5, 2, C.ml);
      pc.rect(ox+11, oy-14, 2, 24, C.mk);
      pc.rect(ox+11, oy-14, 1, 24, C.mm);
      pc.rect(ox+7, oy-22, 10, 10, C.mm);
      pc.rect(ox+8, oy-21, 8, 8, C.ml);
      pc.rect(ox+9, oy-20, 6, 6, C.mh);
      pc.rect(ox+10, oy-18, 4, 2, C.gd);
      pc.px(ox+11, oy-18, C.gdL);
    }

    // Tangan kiri bebas (untuk doa)
    pc.rect(ox-10, oy-8, 5, 8, C.sk);
    pc.rect(ox-10, oy-8, 5, 1, C.skS);

    pc.outline("#0a0d18");
    pc.ellipse(ox, oy+21, 15, 2, "rgba(0,0,0,0.42)");
    return pc.canvas;
  },

  /* =========================================================
     SLIME ASAM — blob kenyal dengan core, mata besar
     act1 = serangan asam | act2 = sembur racun (naik & spit)
     ========================================================= */
  buildSlime(frame, state, variant){
    const pc = new PixelCanvas();
    const isAct1 = state==="act1";
    const isAct2 = state==="act2";
    const isHurt = state==="hurt";

    const C = {
      hi:"#bbf7d0", lt:"#4ade80", md:"#22c55e", dk:"#15803d", xd:"#052e16",
      core:"#166534", eye:"#0b1220", eyeW:"#ffffff", mouth:"#052e16",
      acid:"#a3e635", acidL:"#d9f99d"
    };

    // Squash/stretch
    let squash = 0;
    if(state==="idle") squash = [0,-1,1,0][frame]||0;
    else if(isAct1){
      // Windup: mengembang lalu luncur ke depan
      squash = [-3,-5,4,3,1][frame];
    } else if(isAct2){
      // Mengangkat badan & naik
      squash = [-2,-4,-6,-4,-1][frame];
    } else if(isHurt){
      squash = [3,2][frame];
    }

    let lunge=0;
    if(isAct1) lunge=[-2,-3,6,4,1][frame];
    else if(isAct2) lunge=[0,0,-2,-1,0][frame];
    else if(isHurt) lunge=(frame===0?4:2);

    const cx = 24 + lunge;
    const cy = 30;  // pusat tanah
    const topY = cy - 17 - squash*0.9;
    const botY = cy + 8;

    // Bentuk blob via scanline
    for(let y=Math.floor(topY); y<botY; y++){
      const t = Math.min(1, Math.max(0, (y-topY)/(botY-topY)));
      let halfW = 6 + Math.sin(t*Math.PI)*11 + squash*0.6;
      if(y >= botY-3) halfW = Math.max(halfW-3, 5);
      const x0 = Math.round(cx-halfW);
      const w = Math.round(halfW*2);

      pc.rect(x0, y, w, 1, C.dk);
      if(y < botY-2) pc.rect(x0+1, y, w-2, 1, C.md);
      if(y < topY + 7) pc.rect(x0+2, y, w-4, 1, C.lt);
      if(y < topY + 3) pc.rect(x0+3, y, w-6, 1, C.hi);
    }

    // Core (inti dalam)
    pc.ellipse(cx, topY + 14, 5, 4, C.core);
    pc.ellipse(cx-1, topY + 13, 3, 2, "#22c55e");

    // Kilau basah
    pc.rect(cx-6, Math.floor(topY+5), 4, 2, "#ffffff");
    pc.rect(cx-5, Math.floor(topY+7), 2, 1, "#ffffff");
    pc.px(cx+7, Math.floor(topY+9), "#ffffff");

    // Mata — lebih besar & ekspresif
    const eyeY = Math.floor(topY + 9);
    pc.rect(cx-6, eyeY, 4, 5, C.eye);
    pc.rect(cx+2, eyeY, 4, 5, C.eye);
    pc.rect(cx-5, eyeY+1, 2, 2, C.eyeW);
    pc.rect(cx+3, eyeY+1, 2, 2, C.eyeW);

    // Mulut / ekspresi
    if(isAct1){
      // Mulut terbuka besar
      pc.rect(cx-4, eyeY+8, 8, 5, C.mouth);
      pc.rect(cx-3, eyeY+9, 6, 3, C.dk);
    } else if(isAct2){
      // Mulut O menyembur
      pc.ellipse(cx, eyeY+10, 4, 4, C.mouth);
      pc.ellipse(cx, eyeY+10, 2, 2, C.xd);
      // Tetesan asam
      if(frame>=2){
        pc.px(cx+6, eyeY+6, C.acid);
        pc.px(cx+7, eyeY+4, C.acid);
        pc.px(cx+9, eyeY+2, C.acidL);
        pc.px(cx-6, eyeY+5, C.acid);
      }
    } else if(isHurt){
      pc.rect(cx-4, eyeY+9, 8, 2, C.mouth);
    } else {
      pc.rect(cx-3, eyeY+9, 6, 1, C.mouth);
    }

    pc.outline("#06210f");
    pc.ellipse(cx, cy+9, 16, 3, "rgba(0,0,0,0.45)");
    return pc.canvas;
  },

  /* =========================================================
     ORC BRUTE — hijau berotot, gading, kapak besar
     act1 = tebasan kapak | act2 = gempa (STUN_ATTACK)
     ========================================================= */
  buildOrc(frame, state, variant){
    const pc = new PixelCanvas();
    const isAct1 = state==="act1";
    const isAct2 = state==="act2";
    const isHurt = state==="hurt";

    const C = {
      hi:"#86efac", lt:"#4ade80", md:"#22c55e", dk:"#15803d", xd:"#14532d",
      ld:"#78350f", lm:"#a16207", ll:"#d97706",
      mk:"#1e293b", mm:"#475569", ml:"#94a3b8", mh:"#cbd5e1",
      cl:"#7f1d1d", clL:"#b91c1c",
      tusk:"#f8fafc", tuskS:"#cbd5e1",
      eye:"#ef4444", eyeL:"#fca5a5"
    };

    let bob=0;
    if(state==="idle") bob=[0,1,2,1][frame];
    else if(isAct1) bob=[-1,-2,0,0,-1][frame];
    else if(isAct2) bob=[-2,-4,-2,0,0][frame];
    else if(isHurt) bob=2;

    let lunge=0;
    if(isAct1) lunge=[3,4,-12,-8,-2][frame];
    else if(isAct2) lunge=[-1,-2,8,4,0][frame];
    else if(isHurt) lunge=(frame===0?5:3);

    const ox = 24 + lunge;
    const oy = 24 + bob;

    // Kaki besar
    pc.rect(ox-11, oy+10, 8, 13, C.md);
    pc.rect(ox-11, oy+10, 8, 2, C.lt);
    pc.rect(ox+3, oy+10, 8, 13, C.md);
    pc.rect(ox+3, oy+10, 8, 2, C.lt);
    // Telapak
    pc.rect(ox-12, oy+20, 10, 4, "#3f2d16");
    pc.rect(ox+2, oy+20, 10, 4, "#292524");
    pc.rect(ox-12, oy+20, 10, 1, "#78350f");
    pc.rect(ox+2, oy+20, 10, 1, "#78350f");

    // Cawat
    pc.rect(ox-11, oy+4, 22, 8, C.cl);
    pc.rect(ox-10, oy+5, 20, 6, C.clL);
    pc.rect(ox-10, oy+5, 20, 1, "#dc2626");
    // Kancing
    pc.px(ox, oy+8, "#facc15");
    pc.px(ox+1, oy+8, "#fde047");

    // Torso berotot
    pc.plate(ox-13, oy-9, 26, 15, C.lt, C.md, C.dk);
    // Otot perut
    pc.rect(ox-2, oy-6, 1, 12, C.xd);
    pc.rect(ox-8, oy-2, 16, 1, C.xd);
    pc.rect(ox-8, oy+3, 16, 1, C.xd);
    // Dada
    pc.rect(ox-9, oy-8, 7, 4, C.hi);
    pc.rect(ox+2, oy-8, 7, 4, C.hi);

    // Bahu berotot besar
    pc.plate(ox-17, oy-10, 8, 9, C.lt, C.md, C.xd);
    pc.plate(ox+9, oy-10, 8, 9, C.lt, C.md, C.xd);

    // Kepala
    pc.rect(ox-9, oy-24, 18, 12, C.md);
    pc.rect(ox-9, oy-24, 18, 2, C.lt);
    pc.rect(ox-8, oy-22, 16, 8, C.lt);
    // Rahang menonjol
    pc.rect(ox-8, oy-14, 16, 3, C.dk);
    // Mata merah
    pc.rect(ox-6, oy-18, 4, 3, C.eye);
    pc.rect(ox+2, oy-18, 4, 3, C.eye);
    pc.px(ox-5, oy-17, "#fde047");
    pc.px(ox+3, oy-17, "#fde047");
    pc.px(ox-6, oy-18, C.eyeL);
    pc.px(ox+2, oy-18, C.eyeL);
    // Alis tebal
    pc.rect(ox-6, oy-21, 4, 1, C.xd);
    pc.rect(ox+2, oy-21, 4, 1, C.xd);
    // Telinga
    pc.rect(ox-12, oy-21, 3, 4, C.md);
    pc.rect(ox+9, oy-21, 3, 4, C.md);
    // Gading
    pc.rect(ox-7, oy-12, 3, 4, C.tusk);
    pc.rect(ox+4, oy-12, 3, 4, C.tusk);
    pc.px(ox-6, oy-9, C.tuskS);
    pc.px(ox+5, oy-9, C.tuskS);

    // ====== Kapak ======
    if(isAct1){
      // Kapak diayun ke depan
      const axeX = ox + 12;
      const axeY = oy - 22;
      // Batang
      pc.rect(axeX+2, axeY+6, 3, 30, C.ld);
      pc.rect(axeX+2, axeY+6, 1, 30, C.lm);
      // Mata kapak besar
      pc.rect(axeX-4, axeY, 12, 12, C.mm);
      pc.rect(axeX-3, axeY+1, 10, 10, C.ml);
      pc.rect(axeX-2, axeY+2, 8, 8, C.mh);
      pc.px(axeX, axeY+5, "#ffffff");
      // Retakan di mata kapak
      pc.line(axeX+2, axeY+3, axeX+6, axeY+8, C.mk);
      pc.line(axeX+6, axeY+3, axeX+2, axeY+8, C.mk);
      // Motion streak
      if(frame>=2){
        for(let i=0;i<8;i++){
          pc.px(axeX-5-i, axeY+5+i*1.5, "rgba(255,255,255,0.6)");
          pc.px(axeX-4-i, axeY+7+i*1.5, "rgba(255,255,255,0.4)");
        }
      }
    } else if(isAct2){
      // Gempa: kapak diangkat tinggi
      const axeX = ox + 8;
      const axeY = oy - 38;
      pc.rect(axeX+2, axeY+6, 3, 34, C.ld);
      pc.rect(axeX+2, axeY+6, 1, 34, C.lm);
      pc.rect(axeX-5, axeY, 14, 14, C.mm);
      pc.rect(axeX-4, axeY+1, 12, 12, C.ml);
      pc.rect(axeX-3, axeY+2, 10, 10, C.mh);
      pc.px(axeX, axeY+6, "#ffffff");
      // Garis gempa di tanah
      if(frame>=2){
        for(let i=0;i<5;i++){
          pc.px(ox-20+i*10, oy+22, "rgba(148,163,184,0.65)");
          pc.px(ox-18+i*10, oy+23, "rgba(148,163,184,0.4)");
        }
      }
    } else {
      // Idle: kapak di sisi
      const axeX = ox + 12;
      const axeY = oy - 10;
      pc.rect(axeX, axeY, 3, 32, C.ld);
      pc.rect(axeX, axeY, 1, 32, C.lm);
      pc.rect(axeX-4, axeY+4, 10, 10, C.mm);
      pc.rect(axeX-3, axeY+5, 8, 8, C.ml);
      pc.rect(axeX-2, axeY+6, 6, 6, C.mh);
      pc.px(axeX, axeY+8, "#ffffff");
    }

    pc.outline("#0a1a0d");
    pc.ellipse(ox, oy+22, 15, 2, "rgba(0,0,0,0.5)");
    return pc.canvas;
  },

  /* =========================================================
     DRAKONIT — reptil ungu berjubah, tanduk, tongkat sihir
     act1 = AoE sihir (orb diangkat) | act2 = DOOM (kutuk)
     ========================================================= */
  buildDrakonit(frame, state, variant){
    const pc = new PixelCanvas();
    const isAct1 = state==="act1";
    const isAct2 = state==="act2";
    const isHurt = state==="hurt";

    const C = {
      rh:"#c4b5fd", rl:"#a78bfa", rm:"#7c3aed", rs:"#5b21b6", rD:"#4c1d95", rX:"#2e1065",
      sc:"#6d28d9", scL:"#8b5cf6", scD:"#3b0764",
      eye:"#4ade80", eyeL:"#bbf7d0",
      horn:"#f8fafc", hornS:"#cbd5e1",
      staff:"#1e1b4b", staffL:"#3730a3",
      orb:"#c084fc", orbL:"#e9d5ff", orbD:"#7c3aed",
      magic:"#f0abfc"
    };

    let bob=0;
    if(state==="idle") bob=[0,1,2,1][frame];
    else if(isAct1) bob=[-1,-2,-2,-1,0][frame];
    else if(isAct2) bob=[-2,-4,-3,-1,0][frame];
    else if(isHurt) bob=2;

    let lunge=0;
    if(isAct1) lunge=[2,4,-6,-4,-1][frame];
    else if(isAct2) lunge=[2,3,-4,-2,0][frame];
    else if(isHurt) lunge=(frame===0?5:3);

    const ox = 24 + lunge;
    const oy = 24 + bob;

    // Jubah bawah
    pc.rect(ox-14, oy-2, 28, 22, C.rX);
    pc.rect(ox-13, oy-1, 26, 20, C.rD);
    pc.rect(ox-12, oy+0, 24, 18, C.rs);
    pc.rect(ox-11, oy+1, 10, 16, C.rm);
    pc.rect(ox-11, oy+1, 3, 16, C.rl);
    // Ujung bawah
    pc.rect(ox-14, oy+18, 28, 3, C.sc);
    pc.rect(ox-14, oy+18, 28, 1, C.rl);
    // Rune pattern
    pc.px(ox-3, oy+3, C.magic);
    pc.px(ox+5, oy+8, C.orbL);
    pc.px(ox-7, oy+12, C.magic);

    // Bahu
    pc.plate(ox-15, oy-8, 7, 7, C.rh, C.rl, C.rm);
    pc.plate(ox+8, oy-8, 7, 7, C.rh, C.rl, C.rm);

    // Torso
    pc.plate(ox-10, oy-8, 20, 12, C.rh, C.rl, C.rm);

    // Leher reptil
    pc.rect(ox-5, oy-14, 10, 6, C.sc);
    pc.rect(ox-5, oy-14, 10, 1, C.scL);

    // Kepala reptil
    pc.rect(ox-8, oy-22, 16, 10, C.sc);
    pc.rect(ox-8, oy-22, 16, 2, C.scL);
    pc.rect(ox-7, oy-20, 14, 6, C.scL);
    // Moncong
    pc.rect(ox+5, oy-18, 7, 5, C.sc);
    pc.rect(ox+6, oy-17, 5, 3, C.scL);
    // Rahang bawah
    pc.rect(ox-6, oy-12, 14, 2, C.scD);
    // Lubang hidung
    pc.px(ox+10, oy-16, C.scD);
    // Gigi
    pc.px(ox+8, oy-13, "#ffffff");
    pc.px(ox+10, oy-13, "#ffffff");
    // Mata bercahaya
    pc.rect(ox-4, oy-20, 4, 4, C.eye);
    pc.rect(ox+3, oy-20, 4, 4, C.eye);
    pc.rect(ox-3, oy-19, 2, 2, "#0b1220");
    pc.rect(ox+4, oy-19, 2, 2, "#0b1220");
    pc.px(ox-4, oy-20, C.eyeL);
    pc.px(ox+3, oy-20, C.eyeL);
    // Tanduk putih
    pc.rect(ox-8, oy-26, 2, 5, C.horn);
    pc.rect(ox+6, oy-26, 2, 5, C.horn);
    pc.px(ox-7, oy-27, C.hornS);
    pc.px(ox+7, oy-27, C.hornS);

    // ====== Tongkat ======
    const stX = (isAct1||isAct2) ? ox-19 : ox-17;
    const stY = isAct2 ? oy-34 : isAct1 ? oy-24 : oy-16;
    // Batang panjang
    pc.rect(stX+2, stY+6, 3, 32, C.staff);
    pc.rect(stX+2, stY+6, 1, 32, C.staffL);
    // Orb besar
    pc.ellipse(stX+3, stY+3, 5, 5, C.orbD);
    pc.ellipse(stX+3, stY+3, 4, 4, C.orb);
    pc.rect(stX+1, stY+1, 3, 3, C.orbL);
    pc.px(stX+1, stY+1, "#ffffff");
    // Rune di orb saat menyerang
    if(isAct1||isAct2){
      for(let i=0;i<6;i++){
        const ang = (i/6)*Math.PI*2 + frame*0.4;
        pc.px(stX+3+Math.cos(ang)*7, stY+3+Math.sin(ang)*7, C.magic);
      }
    }

    pc.outline("#0a0416");
    pc.ellipse(ox, oy+21, 15, 2, "rgba(76,29,149,0.45)");
    return pc.canvas;
  },

  /* =========================================================
     GOLEM BATU — raksasa batu, mata cyan menyala
     act1 = hantam kepalan | act2 = gempa STUN (kedua kepalan)
     ========================================================= */
  buildGolem(frame, state, variant){
    const pc = new PixelCanvas();
    const isAct1 = state==="act1";
    const isAct2 = state==="act2";
    const isHurt = state==="hurt";

    const C = {
      hi:"#94a3b8", lt:"#64748b", md:"#475569", dk:"#334155", xd:"#1e293b",
      core:"#06b6d4", coreL:"#67e8f9", coreW:"#ffffff",
      moss:"#166534", mossL:"#22c55e",
      crack:"#0f172a"
    };

    let bob=0;
    if(state==="idle") bob=[0,1,2,1][frame];
    else if(isAct1) bob=[-1,-2,2,0,0][frame];
    else if(isAct2) bob=[-2,-4,-2,1,0][frame];
    else if(isHurt) bob=1;

    let lunge=0;
    if(isAct1) lunge=[3,5,-12,-8,-2][frame];
    else if(isAct2) lunge=[-1,-2,6,3,0][frame];
    else if(isHurt) lunge=(frame===0?4:2);

    const ox = 24 + lunge;
    const oy = 24 + bob;

    // Kaki tebal
    pc.rect(ox-13, oy+12, 10, 12, C.md);
    pc.rect(ox-13, oy+12, 10, 2, C.lt);
    pc.rect(ox+3, oy+12, 10, 12, C.md);
    pc.rect(ox+3, oy+12, 10, 2, C.lt);
    pc.rect(ox-14, oy+22, 12, 4, C.dk);
    pc.rect(ox+2, oy+22, 12, 4, C.dk);

    // Badan besar
    pc.plate(ox-14, oy-8, 28, 22, C.hi, C.lt, C.md);
    // Blok batu terlihat
    pc.rect(ox-12, oy-6, 10, 8, C.lt);
    pc.rect(ox-1, oy-6, 10, 8, C.lt);
    pc.rect(ox-12, oy+4, 8, 8, C.md);
    pc.rect(ox+4, oy+4, 8, 8, C.md);
    // Retakan
    pc.line(ox-6, oy-8, ox-3, oy-2, C.crack);
    pc.line(ox-3, oy-2, ox+2, oy+4, C.crack);
    pc.line(ox+2, oy+4, ox+5, oy+12, C.crack);
    pc.line(ox+8, oy-6, ox+10, oy, C.crack);
    // Lumut
    pc.rect(ox-14, oy+10, 5, 3, C.moss);
    pc.rect(ox+11, oy-4, 3, 4, C.moss);
    pc.px(ox-13, oy+9, C.mossL);

    // Bahu besar
    pc.plate(ox-20, oy-10, 8, 9, C.hi, C.lt, C.md);
    pc.plate(ox+12, oy-10, 8, 9, C.hi, C.lt, C.md);

    // Kepala (kubus batu)
    pc.plate(ox-11, oy-24, 22, 14, C.hi, C.lt, C.md);
    // Retak atas
    pc.rect(ox-11, oy-24, 22, 2, C.dk);
    // Mata menyala
    pc.rect(ox-6, oy-19, 5, 4, C.core);
    pc.rect(ox+2, oy-19, 5, 4, C.core);
    pc.rect(ox-5, oy-18, 3, 2, C.coreW);
    pc.rect(ox+3, oy-18, 3, 2, C.coreW);
    // Cahaya keluar
    pc.px(ox-7, oy-20, C.coreL);
    pc.px(ox+7, oy-20, C.coreL);
    pc.px(ox-8, oy-17, C.coreL);
    pc.px(ox+8, oy-17, C.coreL);
    // Mulut
    pc.rect(ox-6, oy-13, 12, 2, C.crack);

    // ====== Lengan ======
    if(isAct1){
      // Lengan kanan maju menghantam
      pc.rect(ox+12, oy-6, 10, 12, C.lt);
      pc.rect(ox+12, oy-6, 10, 2, C.hi);
      // Kepalan
      pc.plate(ox+20, oy-2, 8, 8, C.hi, C.lt, C.md);
      pc.px(ox+24, oy+1, C.crack);
      // Impact
      if(frame>=2){
        for(let i=0;i<7;i++){
          pc.px(ox+28+i, oy+2-i, "rgba(148,163,184,0.85)");
          pc.px(ox+28+i, oy+6+i, "rgba(148,163,184,0.85)");
        }
      }
      // Lengan kiri di sisi
      pc.rect(ox-20, oy-4, 8, 14, C.md);
    } else if(isAct2){
      // Kedua kepalan di atas
      pc.rect(ox-20, oy-30, 8, 16, C.lt);
      pc.rect(ox-20, oy-30, 8, 2, C.hi);
      pc.plate(ox-22, oy-36, 10, 8, C.hi, C.lt, C.md);
      pc.rect(ox+12, oy-30, 8, 16, C.lt);
      pc.rect(ox+12, oy-30, 8, 2, C.hi);
      pc.plate(ox+12, oy-36, 10, 8, C.hi, C.lt, C.md);
      // Impact di tanah
      if(frame>=2){
        for(let i=0;i<8;i++){
          pc.px(ox-22+i*6, oy+22, "rgba(148,163,184,0.6)");
          pc.px(ox-22+i*6+3, oy+23, "rgba(148,163,184,0.4)");
        }
      }
    } else {
      // Idle: lengan di sisi
      pc.rect(ox-20, oy-4, 8, 14, C.md);
      pc.rect(ox-20, oy-4, 8, 2, C.lt);
      pc.plate(ox-22, oy+6, 10, 10, C.hi, C.lt, C.md);
      pc.rect(ox+12, oy-4, 8, 14, C.md);
      pc.rect(ox+12, oy-4, 8, 2, C.lt);
      pc.plate(ox+12, oy+6, 10, 10, C.hi, C.lt, C.md);
    }

    pc.outline("#050810");
    pc.ellipse(ox, oy+24, 20, 3, "rgba(0,0,0,0.6)");
    return pc.canvas;
  },

  /* =========================================================
     WYRM — naga merah, sayap, kepala menghadap kanan
     act1 = nafas api (MAGIC_AOE) | act2 = hantaman/gigit
     ========================================================= */
  buildWyrm(frame, state, variant){
    const pc = new PixelCanvas();
    const isAct1 = state==="act1";
    const isAct2 = state==="act2";
    const isHurt = state==="hurt";

    const C = {
      hi:"#fca5a5", lt:"#ef4444", md:"#dc2626", dk:"#b91c1c", xd:"#7f1d1d", xxd:"#450a0a",
      belly:"#fbbf24", bellyD:"#d97706", bellyX:"#92400e",
      horn:"#4338ca", hornL:"#6366f1",
      eye:"#facc15", eyeL:"#fef08a",
      fire:"#f97316", fireY:"#fde047", fireW:"#fef3c7",
      wing:"#7f1d1d", wingL:"#b91c1c"
    };

    let bob=0;
    if(state==="idle") bob=[0,1,2,1][frame];
    else if(isAct1) bob=[-1,-3,-3,-1,0][frame];
    else if(isAct2) bob=[0,-1,2,0,-1][frame];
    else if(isHurt) bob=2;

    let lunge=0;
    if(isAct1) lunge=[-2,-4,0,1,0][frame];
    else if(isAct2) lunge=[3,5,-14,-10,-3][frame];
    else if(isHurt) lunge=(frame===0?6:3);

    const ox = 24 + lunge;
    const oy = 24 + bob;

    // Wing lift untuk animasi
    const wingLift = isAct1 ? [0,2,6,4,1][frame] : 0;

    // ====== Sayap belakang ======
    pc.rect(ox-16, oy-14-wingLift, 12, 20+wingLift, C.wing);
    pc.rect(ox-15, oy-13-wingLift, 10, 18+wingLift, C.wingL);
    pc.rect(ox-14, oy-12-wingLift, 8, 10+wingLift, C.md);
    // Urat sayap
    pc.line(ox-14, oy-10-wingLift, ox-6, oy+2, C.wing);
    pc.line(ox-14, oy-6-wingLift, ox-8, oy+2, C.wing);
    pc.px(ox-12, oy-8-wingLift, C.hi);

    // Ekor
    pc.rect(ox-18, oy+8, 12, 6, C.md);
    pc.rect(ox-18, oy+9, 10, 4, C.lt);
    pc.rect(ox-18, oy+10, 8, 2, C.hi);
    pc.px(ox-19, oy+11, C.xd);

    // ====== Badan ======
    pc.plate(ox-10, oy-2, 24, 16, C.hi, C.lt, C.md);
    // Perut
    pc.rect(ox-6, oy+8, 18, 6, C.belly);
    pc.rect(ox-5, oy+9, 16, 4, C.bellyD);
    // Garis perut
    for(let i=0;i<5;i++) pc.rect(ox-4+i*4, oy+8, 1, 6, C.bellyX);
    // Duri punggung
    pc.px(ox-4, oy-2, C.horn);
    pc.px(ox+0, oy-2, C.horn);
    pc.px(ox+4, oy-2, C.horn);
    pc.px(ox+8, oy-3, C.horn);
    pc.px(ox-4, oy-3, C.hornL);
    pc.px(ox, oy-3, C.hornL);
    pc.px(ox+4, oy-3, C.hornL);

    // Kaki
    pc.rect(ox-6, oy+14, 6, 7, C.dk);
    pc.rect(ox+8, oy+14, 6, 7, C.dk);
    pc.rect(ox-7, oy+20, 8, 3, C.xxd);
    pc.rect(ox+7, oy+20, 8, 3, C.xxd);
    // Kuku
    pc.px(ox-7, oy+20, "#f8fafc");
    pc.px(ox-5, oy+20, "#f8fafc");
    pc.px(ox+13, oy+20, "#f8fafc");
    pc.px(ox+15, oy+20, "#f8fafc");

    // ====== Leher & kepala (menghadap kanan) ======
    pc.rect(ox+8, oy-14, 12, 14, C.md);
    pc.rect(ox+9, oy-13, 10, 12, C.lt);
    // Kepala
    pc.rect(ox+14, oy-24, 16, 12, C.md);
    pc.rect(ox+15, oy-23, 14, 10, C.lt);
    // Moncong
    pc.rect(ox+28, oy-20, 6, 6, C.md);
    pc.rect(ox+29, oy-19, 5, 4, C.lt);
    // Rahang bawah
    pc.rect(ox+16, oy-14, 16, 3, C.dk);
    // Gigi
    pc.px(ox+20, oy-14, "#ffffff");
    pc.px(ox+24, oy-14, "#ffffff");
    pc.px(ox+28, oy-14, "#ffffff");
    pc.px(ox+31, oy-14, "#ffffff");
    // Mata
    pc.rect(ox+17, oy-22, 4, 3, C.eye);
    pc.px(ox+18, oy-21, "#0b1220");
    pc.px(ox+17, oy-22, C.eyeL);
    // Tanduk melengkung
    pc.rect(ox+16, oy-28, 3, 5, C.horn);
    pc.rect(ox+25, oy-28, 3, 5, C.horn);
    pc.px(ox+16, oy-29, C.hornL);
    pc.px(ox+26, oy-29, C.hornL);
    // Duri pipi
    pc.px(ox+14, oy-18, C.horn);
    pc.px(ox+14, oy-16, C.horn);

    // ====== Nafas api (act1) ======
    if(isAct1 && frame>=2){
      // Semburan api keluar dari mulut
      const fx = ox + 34;
      const fy = oy - 15;
      const spread = [3, 8, 12][frame-2];
      for(let i=0;i<spread;i++){
        pc.px(fx+i, fy-i*0.3, i<3?C.fireW:i<6?C.fireY:C.fire);
        pc.px(fx+i, fy+1-i*0.3, i<3?C.fireY:i<6?C.fire:C.md);
        pc.px(fx+i, fy+2-i*0.3, i<2?C.fireW:i<5?C.fireY:C.fire);
        if(i>3){
          pc.px(fx+i, fy-1-i*0.3, C.fire);
          pc.px(fx+i, fy+3-i*0.3, C.md);
        }
      }
    }
    // Cakar maju (act2)
    if(isAct2 && frame>=2){
      // Cakar depan
      pc.rect(ox+34, oy-4, 6, 4, C.hi);
      pc.rect(ox+38, oy-5, 4, 6, C.lt);
      pc.px(ox+41, oy-3, "#ffffff");
      pc.px(ox+41, oy+1, "#ffffff");
    }

    pc.outline("#1a0505");
    pc.ellipse(ox, oy+24, 24, 3, "rgba(220,38,38,0.35)");
    return pc.canvas;
  }


};

    ...(THEMED_WORDS[hero.spriteKey]?.HARD || [])
  ];
  const general = difficulty==="EASY"?EASY_WORDS : difficulty==="MEDIUM"?MEDIUM_WORDS : HARD_WORDS;
  let pool;
  if(useCompass){
    pool = themed.length ? themed : (allThemed.length ? allThemed : general);
  } else if(Math.random() < 0.55 && themed.length){
    pool = themed;
  } else {
    pool = general;
  }
  return pool[Math.floor(Math.random()*pool.length)];
}
function isThemeMatch(word, hero){ return THEMES[hero.spriteKey] && THEMES[hero.spriteKey].has(word); }

   COMBAT HELPERS
   ========================================================= */
function changeMp(entity,delta){if(!entity)return 0;const before=entity.mp;entity.mp=Math.max(0,Math.min(entity.maxMp,entity.mp+Math.round(delta)));return entity.mp-before;}
function beginAction(){STATE.turnId++;STATE.projectileLedger={actionId:STATE.turnId,pending:0};return STATE.turnId;}
function isActionValid(id){return id===STATE.turnId&&!isCombatFinished();}
function isCombatFinished(){return STATE.turnPhase==="GAME_OVER"||STATE.turnPhase==="VICTORY";}
function canPlayerAct(){return (STATE.turnPhase==="HERO_READY"||STATE.turnPhase==="HERO_TYPING"||STATE.turnPhase==="HERO_TURN_END")&&!isCombatFinished();}
function normalizeSelectedTarget(){if(enemies[STATE.selectedEnemyIndex]&&enemies[STATE.selectedEnemyIndex].hp>0)return;const f=enemies.findIndex(e=>e.hp>0);STATE.selectedEnemyIndex=f>=0?f:0;}
function getSelectedTarget(){normalizeSelectedTarget();return enemies[STATE.selectedEnemyIndex]&&enemies[STATE.selectedEnemyIndex].hp>0?enemies[STATE.selectedEnemyIndex]:null;}
function refreshEnemyIntents(){rollEnemyIntents(enemies,STATE.wave);}
function rollEnemyIntents(enemyList,wave){
  const cw=wave!==undefined?wave:STATE.wave;
  enemyList.forEach(en=>{
    if(en.hp<=0)return;
    if(en.frozen){en.intent={type:"FROZEN",desc:"❄️ Membeku",animVariant:0};return;}
    if(en.stunned){en.intent={type:"STUN",desc:"💫 Pusing",animVariant:0};return;}
    const cat=ENEMY_CATALOG[en.catalogKey]||{};
    const actions=cat.actions||[{type:"ATTACK",weight:100,powerMod:0,animVariant:0,desc:(v)=>`⚔️ ${v}`}];
    const totW=actions.reduce((s,a)=>s+(a.weight||1),0);
    let roll=Math.random()*totW,chosen=actions[0];
    for(const a of actions){roll-=(a.weight||1);if(roll<=0){chosen=a;break;}}
    const isCaster=en.role==="Caster"||chosen.type==="MAGIC_AOE";
    const basePwr=getEnemyAttackPower(cw,isCaster);
    const pwr=Math.max(1,basePwr+(chosen.powerMod||0));
    en.intent={type:chosen.type,val:pwr,desc:chosen.desc?chosen.desc(pwr):`⚔ ${pwr}`,animVariant:chosen.animVariant||0};
  });
}
function makeWave(n){
  const xs=[320,180];
  const waveKeys=WAVES[n-1]||WAVES[WAVES.length-1];
  const list=waveKeys.map((key,i)=>{
    const data=ENEMY_CATALOG[key]||{name:"Monster",spriteKey:"orc",role:"Brute",maxHp:150};
    return new Entity(data.name,data.spriteKey,data.role,data.maxHp,0,xs[i]||(320-i*140),160,false,key);
  });
  rollEnemyIntents(list,n);
  return list;
}
let enemies=makeWave(1);

function applyDamage(source,target,amount,options={}){
  if(!target||target.hp<=0)return 0;
  const before=target.hp;
  let finalDamage=Math.max(0,Math.round(amount));
  if(options.damageMultiplier) finalDamage=Math.round(finalDamage*options.damageMultiplier);
  if(target.isHero&&STATE.partyGuardTurns>0) finalDamage=Math.round(finalDamage*BALANCE.guardMultiplier);
  target.hp=Math.max(0,target.hp-finalDamage);
  const actualDamage=before-target.hp;
  target.hurtTimer=260;
  if(source&&source.isHero){
    STATE.stats.totalDamageDealt+=actualDamage;
    if(STATE.relics.some(r=>r.id==="vampire")&&actualDamage>0){
      const healAmt=Math.round(actualDamage*BALANCE.vampireLeechPercent);
      if(healAmt>0) applyHealing(source,source,healAmt,{yOffset:75});
    }
  }
  const label=options.label||(actualDamage>0?`-${actualDamage}`:"MISS");
  const color=options.color||(options.isCrit?"#fbbf24":target.isHero?"#ef4444":"#ffffff");
  spawnDamageNumber(target.x,target.y-(options.yOffset||40),label,color);
  spawnParticles(target.x,target.y,options.particleColor||(target.isHero?"#ef4444":"#f97316"),options.particleCount||22);
  if(options.isCrit){STATE.hitFreezeTimer=55;STATE.screenShake=10;}
  else if(finalDamage>16){STATE.screenShake=Math.max(STATE.screenShake,6);}
  if(target.hp<=0){
    target.isActing=false;target.animOffset=0;target.deathTime=performance.now();target.hurtTimer=0;
    if(!target.isHero){
      target.stunned=false;target.frozen=false;target.burnTurns=0;target.poisonTurns=0;target.intent=null;
      normalizeSelectedTarget();
    } else {
      if(heroes.every(h=>h.hp<=0)){STATE.turnPhase="GAME_OVER";STATE.overSince=performance.now();beginAction();}
    }
  }
  return actualDamage;
}
function applyHealing(source,target,amount,options={}){
  if(!target||target.hp<=0)return 0;
  const before=target.hp;
  target.hp=Math.min(target.maxHp,target.hp+Math.max(0,Math.round(amount)));
  const actualHealed=target.hp-before;
  if(actualHealed>0){
    spawnDamageNumber(target.x,target.y-(options.yOffset||40),`+${actualHealed}`,"#4ade80");
    spawnParticles(target.x,target.y,"#4ade80",18);
  }
  return actualHealed;
}
function createProjectile(config){
  if(config.countPending!==false){
    if(STATE.projectileLedger.actionId===config.actionId) STATE.projectileLedger.pending++;
    else STATE.projectileLedger={actionId:config.actionId,pending:1};
  }
  STATE.projectiles.push({
    x:config.x,y:config.y,targetX:config.targetX,targetY:config.targetY,
    color:config.color,trailColor:config.trailColor,size:config.size||16,
    type:config.type||"slash",actionId:config.actionId,angle:0,trail:[],onHit:config.onHit,
    life:0,spiralPhase:0
  });
}
function resolveProjectile(p){
  if(isActionValid(p.actionId)&&typeof p.onHit==="function")p.onHit();
  if(STATE.projectileLedger.actionId===p.actionId){
    STATE.projectileLedger.pending=Math.max(0,STATE.projectileLedger.pending-1);
  }
}

/* =========================================================
   TAP MODE: huruf acak + distractor
   ========================================================= */
function generateLetterBubbles(word){
  const letters = word.split("");
  const distractorCount = 2 + Math.floor(Math.random()*2);
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const usedSet = new Set(letters);
  const distractors = [];
  let safety = 0;
  while(distractors.length < distractorCount && safety++ < 100){
    const c = alphabet[Math.floor(Math.random()*alphabet.length)];
    if(!usedSet.has(c)){ distractors.push(c); usedSet.add(c); }
  }
  const all = letters.concat(distractors);
  for(let i=all.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [all[i],all[j]] = [all[j],all[i]];
  }
  const n = all.length;
  const cols = Math.min(5, Math.ceil(n/2));
  const rows = Math.ceil(n/cols);
  const panelX0 = 45, panelX1 = 435;
  const panelY0 = 470, panelY1 = 622;
  const cellW = (panelX1-panelX0)/cols;
  const cellH = (panelY1-panelY0)/rows;
  const radius = Math.min(cellW, cellH) * 0.40;
  const now = performance.now();
  const bubbles = all.map((ch,i)=>{
    const r = Math.floor(i/cols);
    const c = i%cols;
    const jx = (Math.random()-0.5) * Math.max(0, cellW - radius*2.5);
    const jy = (Math.random()-0.5) * Math.max(0, cellH - radius*2.5);
    return {
      char: ch,
      x: panelX0 + cellW*(c+0.5) + jx,
      y: panelY0 + cellH*(r+0.5) + jy,
      r: radius,
      used: false,
      wrongFlash: 0,
      spawnTime: now + i*35
    };
  });
  return bubbles;
}
function handleBubbleTap(x, y){
  if(STATE.turnPhase!=="HERO_TYPING") return false;
  if(STATE.inputMode!=="TAP") return false;
  if(!STATE.currentWord) return false;
  if(performance.now() < STATE.stunUntil) return false;
  for(const b of STATE.letterBubbles){
    if(b.used) continue;
    const dx = x - b.x, dy = y - b.y;
    if(dx*dx + dy*dy <= b.r*b.r){
      const expected = STATE.currentWord[STATE.typedChars];
      if(b.char === expected){
        b.used = true;
        STATE.typedChars++;
        AudioSys.playKeyOk(500 + STATE.typedChars*40);
        spawnParticles(b.x, b.y, STATE.wordModifier?STATE.wordModifier.color:"#38bdf8", 6);
        if(STATE.typedChars >= STATE.currentWord.length) completeWord();
      } else {
        b.wrongFlash = performance.now();
        STATE.wrongKeysInWord++;
        STATE.turnWordStreak = 0;
        STATE.combo = 0;
        STATE.stunUntil = performance.now() + BALANCE.wrongKeyStunMs;
        AudioSys.playKeyBad();
        STATE.screenShake = 4;
        spawnDamageNumber(b.x, b.y - b.r - 8, "✗", "#f87171", true);
      }
      return true;
    }
  }
  return false;
}

function startWalkInTransition(){
  STATE.turnPhase="HERO_WALK_IN";
  heroes.forEach((h,idx)=>{h.x=canvas.width+60+idx*95;h.y=h.baseY;h.isActing=false;h.animOffset=0;});
}
function startWalkOutTransition(){
  STATE.turnPhase="HERO_WALK_OUT";
}
function updateHeroWalking(dt){
  const timeScale=Math.min(2.5,dt/16.66);
  const walkSpeed=3.6*timeScale;
  if(STATE.turnPhase==="HERO_WALK_IN"){
    let allIn=true;
    heroes.forEach(h=>{
      if(h.hp>0||STATE.wave===1){ if(h.x>h.baseX){h.x=Math.max(h.baseX,h.x-walkSpeed);allIn=false;} }
    });
    if(allIn){
      STATE.turnPhase="HERO_READY";
      STATE.activeHeroIndex=Math.max(0,heroes.findIndex(h=>h.hp>0));
      STATE.selectedSkillIndex=0;
      normalizeSelectedTarget();
      refreshEnemyIntents();
      startWordQueue();
      spawnDamageNumber(canvas.width/2,190,`⚔️ RUANG ${STATE.wave}: BERSIAP! ⚔`,"#facc15",true);
    }
  } else if(STATE.turnPhase==="HERO_WALK_OUT"){
    let allExit=true;
    heroes.forEach(h=>{if(h.hp>0){h.x-=walkSpeed*1.25;if(h.x>-100)allExit=false;}});
    if(allExit){
      if(STATE.wave>=WAVES.length){STATE.turnPhase="VICTORY";STATE.overSince=performance.now();}
      else triggerCampfireIntermission();
    }
  }
}
function startWordQueue(){
  const hero = heroes[STATE.activeHeroIndex];
  const diff = getDifficultyForWave(STATE.wave);
  STATE.wordQueue = [];
  for(let i=0;i<5;i++) STATE.wordQueue.push(pickWord(hero,diff));
  STATE.currentWord = STATE.wordQueue.shift();
  STATE.wordQueue.push(pickWord(hero,diff));
  STATE.typedChars = 0;
  STATE.wrongKeysInWord = 0;
  STATE.wordStartTime = performance.now();
  STATE.wordModifier = rollModifier();
  STATE.wordThemeMatch = isThemeMatch(STATE.currentWord, hero);
  STATE.wordSource = diff;
  STATE.skipped = false;
  STATE.letterBubbles = STATE.inputMode === "TAP" ? generateLetterBubbles(STATE.currentWord) : [];
  STATE.turnElapsed = 0;
  STATE.turnWordsTyped = 0;
  STATE.turnDamageTotal = 0;
  STATE.turnBestWord = "";
  STATE.turnBestDamage = 0;
  STATE.turnWordStreak = 0;
  STATE.turnMaxStreak = 0;
  STATE.turnWordsHistory = [];
  STATE.turnModifiers = new Set();



}
function beginHeroTypingTurn(){
  if(STATE.turnPhase!=="HERO_READY") return;
  const hero = heroes[STATE.activeHeroIndex];
  const skill = HERO_SKILLS[STATE.activeHeroIndex][STATE.selectedSkillIndex];

function finishHeroTypingTurn(){
  if(STATE.turnPhase!=="HERO_TYPING") return;
  STATE.turnPhase = "HERO_TURN_END";
  STATE.rushGauge = Math.min(100, STATE.rushGauge + STATE.turnWordsTyped*3 + STATE.turnMaxStreak*2);
  if(STATE.turnBestDamage > STATE.stats.bestWordDmg){
    STATE.stats.bestWord = STATE.turnBestWord;
    STATE.stats.bestWordDmg = STATE.turnBestDamage;
  }
  // === EKSEKUSI SERANGAN AKUMULATIF ===
  executeAccumulatedAttack();

}

function executeAccumulatedAttack(){
  const hero = heroes[STATE.activeHeroIndex];
  const skill = HERO_SKILLS[STATE.activeHeroIndex][STATE.selectedSkillIndex];
  const totalPower = STATE.turnDamageTotal;

  if(totalPower <= 0){
    spawnDamageNumber(canvas.width/2, 220, "TIDAK ADA DAMAGE", "#94a3b8", true);
    return;
  }

  // Animasi hero
  hero.isActing = true;
  hero.actVariant = skill.animVariant || 0;
  hero.actStart = performance.now();
  setTimeout(()=>{ if(hero) hero.isActing=false; }, 900);

  STATE.screenShake = Math.min(22, 6 + STATE.turnWordsTyped*1.5);
  STATE.hitFreezeTimer = 65;
  const isCrit = (STATE.turnWordsTyped >= 4 && STATE.turnMaxStreak >= 3);
  const target = getSelectedTarget();
  const handler = skill.handler;

  // ── AoE Heal ──
  if(handler === "AOE_HEAL"){
    const healAmt = Math.round(totalPower * 0.55);
    AudioSys.playHeal();
    heroes.forEach(h=>{ if(h.hp>0) applyHealing(hero, h, healAmt); });
    spawnDamageNumber(canvas.width/2, 210, `💚 +${healAmt} HP × PARTY`, "#4ade80", true);
  }
  // ── AoE Attack ──
  else if(handler === "AOE_ATTACK"){
    AudioSys.playMagic();
    spawnDamageNumber(canvas.width/2, 210, `🌋 ${totalPower} AoE!`, "#c084fc", true);
    enemies.forEach(en=>{
      if(en.hp>0) applyDamage(hero, en, totalPower, {isCrit, label:`-${totalPower}`, particleColor:"#f97316", particleCount:24});
    });
  }
  // ── Single Target ──
  else {
    if(!target){
      spawnDamageNumber(canvas.width/2, 220, "TIDAK ADA TARGET", "#94a3b8", true);
      return;
    }
    if(handler === "SMITE_HEAL"){
      AudioSys.playSlash();
      applyDamage(hero, target, totalPower, {isCrit, label:`-${totalPower}`, particleColor:"#facc15", particleCount:26});
      const alive = heroes.filter(h=>h.hp>0).sort((a,b)=>(a.hp/a.maxHp)-(b.hp/b.maxHp));
      if(alive.length>0){
        const healAmt = Math.round(totalPower * 0.4);
        applyHealing(hero, alive[0], healAmt);
        AudioSys.playHeal();
      }
    } else {
      AudioSys.playSlash();
      applyDamage(hero, target, totalPower, {isCrit, label:`-${totalPower}`, particleColor:"#fbbf24", particleCount:26});
    }
  }

  // ── Efek modifier yang terkumpul selama sesi ──
  // Elemental modifiers only affect offensive skills. Utility modifiers
  // such as MANA/SHIELD remain valid for healing/support skills.
  const offensiveSkill = handler === "SINGLE_ATTACK" || handler === "AOE_ATTACK" || handler === "SMITE_HEAL";
  if(STATE.turnModifiers && STATE.turnModifiers.size > 0 && offensiveSkill && target){
    if(STATE.turnModifiers.has("FIRE") && target.hp>0){
      target.burnTurns = 2;
      spawnDamageNumber(target.x, target.y-90, "🔥 TERBAKAR!", "#f97316");
    }
    if(STATE.turnModifiers.has("FROST") && target.hp>0){
      target.frozen = true;
      target.intent = {type:"FROZEN",desc:"❄️ Membeku"};
      AudioSys.playFreeze();
      spawnDamageNumber(target.x, target.y-90, "❄️ BEKU!", "#93c5fd");
    }
    if(STATE.turnModifiers.has("LIGHTNING")){
      AudioSys.playZap();
      enemies.forEach(en=>{
        if(en!==target && en.hp>0) applyDamage(hero,en,BALANCE.chainZapDamage,{label:`-${BALANCE.chainZapDamage} ⚡`,color:"#67e8f9",particleColor:"#38bdf8"});
      });
    }
    if(STATE.turnModifiers.has("MANA")) changeMp(hero, BALANCE.manaTileMp);
    if(STATE.turnModifiers.has("SHIELD")) STATE.partyGuardTurns = 1;
  }

  // Banner besar
  spawnDamageNumber(canvas.width/2, 250, `⚡ TOTAL ${totalPower} ⚡`, isCrit?"#fbbf24":"#facc15", true);
  if(isCrit) spawnDamageNumber(canvas.width/2, 290, "★ CRITICAL STRIKE! ★", "#fbbf24", true);
}
function advanceToNextWord(){
  const hero = heroes[STATE.activeHeroIndex];
  const diff = getDifficultyForWave(STATE.wave);
  if(STATE.wordQueue.length < 4) STATE.wordQueue.push(pickWord(hero,diff));
  STATE.currentWord = STATE.wordQueue.shift();
  STATE.wordQueue.push(pickWord(hero,diff));
  STATE.typedChars = 0;
  STATE.wrongKeysInWord = 0;
  STATE.wordStartTime = performance.now();
  STATE.wordModifier = rollModifier();
  STATE.wordThemeMatch = isThemeMatch(STATE.currentWord, hero);
  STATE.skipped = false;
  STATE.letterBubbles = STATE.inputMode === "TAP" ? generateLetterBubbles(STATE.currentWord) : [];
}
function handleTypingKey(char){
  if(STATE.turnPhase!=="HERO_TYPING") return;
  if(performance.now() < STATE.stunUntil) return;
  if(!STATE.currentWord) return;
  const target = STATE.currentWord[STATE.typedChars];
  if(!target) return;
  if(char.toUpperCase() === target){
    STATE.typedChars++;
    AudioSys.playKeyOk(500 + STATE.typedChars*40);
    const hero = heroes[STATE.activeHeroIndex];
    spawnParticles(hero.x, hero.y-60, STATE.wordModifier?STATE.wordModifier.color:"#38bdf8", 4);
    if(STATE.typedChars >= STATE.currentWord.length) completeWord();
  } else {
    STATE.wrongKeysInWord++;
    STATE.turnWordStreak = 0;
    STATE.combo = 0;
    STATE.stunUntil = performance.now() + BALANCE.wrongKeyStunMs;
    AudioSys.playKeyBad();
    STATE.screenShake = 4;
    const hero = heroes[STATE.activeHeroIndex];
    spawnDamageNumber(hero.x, hero.y-90, "✗", "#f87171", true);
  }
}
function completeWord(){
  if(STATE.turnPhase!=="HERO_TYPING") return;
  const hero = heroes[STATE.activeHeroIndex];
  const skill = HERO_SKILLS[STATE.activeHeroIndex][STATE.selectedSkillIndex];
  const elapsed = performance.now() - STATE.wordStartTime;
  const cps = STATE.currentWord.length / (elapsed/1000);
  let speedMult = 1.2;
  if(cps >= 6) speedMult = 3.0;
  else if(cps >= 4) speedMult = 2.2;
  else if(cps >= 2.5) speedMult = 1.6;
  const isPerfect = STATE.wrongKeysInWord === 0;
  if(isPerfect){
    STATE.turnWordStreak++;
    STATE.combo++;
    STATE.wordsPerfect++;
    STATE.maxCombo = Math.max(STATE.maxCombo, STATE.combo);
    if(STATE.turnWordStreak > STATE.turnMaxStreak) STATE.turnMaxStreak = STATE.turnWordStreak;
  } else {
    STATE.turnWordStreak = 0;
    STATE.combo = 0;
  }
  if(cps > STATE.stats.bestSpeed) STATE.stats.bestSpeed = cps;
  const streakMult = 1 + Math.min(STATE.turnWordStreak*0.15, 1.0);
  const wordLengthBonus = STATE.currentWord.length * 5;
  const themeMult = STATE.wordThemeMatch ? BALANCE.themeBonusMultiplier : 1.0;
  let modMult = 1.0;
  if(STATE.wordModifier){
    if(STATE.wordModifier.id==="STAR") modMult *= BALANCE.starMultiplierBonus;
    else if(STATE.wordModifier.id==="FIRE") modMult *= 1.3;
    else if(STATE.wordModifier.id==="FROST") modMult *= 1.2;
    else if(STATE.wordModifier.id==="LIGHTNING") modMult *= 1.2;
    STATE.turnModifiers.add(STATE.wordModifier.id);
  }
  let crisisMult = 1.0;
  if(STATE.relics.some(r=>r.id==="martyr")){
    const crisis = heroes.some(h=>h.hp>0 && (h.hp/h.maxHp) < BALANCE.crisisThreshold);
    if(crisis) crisisMult = BALANCE.crisisMultiplier;
  }
  const mult = speedMult * streakMult * themeMult * modMult * crisisMult;
  let totalPower = Math.round(skill.basePower * mult) + wordLengthBonus;
  if("AIUEO".includes(STATE.currentWord[0]) && STATE.relics.some(r=>r.id==="magma")){
    totalPower += BALANCE.magmaFireBonus;
  }

  // ── AKUMULASI (tidak menyerang sekarang) ──
  STATE.stats.wordsCount++;
  STATE.turnWordsTyped++;
  STATE.turnDamageTotal += totalPower;
  if(totalPower > STATE.turnBestDamage){
    STATE.turnBestDamage = totalPower;
    STATE.turnBestWord = STATE.currentWord;
  }
  STATE.turnWordsHistory.push({word:STATE.currentWord, dmg:totalPower, speed:speedMult});

  // Animasi hero singkat (tanpa damage)
  hero.isActing = true;
  hero.actVariant = skill.animVariant || 0;
  hero.actStart = performance.now();
  setTimeout(()=>{ if(hero) hero.isActing=false; }, 450);

  // Relic quill — heal per kata sempurna
  if(isPerfect && STATE.relics.some(r=>r.id==="quill") && STATE.currentWord.length>=5){
    heroes.forEach(h=>{ if(h.hp>0) applyHealing(hero,h,BALANCE.quillHeal,{yOffset:140}); });
    AudioSys.playHeal();
  }

  // Feedback
  AudioSys.playSubmitSuccess(speedMult);
  const feedback = speedMult>=3.0 ? "PERFECT!" : speedMult>=2.2 ? "CEPAT!" : speedMult>=1.6 ? "BAGUS" : "OK";
  spawnDamageNumber(hero.x, hero.y-110, `+${totalPower}`, "#fbbf24", true);
  spawnDamageNumber(hero.x+65, hero.y-70, feedback, "#facc15", true);
  if(STATE.turnWordStreak>1) spawnDamageNumber(hero.x-65, hero.y-70, `x${STATE.turnWordStreak}`, "#fbbf24");

  advanceToNextWord();
}
function skipCurrentWord(){
  if(STATE.turnPhase!=="HERO_TYPING") return;
  if(STATE.skipped){
    spawnDamageNumber(canvas.width/2, 330, "SUDAH DI-SKIP!", "#f87171", true);
    return;
  }
  STATE.skipped = true;
  STATE.typedChars = STATE.currentWord.length;
  spawnDamageNumber(canvas.width/2, 330, "SKIP KATA", "#fb923c", true);
  AudioSys.playSelect(320);
  completeWord();
}
function skipTurn(){

function triggerPartyRush(){

        trailColor:"#fbbf24",size:22,type:"rush",

        }
      });

  });
}
function finishPartyRush(actionId){
