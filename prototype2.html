/* =========================================================
   TURN FLOW
   ========================================================= */
function advanceTurn(){
  const actionId=beginAction();
  if(enemies.every(e=>e.hp<=0)){startWalkOutTransition();return;}
  let nextIdx=STATE.activeHeroIndex+1;
  while(nextIdx<heroes.length&&heroes[nextIdx].hp<=0) nextIdx++;
  if(nextIdx<heroes.length){
    STATE.activeHeroIndex=nextIdx;
    STATE.selectedSkillIndex=0;
    const ah=heroes[nextIdx];
    if(ah.stunned){
      ah.stunned=false;
      spawnDamageNumber(ah.x,ah.y-55,"TERSTUN! GILIRAN LEWAT","#38bdf8");
      setTimeout(()=>{if(!isActionValid(actionId))return;advanceTurn();},500);
      return;
    }
    STATE.turnPhase="HERO_READY";
    startWordQueue();
  } else {
    STATE.turnPhase="ENEMY_ACTION";
    setTimeout(()=>{if(!isActionValid(actionId))return;executeEnemyTurns();},450);
  }
}
function triggerCampfireIntermission(){
  beginAction();
  STATE.turnPhase="CAMPFIRE";
  AudioSys.playCampfire();
  const unowned=ALL_RELICS.filter(r=>!STATE.relics.some(ur=>ur.id===r.id));
  const sh=unowned.sort(()=>Math.random()-0.5);
  STATE.offeredRelics=sh.slice(0,3);
}
function handleCampfireClick(x,y){
  if(STATE.turnPhase!=="CAMPFIRE") return;
  if(!STATE.offeredRelics||STATE.offeredRelics.length===0) return;
  const cardW=240,cardH=140;
  const startX=(canvas.width-(STATE.offeredRelics.length*cardW+(STATE.offeredRelics.length-1)*20))/2;
  const cardY=320;
  for(let idx=0;idx<STATE.offeredRelics.length;idx++){
    const relic=STATE.offeredRelics[idx];
    const rx=startX+idx*(cardW+20);
    if(x>=rx&&x<=rx+cardW&&y>=cardY&&y<=cardY+cardH){
      STATE.relics.push(relic);
      STATE.offeredRelics=[];
      STATE.partyGuardTurns=0;
      AudioSys.playSpecial();
      heroes.forEach(h=>{if(h.hp>0){applyHealing(null,h,Math.round(h.maxHp*BALANCE.campfireHealPercent));changeMp(h,Math.round(h.maxMp*BALANCE.campfireHealPercent));}});
      STATE.wave++;
      enemies=makeWave(STATE.wave);
      STATE.selectedEnemyIndex=0;
      startWalkInTransition();
      break;
    }
  }
}
function executeEnemyTurns(){
  const actionId=beginAction();
  const aliveEnemies=enemies.filter(e=>e.hp>0);
  aliveEnemies.forEach(en=>{
    if(en.burnTurns>0&&en.hp>0){applyDamage(null,en,BALANCE.burnDamage,{label:`-${BALANCE.burnDamage} (BURN)`,color:"#f97316",particleColor:"#f97316",particleCount:14,yOffset:55});en.burnTurns--;}
    if(en.poisonTurns>0&&en.hp>0){applyDamage(null,en,10,{label:`-10 (RACUN)`,color:"#4ade80",particleColor:"#22c55e",particleCount:14,yOffset:65});en.poisonTurns--;}
  });
  if(enemies.every(e=>e.hp<=0)){advanceTurn();return;}
  if(!isActionValid(actionId)||isCombatFinished()) return;
  const attackers=enemies.filter(e=>e.hp>0);
  if(attackers.length===0){finishEnemyPhase(actionId);return;}
  let currIdx=0;
  function step(){
    if(!isActionValid(actionId)||isCombatFinished()) return;
    if(currIdx>=attackers.length){finishEnemyPhase(actionId);return;}
    const enemy=attackers[currIdx];currIdx++;
    if(enemy.hp<=0){step();return;}
    if(enemy.frozen){enemy.frozen=false;enemy.intent=null;spawnDamageNumber(enemy.x,enemy.y-45,"ES MENCAIR","#93c5fd");setTimeout(step,400);return;}
    if(enemy.stunned){enemy.stunned=false;spawnDamageNumber(enemy.x,enemy.y-45,"STUN HILANG","#94a3b8");setTimeout(step,400);return;}
    if(enemy.intent&&enemy.intent.type==="DOOM"){ENEMY_ACTION_HANDLERS.DOOM();setTimeout(step,500);return;}
    const alive=heroes.filter(h=>h.hp>0);
    if(alive.length===0){STATE.turnPhase="GAME_OVER";STATE.overSince=performance.now();beginAction();return;}
    enemy.isActing=true;
    enemy.actVariant=enemy.intent?enemy.intent.animVariant||0:0;
    enemy.actStart=performance.now();
    setTimeout(()=>{
      if(!isActionValid(actionId)||enemy.hp<=0||isCombatFinished()){enemy.isActing=false;step();return;}
      enemy.isActing=false;
      const dmgVal=(enemy.intent&&enemy.intent.val)?enemy.intent.val:getEnemyAttackPower(STATE.wave,enemy.role==="Caster");
      const tgts=heroes.filter(h=>h.hp>0);
      if(tgts.length===0){STATE.turnPhase="GAME_OVER";STATE.overSince=performance.now();beginAction();return;}
      const type=enemy.intent?enemy.intent.type:"ATTACK";
      (ENEMY_ACTION_HANDLERS[type]||ENEMY_ACTION_HANDLERS.ATTACK)({enemy,damageVal:dmgVal,targetsAtHit:tgts,actionId});
      if(heroes.every(h=>h.hp<=0)){STATE.turnPhase="GAME_OVER";STATE.overSince=performance.now();beginAction();return;}
      setTimeout(step,450);
    },250);
  }
  step();
}
function finishEnemyPhase(actionId){
  if(!isActionValid(actionId)||isCombatFinished()) return;
  STATE.partyGuardTurns=0;
  const extraMp=STATE.relics.some(r=>r.id==="grail")?BALANCE.grailBonusMp:0;
  heroes.forEach(h=>{if(h.hp>0) changeMp(h,BALANCE.turnMpRegen+extraMp);});
  let firstAlive=heroes.findIndex(h=>h.hp>0);
  if(firstAlive!==-1){
    STATE.activeHeroIndex=firstAlive;
    STATE.selectedSkillIndex=0;
    refreshEnemyIntents();
    const ah=heroes[firstAlive];
    if(ah.stunned){
      ah.stunned=false;
      spawnDamageNumber(ah.x,ah.y-55,"TERSTUN! GILIRAN LEWAT","#38bdf8");
      setTimeout(()=>{if(!isActionValid(actionId))return;advanceTurn();},500);
      return;
    }
    STATE.turnPhase="HERO_READY";
    startWordQueue();
  } else {
    STATE.turnPhase="GAME_OVER";
    STATE.overSince=performance.now();
    beginAction();
  }
}

/* =========================================================
   SKILL & ENEMY ACTION HANDLERS
   ========================================================= */
const ENEMY_ACTION_HANDLERS={
  ATTACK:({enemy,damageVal,targetsAtHit})=>{
    const target=targetsAtHit[Math.floor(Math.random()*targetsAtHit.length)];
    AudioSys.playSlash();
    applyDamage(enemy,target,damageVal,{label:STATE.partyGuardTurns>0?`-${Math.round(damageVal*BALANCE.guardMultiplier)} (G)`:`-${damageVal}`,color:STATE.partyGuardTurns>0?"#facc15":"#ef4444",particleColor:"#ef4444"});
  },
  STUN_ATTACK:({enemy,damageVal,targetsAtHit})=>{
    const target=targetsAtHit[Math.floor(Math.random()*targetsAtHit.length)];
    AudioSys.playSlash();
    const a=applyDamage(enemy,target,damageVal,{label:`-${damageVal}`,color:"#ef4444",particleColor:"#ef4444"});
    if(a>0&&target.hp>0){target.stunned=true;spawnDamageNumber(target.x,target.y-60,"PUSING!","#38bdf8");}
  },
  MAGIC_AOE:({enemy,damageVal,targetsAtHit,actionId})=>{
    AudioSys.playMagic();
    for(const h of targetsAtHit){
      if(!isActionValid(actionId)||isCombatFinished()||h.hp<=0) break;
      applyDamage(enemy,h,damageVal,{label:`-${damageVal} (MAGIC)`,color:"#c084fc",particleColor:"#a855f7"});
    }
  },
  POISON_SPIT:({enemy,damageVal,targetsAtHit,actionId})=>{
    AudioSys.playMagic();
    const target=targetsAtHit[Math.floor(Math.random()*targetsAtHit.length)];
    if(!target||!isActionValid(actionId)||target.hp<=0)return;
    const dealt=applyDamage(enemy,target,damageVal,{label:`-${damageVal} (RACUN)`,color:"#a855f7",particleColor:"#22c55e",particleCount:22,yOffset:65});
    if(dealt>0&&target.hp>0){
      target.poisonTurns=Math.max(target.poisonTurns,2);
      spawnDamageNumber(target.x,target.y-85,"☠️ TERACUN!","#4ade80",true);
    }
  },
  DOOM:()=>{
    AudioSys.playExplode();
    STATE.screenShake=16;
    const alive=heroes.filter(h=>h.hp>0);
    if(alive.length>0){
      const rh=alive[Math.floor(Math.random()*alive.length)];
      applyDamage(null,rh,BALANCE.doomDamage,{color:"#ef4444",particleColor:"#f97316",particleCount:30,yOffset:70});
    }
  }
};

/* =========================================================
   DRAWING — CHARACTER
   ========================================================= */
function drawCharacterSprite(entity,isCurrentTurn,isTargeted,isWalking=false){
  const now=performance.now();
  const isDead=entity.hp<=0;
  if(entity.hurtTimer>0) entity.hurtTimer=Math.max(0,entity.hurtTimer-16);
  const drawX=entity.x+(entity.animOffset||0);
  const drawY=entity.y;
  let stateName;
  if(isDead) stateName="dead";
  else if(entity.hurtTimer>140) stateName="hurt";
  else if(entity.isActing) stateName=(entity.actVariant===1)?"act2":"act1";
  else if(isWalking) stateName="walk";
  else stateName="idle";
  let frameIdx=0;
  let variant=entity.actVariant||0;
  if(stateName==="idle") frameIdx=Math.floor(now/280)%4;
  else if(stateName==="walk") frameIdx=Math.floor(now/110)%6;
  else if(stateName==="hurt") frameIdx=Math.floor(now/100)%2;
  else if(stateName==="act1"||stateName==="act2"){const el=now-(entity.actStart||now);frameIdx=Math.min(4,Math.floor(el/90));}
  let spriteKey;
  if(stateName==="act1"||stateName==="act2") spriteKey=`${entity.spriteKey}_${stateName}_${variant}_${frameIdx}`;
  else if(stateName==="dead") spriteKey=`${entity.spriteKey}_hurt_1`;
  else spriteKey=`${entity.spriteKey}_${stateName}_${frameIdx}`;
  let spriteCanvas=SpriteLibrary.sprites[spriteKey]||SpriteLibrary.sprites[`${entity.spriteKey}_idle_0`];
  const flashCanvas=SpriteLibrary.flashes[spriteKey]||SpriteLibrary.flashes[`${entity.spriteKey}_idle_0`];
  ctx.save();
  let deathProgress=0;
  if(isDead){
    deathProgress=Math.min(1,(now-(entity.deathTime||now))/600);
    if(!entity.deathTime) deathProgress=1;
    ctx.translate(drawX,drawY+50);
    ctx.rotate((entity.isHero?-1:1)*deathProgress*Math.PI*0.42);
    ctx.translate(-drawX,-(drawY+50));
    ctx.globalAlpha=1-deathProgress*0.55;
  }
  let lunge=0;
  if(stateName==="act1"||stateName==="act2"){
    const isAct2=stateName==="act2";
    const facing=entity.isHero?-1:1;
    const lungePattern=isAct2?[-2,3,-14,-10,-3]:[-3,4,-12,-8,-2];
    lunge=(lungePattern[frameIdx]||0)*facing*1.2;
  } else if(stateName==="hurt"){lunge=(entity.isHero?1:-1)*6;}
  const finalX=drawX+lunge;
  if(isCurrentTurn&&!isDead&&!isWalking){
    const pulse=Math.sin(now*0.006)*3;
    ctx.strokeStyle="#f59e0b";ctx.lineWidth=3;
    ctx.fillStyle="rgba(245,158,11,0.20)";
    ctx.beginPath();ctx.ellipse(finalX,drawY+50,40+pulse*0.5,13,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle="#f59e0b";
    const bob=Math.sin(now*0.008)*3;
    ctx.beginPath();ctx.moveTo(finalX,drawY-66+bob);ctx.lineTo(finalX-9,drawY-82+bob);ctx.lineTo(finalX+9,drawY-82+bob);ctx.closePath();ctx.fill();
  }
  if(isTargeted&&!entity.isHero&&!isDead){
    const pulse=Math.sin(now*0.007)*2.5;
    ctx.strokeStyle="#ef4444";ctx.lineWidth=2.5;
    ctx.fillStyle="rgba(239,68,68,0.22)";
    ctx.beginPath();ctx.ellipse(finalX,drawY+50,40,13,0,0,Math.PI*2);ctx.fill();ctx.stroke();
    const bD=40+pulse,bL=10;
    ctx.strokeStyle="#ef4444";ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(finalX-bD,drawY-bD+bL);ctx.lineTo(finalX-bD,drawY-bD);ctx.lineTo(finalX-bD+bL,drawY-bD);
    ctx.moveTo(finalX+bD-bL,drawY-bD);ctx.lineTo(finalX+bD,drawY-bD);ctx.lineTo(finalX+bD,drawY-bD+bL);
    ctx.moveTo(finalX-bD,drawY+bD-bL);ctx.lineTo(finalX-bD,drawY+bD);ctx.lineTo(finalX-bD+bL,drawY+bD);
    ctx.moveTo(finalX+bD-bL,drawY+bD);ctx.lineTo(finalX+bD,drawY+bD);ctx.lineTo(finalX+bD,drawY+bD-bL);
    ctx.stroke();
    const hasIntent=entity.intent&&STATE.turnPhase==="HERO_READY";
    const badgeY=drawY-(hasIntent?110:90)+pulse;
    ctx.fillStyle="rgba(153,27,27,0.95)";ctx.strokeStyle="#f87171";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(finalX-38,badgeY-14,76,17,4);ctx.fill();ctx.stroke();
    ctx.fillStyle="#ffffff";ctx.font="bold 10px monospace";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("🎯 TARGET",finalX,badgeY-5);
  }
  if(STATE.partyGuardTurns>0 && entity.isHero && !isDead){
    ctx.strokeStyle="rgba(250,204,21,0.75)";ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(finalX,drawY+6,48,0,Math.PI*2);ctx.stroke();
  }
  if(spriteCanvas){
    const sw=SPRITE_SIZE*SPRITE_SCALE;
    const sh=SPRITE_SIZE*SPRITE_SCALE;
    const px=Math.floor(finalX-sw/2);
    const py=Math.floor(drawY-sh/2);
    if(!isDead){
      ctx.fillStyle="rgba(0,0,0,0.30)";
      ctx.beginPath();ctx.ellipse(finalX,drawY+50,32,8,0,0,Math.PI*2);ctx.fill();
    }
    ctx.drawImage(spriteCanvas,0,0,SPRITE_SIZE,SPRITE_SIZE,px,py,sw,sh);
    if(stateName==="hurt" && entity.hurtTimer>140 && flashCanvas){
      ctx.globalAlpha=0.75;
      ctx.drawImage(flashCanvas,0,0,SPRITE_SIZE,SPRITE_SIZE,px,py,sw,sh);
      ctx.globalAlpha=1;
    }
  }
  if(!isWalking && !isDead){
    const barW=66,barH=7;
    const barX=finalX-barW/2;
    const barY=drawY+60;
    ctx.fillStyle="rgba(0,0,0,0.82)";
    ctx.fillRect(barX-1,barY-1,barW+2,barH+2);
    const hpPct=Math.max(0,entity.hp/entity.maxHp);
    ctx.fillStyle=entity.isHero?"#22c55e":"#ef4444";
    ctx.fillRect(barX,barY,barW*hpPct,barH);
    ctx.fillStyle="rgba(255,255,255,0.25)";
    ctx.fillRect(barX,barY,barW*hpPct,2);
    if(entity.isHero){
      const mpPct=Math.max(0,entity.mp/entity.maxMp);
      ctx.fillStyle="rgba(0,0,0,0.82)";
      ctx.fillRect(barX-1,barY+8,barW+2,4);
      ctx.fillStyle="#38bdf8";
      ctx.fillRect(barX,barY+9,barW*mpPct,3);
    }
    ctx.fillStyle="#f8fafc";ctx.font="bold 11px monospace";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(entity.name,finalX,barY-8);
    ctx.font="bold 9px monospace";ctx.fillStyle="#cbd5e1";
    ctx.fillText(`${entity.hp}/${entity.maxHp}`,finalX,barY+22);
    if(!entity.isHero && !isDead && entity.intent && STATE.turnPhase==="HERO_READY"){
      ctx.fillStyle="rgba(15,23,42,0.92)";ctx.strokeStyle="#f59e0b";ctx.lineWidth=1.5;
      ctx.beginPath();ctx.roundRect(finalX-52,drawY-78,104,22,5);ctx.fill();ctx.stroke();
      ctx.fillStyle=entity.intent.type==="MAGIC_AOE"?"#c084fc":entity.intent.type==="DOOM"?"#f97316":entity.intent.type==="STUN_ATTACK"?"#38bdf8":entity.intent.type==="FROZEN"?"#93c5fd":"#f87171";
      ctx.font="bold 11px monospace";
      ctx.fillText(entity.intent.desc,finalX,drawY-63);
    }
  }
  if(entity.frozen && !isDead){ctx.fillStyle="#93c5fd";ctx.font="bold 13px monospace";ctx.textAlign="center";ctx.fillText("❄️ BEKU",finalX,drawY-38);}
  else if(entity.stunned && !isDead){ctx.fillStyle="#38bdf8";ctx.font="bold 13px monospace";ctx.textAlign="center";ctx.fillText("💫 STUN",finalX,drawY-38);}
  if(entity.burnTurns>0 && !isDead){ctx.fillStyle="#f97316";ctx.font="bold 12px monospace";ctx.textAlign="center";ctx.fillText(`🔥${entity.burnTurns}`,finalX+38,drawY-28);}
  if(entity.poisonTurns>0 && !isDead){ctx.fillStyle="#4ade80";ctx.font="bold 12px monospace";ctx.textAlign="center";ctx.fillText(`☠️${entity.poisonTurns}`,finalX-38,drawY-28);}
  ctx.restore();
}

/* =========================================================
   DRAWING — BACKGROUND, PARTICLES, PROJECTILES
   ========================================================= */
function drawDungeonBackground(){
  ctx.fillStyle="#0c0f1c";
  ctx.fillRect(0,0,canvas.width,240);
  const blockW=60,blockH=30;
  for(let y=0;y<240;y+=blockH){
    const off=(y/blockH)%2===0?0:blockW/2;
    for(let x=-blockW;x<canvas.width+blockW;x+=blockW){
      const bx=x+off;
      const shade=((Math.floor(x/blockW)+Math.floor(y/blockH))%3);
      const colors=["#181d2e","#151a29","#1a2035"];
      ctx.fillStyle=colors[shade];
      ctx.fillRect(bx,y,blockW-2,blockH-2);
      ctx.fillStyle="rgba(80,95,140,0.18)";
      ctx.fillRect(bx,y,blockW-2,1);
      ctx.fillStyle="rgba(0,0,0,0.35)";
      ctx.fillRect(bx,y+blockH-3,blockW-2,1);
    }
  }
  const mist=ctx.createLinearGradient(0,0,0,240);
  mist.addColorStop(0,"rgba(80,100,160,0.06)");
  mist.addColorStop(0.6,"rgba(40,50,90,0.10)");
  mist.addColorStop(1,"rgba(10,15,25,0)");
  ctx.fillStyle=mist;ctx.fillRect(0,0,canvas.width,240);
  const torchTime=Date.now()*0.007;

function spawnDamageNumber(x,y,text,color,slow){

}
function spawnParticles(x,y,color,count=15){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2;
    const s=1.2+Math.random()*4.5;
    STATE.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,life:1.0,size:3+Math.random()*3});
  }
  while(STATE.particles.length>BALANCE.maxParticles) STATE.particles.shift();

function updateAndDrawProjectiles(){
  for(let i=STATE.projectiles.length-1;i>=0;i--){
    const p=STATE.projectiles[i];
    const dx=p.targetX-p.x,dy=p.targetY-p.y;
    const dist=Math.hypot(dx,dy)||1;
    const ang=Math.atan2(dy,dx);
    if(dist<22){STATE.projectiles.splice(i,1);resolveProjectile(p);continue;}
    p.x+=(dx/dist)*28;p.y+=(dy/dist)*28;
    p.angle=ang;p.life++;
    if(!p.trail) p.trail=[];
    p.trail.push({x:p.x,y:p.y,life:1});
    if(p.trail.length>12) p.trail.shift();
    ctx.save();
    for(let ti=0;ti<p.trail.length;ti++){
      const t=p.trail[ti];t.life-=0.08;
      const a=Math.max(0,t.life)*(ti/p.trail.length)*0.6;
      if(a<=0) continue;
      ctx.globalAlpha=a;ctx.fillStyle=p.trailColor;
      ctx.beginPath();ctx.arc(t.x,t.y,(p.size*0.4)*(ti/p.trail.length),0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
    ctx.save();
    ctx.translate(p.x,p.y);ctx.rotate(p.angle);
    ctx.shadowColor=p.trailColor;ctx.shadowBlur=20;
    ctx.fillStyle=p.color;
    switch(p.type){
      case "arrow":{ctx.fillRect(-p.size*0.7,-2,p.size*1.4,4);ctx.beginPath();ctx.moveTo(p.size*0.65,-7);ctx.lineTo(p.size*1.15,0);ctx.lineTo(p.size*0.65,7);ctx.closePath();ctx.fill();break;}
      case "lightning":{ctx.shadowBlur=26;ctx.strokeStyle=p.color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-16,0);ctx.lineTo(-6,-8);ctx.lineTo(0,3);ctx.lineTo(6,-7);ctx.lineTo(16,0);ctx.stroke();ctx.strokeStyle="#ffffff";ctx.lineWidth=1.6;ctx.stroke();break;}
      case "fireball":{const r=p.size*0.7;const g=ctx.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,"#fff7cc");g.addColorStop(0.4,p.color);g.addColorStop(0.8,"#dc2626");g.addColorStop(1,"rgba(239,68,68,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();break;}
      case "shield":{ctx.fillStyle=p.color;ctx.beginPath();ctx.moveTo(0,-p.size*0.6);ctx.lineTo(p.size*0.55,0);ctx.lineTo(0,p.size*0.6);ctx.lineTo(-p.size*0.55,0);ctx.closePath();ctx.fill();ctx.fillStyle="#eab308";ctx.fillRect(-1,-p.size*0.4,2,p.size*0.8);ctx.fillRect(-p.size*0.3,-1,p.size*0.6,2);break;}
      case "smite":{ctx.fillStyle=p.color;ctx.fillRect(-2.5,-p.size*0.65,5,p.size*1.3);ctx.fillRect(-p.size*0.55,-4,p.size*1.1,8);break;}
      case "rush":{const r=p.size*0.6;const g=ctx.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,"#ffffff");g.addColorStop(0.4,p.color);g.addColorStop(1,"rgba(255,255,255,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();break;}
      default:{ctx.beginPath();ctx.arc(0,0,p.size*0.75,-1.1,1.1);ctx.lineWidth=6;ctx.strokeStyle=p.color;ctx.stroke();ctx.beginPath();ctx.arc(0,0,p.size*0.75,-0.75,0.75);ctx.lineWidth=2;ctx.strokeStyle="#ffffff";ctx.stroke();}
    }
    ctx.restore();
  }
}

  else if(STATE.turnPhase==="HERO_TYPING"){
    const remain = Math.max(0, 1 - STATE.turnElapsed/STATE.turnTimeLimit);

    const barW = 400, barH = 20, barX = 40, barY = 372;
    ctx.fillStyle="rgba(0,0,0,0.7)";
    ctx.beginPath();ctx.roundRect(barX-1,barY-1,barW+2,barH+2,6);ctx.fill();

    ctx.fillStyle="#ffffff";ctx.font="bold 20px monospace";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(`⏱ ${remainSec}s`, barX+barW/2, barY+barH/2);

    // Word display
    if(STATE.currentWord){
      const word = STATE.currentWord;
      const cx = 240, cy = 425;
      const wordFontSize = STATE.inputMode==="TAP" ? 30 : 40;
      ctx.font=`bold ${wordFontSize}px 'Courier New', monospace`;
      ctx.textAlign="left";ctx.textBaseline="middle";
      const charWidths = word.split("").map(ch=>ctx.measureText(ch).width);
      const totalW = charWidths.reduce((a,b)=>a+b,0);
      let x = cx - totalW/2;
      for(let i=0;i<word.length;i++){
        const typed = i<STATE.typedChars;
        const isCurrent = i===STATE.typedChars;
        if(typed){ ctx.fillStyle="#22c55e"; ctx.shadowColor="#22c55e"; ctx.shadowBlur=8; }
        else if(isCurrent && STATE.inputMode==="TYPE"){
          const blink = Math.sin(performance.now()*0.01)>0;

          ctx.shadowColor="#facc15"; ctx.shadowBlur=14;
        } else if(isCurrent){
          ctx.fillStyle="#facc15"; ctx.shadowColor="#facc15"; ctx.shadowBlur=14;
        } else { ctx.fillStyle="#f1f5f9"; ctx.shadowBlur=0; }
        ctx.fillText(word[i], x, cy);
        if(isCurrent && STATE.inputMode==="TYPE"){
          ctx.shadowBlur=0; ctx.fillStyle="#facc15";
          ctx.fillRect(x-2, cy+wordFontSize*0.4, charWidths[i]+2, 3);
        }
        x += charWidths[i];
      }

      if(STATE.wordModifier){
        ctx.fillStyle=STATE.wordModifier.color;

        ctx.fillText("★ TEMA", 440, 425);
      }
    }

    // Bubbles TAP mode
    if(STATE.inputMode==="TAP"){
      const now = performance.now();
      for(const b of STATE.letterBubbles){
        const age = now - b.spawnTime;
        if(age < 0) continue;
        const t = Math.min(1, age/180);
        const ease = 1 - Math.pow(1-t, 3);
        const scale = b.used ? Math.max(0.5, 1 - (now - b.spawnTime - 100)/300) : ease;
        if(scale <= 0.05) continue;
        const isWrong = (now - b.wrongFlash) < 220;
        const alpha = b.used ? Math.max(0, 1 - (now - b.spawnTime - 100)/500) : 1;
        if(alpha <= 0) continue;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(b.x, b.y);
        const shake = isWrong ? Math.sin((now-b.wrongFlash)*0.05)*4 : 0;
        ctx.translate(shake, 0);
        ctx.scale(scale, scale);
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.beginPath(); ctx.arc(0, 4, b.r, 0, Math.PI*2); ctx.fill();
        let fill1, fill2, stroke;
        if(b.used){
          fill1="#14532d"; fill2="#166534"; stroke="#4ade80";
        } else if(isWrong){
          fill1="#7f1d1d"; fill2="#991b1b"; stroke="#f87171";
        } else {
          fill1="#1e3a8a"; fill2="#1e40af"; stroke="#60a5fa";
        }
        const grd = ctx.createRadialGradient(-b.r*0.3, -b.r*0.3, b.r*0.2, 0, 0, b.r);
        grd.addColorStop(0, fill2); grd.addColorStop(1, fill1);
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.20)";
        ctx.beginPath(); ctx.arc(-b.r*0.3, -b.r*0.3, b.r*0.4, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = stroke; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, 0, b.r, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = "#ffffff"; ctx.font = `bold ${Math.floor(b.r*1.1)}px monospace`;
        ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(b.char, 0, 1);
        ctx.restore();
      }
    }

     // Live stats + charge indicator
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillStyle="#fbbf24";ctx.font="bold 22px monospace";
    ctx.fillText(`⚡ CHARGE: ${STATE.turnDamageTotal}`, 240, 460);

    // Tombol skip: sengaja berupa UI, bukan shortcut keyboard, agar tidak bentrok dengan typing.

    ctx.beginPath();ctx.roundRect(BTN_SKIP_WORD.x,BTN_SKIP_WORD.y,BTN_SKIP_WORD.w,BTN_SKIP_WORD.h,7);ctx.fill();ctx.stroke();

  ctx.fillText(AudioSys.bgmPlaying?"🎵 BGM: ON":"🔇 BGM: OFF", BTN_BGM.x+BTN_BGM.w/2, BTN_BGM.y+BTN_BGM.h/2);
  // CRT
  ctx.fillStyle=STATE.crtEnabled?"#14532d":"#1e293b";
  ctx.strokeStyle=STATE.crtEnabled?"#4ade80":"#475569";
  ctx.beginPath();ctx.roundRect(BTN_CRT.x,BTN_CRT.y,BTN_CRT.w,BTN_CRT.h,6);ctx.fill();ctx.stroke();
  ctx.fillStyle="#f8fafc";
  ctx.fillText(STATE.crtEnabled?"📺 CRT: ON":"📺 CRT: OFF", BTN_CRT.x+BTN_CRT.w/2, BTN_CRT.y+BTN_CRT.h/2);
  // MODE
  ctx.fillStyle=STATE.inputMode==="TAP"?"#7c2d12":"#1e293b";
  ctx.strokeStyle=STATE.inputMode==="TAP"?"#fb923c":"#475569";
  ctx.beginPath();ctx.roundRect(BTN_MODE.x,BTN_MODE.y,BTN_MODE.w,BTN_MODE.h,6);ctx.fill();ctx.stroke();
  ctx.fillStyle="#f8fafc";
  ctx.fillText(STATE.inputMode==="TAP"?"👆 TAP: ON":"⌨️ TAP: OFF", BTN_MODE.x+BTN_MODE.w/2, BTN_MODE.y+BTN_MODE.h/2);
}
function drawCampfireScene(){
  ctx.fillStyle="#05070d";ctx.fillRect(0,0,canvas.width,canvas.height);
  const fireTime=Date.now()*0.008;
  const rad=90+Math.sin(fireTime)*12;
  const grad=ctx.createRadialGradient(canvas.width/2,200,10,canvas.width/2,200,rad*3);
  grad.addColorStop(0,"rgba(251,191,36,0.9)");
  grad.addColorStop(0.3,"rgba(249,115,22,0.5)");
  grad.addColorStop(0.7,"rgba(180,83,9,0.18)");
  grad.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=grad;ctx.beginPath();ctx.arc(canvas.width/2,200,rad*3,0,Math.PI*2);ctx.fill();
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    const rx=canvas.width/2+Math.cos(a)*28;
    const ry=210+Math.sin(a)*8;
    ctx.fillStyle="#334155";
    ctx.beginPath();ctx.ellipse(rx,ry,6,4,0,0,Math.PI*2);ctx.fill();
  }
  heroes.forEach((h,idx)=>{
    const cx=canvas.width/2-180+idx*120,cy=215;
    const idleF=Math.floor(STATE.animTimer/300)%4;
    const spr=SpriteLibrary.sprites[`${h.spriteKey}_idle_${idleF}`];
    if(spr){const sz=SPRITE_SIZE*SPRITE_SCALE*0.9;ctx.drawImage(spr,0,0,SPRITE_SIZE,SPRITE_SIZE,cx-sz/2,cy-sz/2,sz,sz);}
  });
  ctx.fillStyle="#facc15";ctx.font="bold 26px monospace";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText("PERISTIRAHATAN API UNGGUN",canvas.width/2,75);
  ctx.fillStyle="#94a3b8";ctx.font="14px monospace";
  ctx.fillText("Party pulih +40% HP & MP. Pilih 1 Relik:",canvas.width/2,105);
  const cardW=240,cardH=140;
  const startX=(canvas.width-(STATE.offeredRelics.length*cardW+(STATE.offeredRelics.length-1)*20))/2;
  const cardY=320;
  STATE.offeredRelics.forEach((relic,idx)=>{
    const rx=startX+idx*(cardW+20);
    ctx.fillStyle="#0f172a";ctx.strokeStyle="#38bdf8";ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(rx,cardY,cardW,cardH,8);ctx.fill();ctx.stroke();
    ctx.font="32px monospace";
    ctx.fillText(relic.icon,rx+cardW/2,cardY+45);
    ctx.fillStyle="#f8fafc";ctx.font="bold 15px monospace";
    ctx.fillText(relic.name,rx+cardW/2,cardY+75);
    ctx.fillStyle="#94a3b8";ctx.font="11px monospace";
    ctx.fillText(relic.desc,rx+cardW/2,cardY+105);
    ctx.fillStyle="#38bdf8";ctx.font="bold 11px monospace";
    ctx.fillText("[KLIK UNTUK MEMILIH]",rx+cardW/2,cardY+128);
  });
}
function drawGameOverlay(){
  if(isCombatFinished()&&!STATE.overSince) STATE.overSince=performance.now();
  if(isCombatFinished()){
    ctx.fillStyle="rgba(7,8,13,0.92)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    const isWin=STATE.turnPhase==="VICTORY";
    ctx.fillStyle=isWin?"#facc15":"#ef4444";
    ctx.font="bold 38px monospace";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(isWin?"DUNGEON DITAKLUKKAN!":"SELURUH PARTY GUGUR!",canvas.width/2,180);
    ctx.fillStyle="#0f172a";ctx.strokeStyle=isWin?"#eab308":"#64748b";ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(canvas.width/2-240,220,480,240,8);ctx.fill();ctx.stroke();
    ctx.fillStyle="#38bdf8";ctx.font="bold 16px monospace";
    ctx.fillText("📜 CATATAN EKSPEDISI",canvas.width/2,255);
    ctx.fillStyle="#e2e8f0";ctx.font="13px monospace";ctx.textAlign="left";
    const lx=canvas.width/2-200;
    ctx.fillText(`• Total Kata: ${STATE.stats.wordsCount}`,lx,295);
    ctx.fillText(`• Kata Terkuat: ${STATE.stats.bestWord} (${STATE.stats.bestWordDmg} dmg)`,lx,320);
    ctx.fillText(`• Total Damage: ${STATE.stats.totalDamageDealt}`,lx,345);
    ctx.fillText(`• Combo Max: x${STATE.maxCombo}  |  Perfect: ${STATE.wordsPerfect}`,lx,370);
    ctx.fillText(`• Kecepatan Terbaik: ${STATE.stats.bestSpeed.toFixed(1)} huruf/detik`,lx,395);
    ctx.fillText(`• Relik: ${STATE.relics.length} artefak`,lx,420);
    ctx.textAlign="center";ctx.fillStyle="#94a3b8";ctx.font="bold 13px monospace";
    ctx.fillText("Klik di mana saja / [Enter] untuk memulai ekspedisi baru",canvas.width/2,500);
  }
}

let crtCanvas=null;
function initCrtOverlay(){
  crtCanvas=document.createElement("canvas");
  crtCanvas.width=canvas.width;crtCanvas.height=canvas.height;
  const cctx=crtCanvas.getContext("2d");
  cctx.fillStyle="rgba(0,0,0,0.22)";
  for(let y=0;y<canvas.height;y+=3) cctx.fillRect(0,y,canvas.width,1.2);
  const vig=cctx.createRadialGradient(canvas.width/2,canvas.height/2,canvas.height*0.45,canvas.width/2,canvas.height/2,canvas.height*0.85);
  vig.addColorStop(0,"rgba(0,0,0,0)");vig.addColorStop(1,"rgba(0,0,0,0.5)");
  cctx.fillStyle=vig;cctx.fillRect(0,0,canvas.width,canvas.height);
}
function drawCrtEffect(){if(!STATE.crtEnabled||!crtCanvas) return;ctx.drawImage(crtCanvas,0,0);}

/* =========================================================
   BUTTON COORDS
   ========================================================= */
const BTN_TITLE_START={x:340,y:440,w:300,h:56};
const BTN_BGM={x:865,y:12,w:98,h:26};
const BTN_CRT={x:760,y:12,w:98,h:26};
const BTN_MODE={x:655,y:12,w:98,h:26};
const BTN_SKIP_WORD={x:760,y:575,w:180,h:38};

/* =========================================================
   INPUT
   ========================================================= */
function getCanvasCoords(e){
  const rect=canvas.getBoundingClientRect();
  return {x:(e.clientX-rect.left)*(canvas.width/rect.width),y:(e.clientY-rect.top)*(canvas.height/rect.height)};
}
function handlePointerDown(e){
  AudioSys.init();
  const pos=getCanvasCoords(e);
  if(pos.x>=BTN_BGM.x&&pos.x<=BTN_BGM.x+BTN_BGM.w&&pos.y>=BTN_BGM.y&&pos.y<=BTN_BGM.y+BTN_BGM.h){AudioSys.toggleBgm();return;}
  if(pos.x>=BTN_CRT.x&&pos.x<=BTN_CRT.x+BTN_CRT.w&&pos.y>=BTN_CRT.y&&pos.y<=BTN_CRT.y+BTN_CRT.h){STATE.crtEnabled=!STATE.crtEnabled;AudioSys.playSelect(540);return;}
  if(pos.x>=BTN_MODE.x&&pos.x<=BTN_MODE.x+BTN_MODE.w&&pos.y>=BTN_MODE.y&&pos.y<=BTN_MODE.y+BTN_MODE.h){ toggleInputMode(); return; }
  // TITLE — only the visible Start button is interactive.
  if(STATE.turnPhase==="TITLE"){
    if(pos.x>=BTN_TITLE_START.x&&pos.x<=BTN_TITLE_START.x+BTN_TITLE_START.w&&
       pos.y>=BTN_TITLE_START.y&&pos.y<=BTN_TITLE_START.y+BTN_TITLE_START.h){
      AudioSys.playSpecial();AudioSys.startBgm();startWalkInTransition();
    }
    return;
  }
  // CAMPFIRE
  if(STATE.turnPhase==="CAMPFIRE"){handleCampfireClick(pos.x,pos.y);return;}
  // GAME OVER
  if(isCombatFinished()){ if(performance.now()-STATE.overSince<900) return; resetGame(); return; }

  // HERO_READY
  if(STATE.turnPhase==="HERO_READY"){
    const SKILL_BTNS=[{x:485,y:450,w:230,h:64},{x:725,y:450,w:230,h:64}];
    for(let i=0;i<SKILL_BTNS.length;i++){
      const b=SKILL_BTNS[i];
      if(pos.x>=b.x&&pos.x<=b.x+b.w&&pos.y>=b.y&&pos.y<=b.y+b.h){STATE.selectedSkillIndex=i;AudioSys.playSelect(520);return;}
    }
    if(pos.x>=36&&pos.x<=444&&pos.y>=620&&pos.y<=648){ beginHeroTypingTurn(); return; }
    return;
  }
  // HERO_TYPING: shortcut keyboard dimatikan; skip tersedia sebagai tombol UI.
  if(STATE.turnPhase==="HERO_TYPING"){
    if(pos.x>=BTN_SKIP_WORD.x&&pos.x<=BTN_SKIP_WORD.x+BTN_SKIP_WORD.w&&
       pos.y>=BTN_SKIP_WORD.y&&pos.y<=BTN_SKIP_WORD.y+BTN_SKIP_WORD.h){
      skipCurrentWord();
      return;
    }
    if(STATE.inputMode==="TAP"){ handleBubbleTap(pos.x, pos.y); }
    return;
  }
  // HERO_TURN_END
  if(STATE.turnPhase==="HERO_TURN_END"){
    if(pos.x>=340&&pos.x<=640&&pos.y>=555&&pos.y<=615){ advanceTurn(); return; }
    return;
  }
  // Lainnya
  if(!canPlayerAct()) return;
  enemies.forEach((en,idx)=>{
    if(en.hp>0){
      const ex=en.x-44,ey=en.y-52;
      if(pos.x>=ex&&pos.x<=ex+88&&pos.y>=ey&&pos.y<=ey+104){
        STATE.selectedEnemyIndex=idx;AudioSys.playSelect(650);
        spawnDamageNumber(en.x,en.y-90,"🎯 TARGET!","#38bdf8");
      }
    }
  });
}
canvas.addEventListener("pointerdown", handlePointerDown);

window.addEventListener("keydown",(e)=>{
  AudioSys.init();

  // ══════════════════════════════════════════════════════════
  // PRIORITAS TERTINGGI: HERO_TYPING
  // Hanya Enter + karakter A-Z yang diproses saat typing.
  // SEMUA shortcut keyboard game dimatikan di fase ini agar tidak
  // pernah bertabrakan dengan karakter yang sedang diketik.
  // ══════════════════════════════════════════════════════════
  if(STATE.turnPhase==="HERO_TYPING"){
    const isModifier = e.ctrlKey || e.altKey || e.metaKey;

    // 1. ENTER — selesai sesi
    if(e.code==="Enter" && !isModifier){
      e.preventDefault();
      finishHeroTypingTurn();
      return;
    }

    // 2. A-Z hanya di TYPE mode (bukan shortcut, tapi mekanik inti)
    if(!isModifier && e.key.length===1 && /[a-zA-Z]/.test(e.key)){
      e.preventDefault();
      if(STATE.inputMode==="TYPE"){
        handleTypingKey(e.key);
      }
      // Di TAP mode: abaikan input keyboard A-Z
      return;
    }

    // 3. Semua tombol shortcut/game lainnya diblokir total.
    if(!isModifier){
      e.preventDefault();
    }
    return;
  }

  // ══════════════════════════════════════════════════════════
  // Shortcut global (aktif di luar HERO_TYPING)
  // ══════════════════════════════════════════════════════════
  if(e.code==="F2"){e.preventDefault();AudioSys.toggleBgm();return;}
  if(e.code==="F3"){e.preventDefault();STATE.crtEnabled=!STATE.crtEnabled;AudioSys.playSelect(540);return;}
  if(e.code==="F1"){e.preventDefault();toggleInputMode();return;}

  // ══════════════════════════════════════════════════════════
  // TITLE
  // ══════════════════════════════════════════════════════════
  if(STATE.turnPhase==="TITLE"){
    if(e.code==="Enter"||e.code==="Space"){
      e.preventDefault();
      AudioSys.playSpecial(); AudioSys.startBgm(); startWalkInTransition();
    }
    return;
  }

  // ══════════════════════════════════════════════════════════
  // CAMPFIRE
  // ══════════════════════════════════════════════════════════
  if(STATE.turnPhase==="CAMPFIRE"){
    if(e.code==="Enter"||e.code==="Space"){
      e.preventDefault();
      if(STATE.offeredRelics.length>0){
        const cardW=240;
        const startX=(canvas.width-(STATE.offeredRelics.length*cardW+(STATE.offeredRelics.length-1)*20))/2;
        handleCampfireClick(startX+cardW/2, 390);
      }
    }
    return;
  }

  // ══════════════════════════════════════════════════════════
  // GAME OVER / VICTORY
  // ══════════════════════════════════════════════════════════
  if(isCombatFinished()){
    if(e.code==="Enter"||e.code==="Space"){
      e.preventDefault();
      if(performance.now()-STATE.overSince>900) resetGame();
    }
    return;
  }

  // ══════════════════════════════════════════════════════════
  // HERO_READY
  // ══════════════════════════════════════════════════════════
  if(STATE.turnPhase==="HERO_READY"){
    if(e.code==="Digit1"||e.code==="Numpad1"){ STATE.selectedSkillIndex=0; AudioSys.playSelect(500); return; }
    if(e.code==="Digit2"||e.code==="Numpad2"){ STATE.selectedSkillIndex=1; AudioSys.playSelect(500); return; }
    if(e.code==="Enter"||e.code==="Space"){ e.preventDefault(); beginHeroTypingTurn(); return; }
    if(e.code==="Tab"){ e.preventDefault(); skipTurn(); return; }
    if(e.code==="F4"){ e.preventDefault(); triggerPartyRush(); return; }
    return;
  }

  // ══════════════════════════════════════════════════════════
  // HERO_TURN_END
  // ══════════════════════════════════════════════════════════
  if(STATE.turnPhase==="HERO_TURN_END"){
    if(e.code==="Enter"||e.code==="Space"){ e.preventDefault(); advanceTurn(); }
    return;
  }
});
/* =========================================================
   MAIN LOOP
   ========================================================= */
let lastFrameTime=0;
function gameLoop(timestamp){
  STATE.animTimer=timestamp;
  const dt=lastFrameTime?Math.min(100,timestamp-lastFrameTime):16.6;
  lastFrameTime=timestamp;
  if(STATE.hitFreezeTimer>0){
    STATE.hitFreezeTimer-=dt;
    if(STATE.hitFreezeTimer>0){requestAnimationFrame(gameLoop);return;}
    STATE.hitFreezeTimer=0;
  }
  // Update turn timer
  if(STATE.turnPhase==="HERO_TYPING"){
    STATE.turnElapsed = performance.now() - STATE.turnTimeStart;
    if(STATE.turnElapsed >= STATE.turnTimeLimit){
      finishHeroTypingTurn();
    }
  }
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  if(STATE.screenShake>0){
    ctx.translate((Math.random()-0.5)*STATE.screenShake,(Math.random()-0.5)*STATE.screenShake);
    STATE.screenShake=Math.max(0,STATE.screenShake-0.6);
  }
  if(STATE.turnPhase==="TITLE"){drawTitleScreen();}
  else if(STATE.turnPhase==="CAMPFIRE"){drawCampfireScene();}
  else {
    updateHeroWalking(dt);
    drawDungeonBackground();
    const isWalkingPhase=STATE.turnPhase==="HERO_WALK_IN"||STATE.turnPhase==="HERO_WALK_OUT";
    if(!isWalkingPhase||STATE.turnPhase==="HERO_WALK_IN"){
      normalizeSelectedTarget();
      enemies.forEach((enemy,idx)=>{
        const isTargeted=STATE.selectedEnemyIndex===idx&&!isWalkingPhase;
        drawCharacterSprite(enemy,false,isTargeted,false);
      });
    }
    heroes.forEach((hero,idx)=>{
      const isCurrent=(STATE.turnPhase==="HERO_READY"||STATE.turnPhase==="HERO_TYPING"||STATE.turnPhase==="HERO_TURN_END")&&STATE.activeHeroIndex===idx;
      drawCharacterSprite(hero,isCurrent,false,isWalkingPhase);
    });
    updateAndDrawProjectiles();
    ctx.restore();
    ctx.save();
    if(!isWalkingPhase){
      drawTypingPanel();
    } else {
      ctx.fillStyle="rgba(15,23,42,0.85)";
      ctx.fillRect(0,480,canvas.width,100);
      ctx.strokeStyle="#38bdf8";ctx.lineWidth=2;
      ctx.strokeRect(0,480,canvas.width,100);
      ctx.fillStyle="#facc15";ctx.font="bold 20px monospace";ctx.textAlign="center";ctx.textBaseline="middle";
      if(STATE.turnPhase==="HERO_WALK_IN"){
        ctx.fillText(`MEMASUKI RUANG DUNGEON ${STATE.wave}...`,canvas.width/2,520);
        ctx.fillStyle="#94a3b8";ctx.font="13px monospace";
        ctx.fillText("Bersiap mengetik! Party bergerak ke posisi.",canvas.width/2,548);
      } else {
        ctx.fillText("RUANG DIBERSIHKAN! BERGERAK MAJU...",canvas.width/2,520);
      }
    }
  }
  for(let i=STATE.particles.length-1;i>=0;i--){
    const p=STATE.particles[i];
    p.x+=p.vx;p.y+=p.vy;p.life-=0.035;
    if(p.life<=0) STATE.particles.splice(i,1);
    else{ctx.fillStyle=p.color;ctx.globalAlpha=p.life;ctx.fillRect(p.x,p.y,p.size,p.size);ctx.globalAlpha=1;}
  }
  for(let i=STATE.damageNumbers.length-1;i>=0;i--){
    const d=STATE.damageNumbers[i];
    d.y+=d.vy;d.life-=d.decay||0.02;
    d.scaleT=(d.scaleT||0)+0.1;
    d.scale=0.5+Math.min(1.3,d.scaleT)*0.7;
    if(d.scale>1.3) d.scale=1.3-(d.scale-1.3)*0.3;
    if(d.life<=0) STATE.damageNumbers.splice(i,1);
    else{
      ctx.save();
      ctx.translate(d.x,d.y);
      ctx.scale(d.scale,d.scale);
      ctx.fillStyle=d.color;ctx.globalAlpha=d.life;
      ctx.font="bold 20px monospace";ctx.textAlign="center";
      ctx.fillText(d.text,0,0);
      ctx.restore();
      ctx.globalAlpha=1;
    }
  }
  drawGameOverlay();
  drawCrtEffect();
  ctx.restore();
  requestAnimationFrame(gameLoop);
}

/* =========================================================
   BOOT
   ========================================================= */
SpriteLibrary.init();
initCrtOverlay();
requestAnimationFrame(gameLoop);
</script>
